<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ FlowBoard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#060d18;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}

/* ── TOP BAR ── */
#topbar{background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.07);padding:11px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
.logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa,#fb7185);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
#search{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e2e8f0;padding:7px 13px;font-size:13px;width:190px;outline:none}
#search:focus{border-color:#60a5fa}
.topbar-stats{font-size:11px;color:#334155;white-space:nowrap}
.btn{border:none;border-radius:9px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:700;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.82}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.btn-ghost{background:rgba(255,255,255,.07);color:#94a3b8;border:1px solid rgba(255,255,255,.1)}
.btn-danger{background:rgba(251,113,133,.12);color:#fb7185;border:1px solid rgba(251,113,133,.25)}
.btn-green{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.25)}

/* ── BOARD ── */
#board{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 22px 40px}

/* ── GROUP ── */
.group{margin-bottom:28px}
.group-hdr{display:flex;align-items:center;gap:9px;padding:8px 2px 10px;border-bottom:2px solid rgba(255,255,255,.06);margin-bottom:12px}
.group-accent{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer}
.group-name{font-weight:800;font-size:14px;flex:1;cursor:text;color:#f1f5f9}
.group-chip{background:rgba(255,255,255,.06);border-radius:20px;padding:2px 9px;font-size:11px;color:#64748b;font-weight:700}
.collapse-btn{background:none;border:none;color:#475569;cursor:pointer;font-size:11px;padding:0 2px;line-height:1;flex-shrink:0}
.icon-btn{background:none;border:none;color:rgba(255,255,255,.22);cursor:pointer;font-size:17px;padding:0 3px;line-height:1;transition:color .15s}
.icon-btn:hover{color:rgba(255,255,255,.6)}
.group-cols{display:flex;gap:15px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}

/* ── COLUMN ── */
.col{min-width:268px;max-width:268px;flex-shrink:0;display:flex;flex-direction:column;border-radius:14px}
.col-hdr{border-radius:14px 14px 0 0;padding:10px 12px;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.08);border-bottom:none}
.col-name{flex:1;font-weight:700;font-size:12px;color:#f1f5f9;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.3)}
.col-body{border-radius:0 0 14px 14px;padding:8px 8px 10px;min-height:56px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(255,255,255,.06);border-top:none;transition:border-color .15s,box-shadow .15s}
.col-body.drag-over{border-color:#60a5fa !important;box-shadow:inset 0 0 18px rgba(96,165,250,.09)}

/* ── CARD ── */
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-left:3px solid;border-radius:10px;padding:9px 11px;cursor:grab;transition:background .15s,transform .15s,box-shadow .15s;user-select:none}
.card:hover{background:rgba(255,255,255,.1);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card.dragging{opacity:.25;cursor:grabbing}
.card.drop-above{margin-top:26px}
.card-title{font-weight:600;font-size:12px;color:#f1f5f9;margin-bottom:5px;line-height:1.4}
.prog-row{display:flex;justify-content:space-between;font-size:10px;color:#475569;margin-bottom:3px}
.prog-track{height:3px;background:rgba(255,255,255,.07);border-radius:99px;margin-bottom:6px}
.prog-fill{height:3px;border-radius:99px;transition:width .3s}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pri-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700}
.tag{background:rgba(255,255,255,.07);color:#94a3b8;border-radius:20px;padding:2px 6px;font-size:10px}

/* ── ADD CARD ── */
.add-card-btn{background:none;border:1px dashed rgba(255,255,255,.1);border-radius:9px;color:rgba(255,255,255,.28);padding:7px;cursor:pointer;font-size:12px;width:100%;transition:all .2s}
.add-card-btn:hover{border-color:#60a5fa;color:#60a5fa}
.add-inline{background:rgba(255,255,255,.055);border-radius:9px;padding:9px}
.add-inline input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:7px;color:#fff;padding:6px 9px;font-size:12px;outline:none;margin-bottom:7px}

/* ── COLOR PICKER ── */
.cpicker{position:absolute;top:20px;right:0;background:#1a2538;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:9px;display:flex;flex-wrap:wrap;gap:6px;width:140px;z-index:99;box-shadow:0 12px 40px rgba(0,0,0,.7)}
.cdot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .12s}
.cdot:hover,.cdot.on{border-color:#fff}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#0e1623;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px;width:510px;max-width:100%;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:800;color:#f1f5f9;margin-bottom:18px}
.lbl{display:block;font-size:10px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.finput{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;padding:8px 12px;font-size:13px;outline:none;width:100%;font-family:inherit}
.finput:focus{border-color:#60a5fa}
.fselect{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;padding:8px 12px;font-size:13px;outline:none;width:100%;font-family:inherit}

/* ── CHECKLIST ── */
.chk-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.checkbox{width:17px;height:17px;border-radius:5px;border:2px solid rgba(255,255,255,.2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.checkbox.on{background:#34d399;border-color:#34d399}

/* ── PRI BUTTONS ── */
.pri-btn{border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);padding:6px 13px;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;color:#64748b}

/* ── BACKUP ITEM ── */
.bak-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:9px;margin-bottom:7px}
.bak-name{font-weight:700;font-size:13px;color:#f1f5f9;margin-bottom:2px}
.bak-date{font-size:11px;color:#64748b}
.bak-actions{display:flex;gap:5px;flex-shrink:0}
.bak-actions button{border:none;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;font-weight:700}

/* ── TAG CHIP ── */
.tag-chip{background:rgba(255,255,255,.08);color:#94a3b8;border-radius:20px;padding:3px 9px;font-size:12px;display:inline-flex;align-items:center;gap:4px;margin:0 3px 3px 0}
.tag-chip .x{cursor:pointer;color:#475569;font-size:13px;line-height:1}

/* ── NOTICE ── */
#notif{position:fixed;bottom:22px;right:22px;background:#1a2538;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:11px 17px;font-size:13px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:all .28s;pointer-events:none}
#notif.show{opacity:1;transform:translateY(0)}

/* col-group move select */
.col-move-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.col-move-btn{border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#64748b;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
.col-move-btn.active{color:inherit}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">⚡ FlowBoard</div>
  <div id="stats" class="topbar-stats"></div>
  <div style="flex:1"></div>
  <input id="search" placeholder="🔍 Search…" oninput="render()">
  <button class="btn btn-green" onclick="showBackupModal()">💾 Backups</button>
  <button class="btn btn-ghost" onclick="showAddGroupModal()">＋ Group</button>
  <button class="btn btn-primary" onclick="showAddColModal(null)">＋ Column</button>
</div>

<div id="board"></div>
<div id="modal-root"></div>
<div id="notif"></div>

<script>
// ══════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════
const PAL=[
  {n:"Slate",   h:"#1e3a5f",b:"#0d1f33",a:"#60a5fa"},
  {n:"Violet",  h:"#3b1f6b",b:"#1a0f33",a:"#a78bfa"},
  {n:"Rose",    h:"#6b1f2e",b:"#2d0f15",a:"#fb7185"},
  {n:"Emerald", h:"#0f4f30",b:"#0a2518",a:"#34d399"},
  {n:"Amber",   h:"#6b4a00",b:"#2d1f00",a:"#fbbf24"},
  {n:"Teal",    h:"#0f4f4f",b:"#0a2525",a:"#2dd4bf"},
  {n:"Fuchsia", h:"#5c1a5c",b:"#2a0d2a",a:"#e879f9"},
  {n:"Orange",  h:"#6b2d00",b:"#2d1200",a:"#fb923c"},
  {n:"Sky",     h:"#0c3a5c",b:"#051a2e",a:"#38bdf8"},
];
const PRI=[
  {l:"Low",    d:"#34d399",b:"rgba(52,211,153,.15)"},
  {l:"Medium", d:"#fbbf24",b:"rgba(251,191,36,.15)"},
  {l:"High",   d:"#fb7185",b:"rgba(251,113,133,.15)"},
];

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let S={groups:[],cols:[]};
let drag=null;     // {cardId,fromColId}
let addTo=null;    // colId for add-card-inline
let EC=null;       // editing card deep copy
let openPicker=null;

function uid(){return '_'+Math.random().toString(36).slice(2,9)}

function defaultState(){
  return {
    groups:[
      {id:'g1',title:'🚀 Work',pi:0,col:false},
      {id:'g2',title:'🏠 Personal',pi:3,col:false},
    ],
    cols:[
      {id:'c1',gid:'g1',title:'📋 To Do',pi:0,cards:[
        {id:'k1',title:'Read design brief',pri:1,done:[],items:['Review mockups','Check copy','Note feedback'],tags:['design']},
        {id:'k2',title:'Set up dev environment',pri:0,done:[],items:[],tags:['dev']},
        {id:'k3',title:'Write project proposal',pri:2,done:[],items:['Outline goals','Add timeline','Budget section'],tags:['docs','urgent']},
      ]},
      {id:'c2',gid:'g1',title:'🔄 In Progress',pi:3,cards:[
        {id:'k4',title:'Build FlowBoard',pri:2,done:['Drag & drop'],items:['Drag & drop','Color themes','Card editing','Tags & priority'],tags:['dev']},
        {id:'k5',title:'Weekly team sync',pri:1,done:[],items:['Agenda','Meeting notes'],tags:['meetings']},
      ]},
      {id:'c3',gid:'g1',title:'👀 Review',pi:1,cards:[
        {id:'k6',title:'Homepage redesign',pri:1,done:['Wireframes'],items:['Wireframes','Typography','Final review'],tags:['design']},
      ]},
      {id:'c4',gid:'g1',title:'✅ Done',pi:4,cards:[
        {id:'k7',title:'Project kickoff',pri:0,done:['Intro','Q&A'],items:['Intro','Q&A'],tags:['meetings']},
      ]},
      {id:'c5',gid:'g2',title:'📝 Todo',pi:1,cards:[
        {id:'k8',title:'Grocery run',pri:0,done:[],items:['Milk','Bread','Eggs'],tags:['errands']},
        {id:'k9',title:'Book dentist appointment',pri:2,done:[],items:[],tags:['health']},
      ]},
      {id:'c6',gid:'g2',title:'✅ Done',pi:4,cards:[
        {id:'k10',title:'Gym session',pri:1,done:['Warmup','Cardio','Weights'],items:['Warmup','Cardio','Weights'],tags:['health']},
      ]},
    ]
  };
}

// ══════════════════════════════════════════════════
//  PERSISTENCE
// ══════════════════════════════════════════════════
function save(){
  try{ localStorage.setItem('fb4',JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const r=localStorage.getItem('fb4');
    if(r){ S=JSON.parse(r); return; }
  }catch(e){}
  S=defaultState(); save();
}

// ══════════════════════════════════════════════════
//  BACKUPS
// ══════════════════════════════════════════════════
function getBaks(){try{return JSON.parse(localStorage.getItem('fb4_baks')||'[]');}catch(e){return [];}}
function setBaks(a){localStorage.setItem('fb4_baks',JSON.stringify(a));}

function createBak(name){
  const a=getBaks();
  const tc=S.cols.reduce((n,c)=>n+c.cards.length,0);
  a.unshift({id:uid(),name:name||'Snapshot '+new Date().toLocaleString(),ts:Date.now(),cards:tc,data:JSON.stringify(S)});
  if(a.length>25)a.splice(25);
  setBaks(a);
  notify('📌 Snapshot saved!');
  showBackupModal();
}
function restoreBak(id){
  const b=getBaks().find(x=>x.id===id);
  if(!b||!confirm('Restore this snapshot? Your current board will be replaced.'))return;
  S=JSON.parse(b.data); save(); render(); closeModal();
  notify('✅ Board restored!');
}
function deleteBak(id){setBaks(getBaks().filter(x=>x.id!==id));showBackupModal();}
function exportBak(id){
  let data,name;
  if(id){const b=getBaks().find(x=>x.id===id);if(!b)return;data=b.data;name=b.name;}
  else{data=JSON.stringify(S);name='flowboard_export';}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=name.replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'_')+'_'+Date.now()+'.json';
  a.click();
}
function importBak(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.cols)throw 0;
        if(!confirm('Import file? Current board will be replaced.'))return;
        S=d;save();render();closeModal();notify('✅ Imported successfully!');
      }catch(e){alert('Invalid FlowBoard JSON file.');}
    };
    r.readAsText(f);
  };
  inp.click();
}

// ══════════════════════════════════════════════════
//  STATE OPERATIONS
// ══════════════════════════════════════════════════
// Groups
function addGroup(t){S.groups.push({id:uid(),title:t||'New Group',pi:0,col:false});save();render();}
function renameGroup(id,t){const g=S.groups.find(x=>x.id===id);if(g){g.title=t;save();render();}}
function setGroupPi(id,pi){const g=S.groups.find(x=>x.id===id);if(g){g.pi=pi;save();render();}}
function toggleGroupCol(id){const g=S.groups.find(x=>x.id===id);if(g){g.col=!g.col;save();render();}}
function delGroup(id){
  if(!confirm('Delete group? Columns stay but become ungrouped.'))return;
  S.groups=S.groups.filter(x=>x.id!==id);
  S.cols.forEach(c=>{if(c.gid===id)c.gid=null;});
  save();render();
}
// Cols
function addCol(gid,t){S.cols.push({id:uid(),gid:gid||null,title:t||'New Column',pi:0,cards:[]});save();render();}
function renameCol(id,t){const c=S.cols.find(x=>x.id===id);if(c){c.title=t;save();render();}}
function setColPi(id,pi){const c=S.cols.find(x=>x.id===id);if(c){c.pi=pi;save();render();}}
function delCol(id){if(!confirm('Delete this column and all its cards?'))return;S.cols=S.cols.filter(x=>x.id!==id);save();render();}
function setColGroup(colId,gid){const c=S.cols.find(x=>x.id===colId);if(c){c.gid=gid||null;save();render();}}
// Cards
function addCard(colId,t){
  const c=S.cols.find(x=>x.id===colId);
  if(!c||!t.trim())return;
  c.cards.push({id:uid(),title:t.trim(),pri:0,done:[],items:[],tags:[]});
  save();render();
}
function saveCard(card){
  for(const c of S.cols){const i=c.cards.findIndex(x=>x.id===card.id);if(i>=0){c.cards[i]=card;break;}}
  save();render();
}
function deleteCard(cid){
  for(const c of S.cols){const i=c.cards.findIndex(x=>x.id===cid);if(i>=0){c.cards.splice(i,1);break;}}
  save();render();
}
function moveCard(cid,fromId,toId,beforeId){
  const fc=S.cols.find(x=>x.id===fromId),tc=S.cols.find(x=>x.id===toId);
  if(!fc||!tc)return;
  const idx=fc.cards.findIndex(x=>x.id===cid);if(idx<0)return;
  const[card]=fc.cards.splice(idx,1);
  if(beforeId){const bi=tc.cards.findIndex(x=>x.id===beforeId);tc.cards.splice(bi<0?tc.cards.length:bi,0,card);}
  else tc.cards.push(card);
  save();render();
}
function getColOf(cid){for(const c of S.cols)if(c.cards.find(x=>x.id===cid))return c;return null;}

// ══════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════
function render(){
  save();
  const q=document.getElementById('search').value.toLowerCase().trim();
  const board=document.getElementById('board');
  const st=board.scrollTop;
  board.innerHTML='';

  // Stats
  const tc=S.cols.reduce((n,c)=>n+c.cards.length,0);
  document.getElementById('stats').textContent=`${S.groups.length} group${S.groups.length!==1?'s':''} · ${S.cols.length} cols · ${tc} cards`;

  // Groups
  S.groups.forEach(g=>{
    const gcols=S.cols.filter(c=>c.gid===g.id);
    board.appendChild(mkGroup(g,gcols,q,false));
  });

  // Ungrouped
  const ug=S.cols.filter(c=>!c.gid||!S.groups.find(g=>g.id===c.gid));
  if(ug.length){
    board.appendChild(mkGroup({id:'__ug',title:'📦 Ungrouped',pi:0,col:false},ug,q,true));
  }

  // Add group btn
  const r=document.createElement('div');
  r.style.cssText='padding:6px 0 20px';
  const b=document.createElement('button');
  b.className='btn btn-ghost';b.style.fontSize='12px';b.textContent='＋ Add Group';
  b.onclick=()=>showAddGroupModal();
  r.appendChild(b);board.appendChild(r);

  board.scrollTop=st;
}

function mkGroup(g,gcols,q,fake){
  const P=PAL[g.pi%PAL.length];
  const tc=gcols.reduce((n,c)=>n+c.cards.length,0);
  const wrap=document.createElement('div');wrap.className='group';

  // Header
  const hdr=document.createElement('div');hdr.className='group-hdr';
  hdr.style.borderBottomColor=P.a+'40';

  // accent dot (color picker trigger)
  const dot=document.createElement('div');
  dot.className='group-accent';dot.style.background=P.a;dot.title='Change group color';
  if(!fake)dot.onclick=()=>togglePicker('gp_'+g.id);
  hdr.appendChild(dot);

  if(!fake){
    const cb=document.createElement('button');cb.className='collapse-btn';
    cb.title=g.col?'Expand':'Collapse';cb.textContent=g.col?'▶':'▼';
    cb.onclick=()=>toggleGroupCol(g.id);hdr.appendChild(cb);
  }

  // title
  const nt=document.createElement('span');
  nt.className='group-name';nt.style.color=P.a;nt.textContent=g.title;
  if(!fake){nt.title='Double-click to rename';nt.ondblclick=()=>inlineRenameGroup(g.id,nt);}
  hdr.appendChild(nt);

  // count chip
  const ch=document.createElement('span');ch.className='group-chip';
  ch.textContent=tc+' card'+(tc!==1?'s':'');hdr.appendChild(ch);

  if(!fake){
    // color picker container
    const pp=document.createElement('div');pp.style.position='relative';
    const picker=document.createElement('div');picker.className='cpicker';picker.id='gp_'+g.id;picker.style.display='none';
    PAL.forEach((p,i)=>{
      const d=document.createElement('div');d.className='cdot'+(g.pi===i?' on':'');
      d.style.background=p.a;d.title=p.n;d.onclick=()=>{setGroupPi(g.id,i);};
      picker.appendChild(d);
    });
    pp.appendChild(picker);hdr.appendChild(pp);

    // add col btn
    const ac=document.createElement('button');ac.className='icon-btn';ac.title='Add column to this group';
    ac.textContent='+';ac.style.fontSize='19px';ac.onclick=()=>showAddColModal(g.id);hdr.appendChild(ac);

    // delete
    const db=document.createElement('button');db.className='icon-btn';db.title='Delete group';
    db.textContent='×';db.onclick=()=>delGroup(g.id);hdr.appendChild(db);
  }

  wrap.appendChild(hdr);

  if(!g.col){
    const crow=document.createElement('div');crow.className='group-cols';crow.id='gcols_'+g.id;
    gcols.forEach(col=>crow.appendChild(mkCol(col,q)));

    if(!fake){
      const pb=document.createElement('button');
      pb.style.cssText='min-width:56px;height:42px;background:rgba(255,255,255,.02);border:2px dashed rgba(255,255,255,.07);border-radius:12px;color:rgba(255,255,255,.22);cursor:pointer;font-size:20px;flex-shrink:0;transition:all .2s';
      pb.textContent='+';pb.title='Add column';
      pb.onmouseenter=()=>{pb.style.borderColor='rgba(255,255,255,.22)';pb.style.color='rgba(255,255,255,.5)';};
      pb.onmouseleave=()=>{pb.style.borderColor='rgba(255,255,255,.07)';pb.style.color='rgba(255,255,255,.22)';};
      pb.onclick=()=>showAddColModal(g.id);crow.appendChild(pb);
    }
    wrap.appendChild(crow);
  }
  return wrap;
}

function mkCol(col,q){
  const P=PAL[col.pi%PAL.length];
  const fc=col.cards.filter(k=>!q||k.title.toLowerCase().includes(q)||k.tags.some(t=>t.toLowerCase().includes(q)));
  const wrap=document.createElement('div');wrap.className='col';

  // Header
  const hdr=document.createElement('div');hdr.className='col-hdr';
  hdr.style.background=P.h;hdr.style.borderColor='rgba(255,255,255,.08)';

  const nt=document.createElement('span');nt.className='col-name';nt.textContent=col.title;
  nt.title='Double-click to rename';nt.ondblclick=()=>inlineRenameCol(col.id,nt);
  hdr.appendChild(nt);

  const cnt=document.createElement('span');cnt.className='col-count';cnt.style.color=P.a;
  cnt.textContent=col.cards.length;hdr.appendChild(cnt);

  // color picker
  const pp=document.createElement('div');pp.style.position='relative';
  const cd=document.createElement('div');
  cd.style.cssText=`width:13px;height:13px;border-radius:50%;background:${P.a};cursor:pointer;border:2px solid rgba(255,255,255,.3)`;
  cd.title='Change color';cd.onclick=()=>togglePicker('cp_'+col.id);pp.appendChild(cd);
  const picker=document.createElement('div');picker.className='cpicker';picker.id='cp_'+col.id;picker.style.display='none';
  PAL.forEach((p,i)=>{
    const d=document.createElement('div');d.className='cdot'+(col.pi===i?' on':'');
    d.style.background=p.a;d.title=p.n;d.onclick=()=>setColPi(col.id,i);
    picker.appendChild(d);
  });
  pp.appendChild(picker);hdr.appendChild(pp);

  const db=document.createElement('button');db.className='icon-btn';db.textContent='×';db.title='Delete column';
  db.onclick=()=>delCol(col.id);hdr.appendChild(db);
  wrap.appendChild(hdr);

  // Body
  const body=document.createElement('div');body.className='col-body';
  body.style.background=P.b;body.style.borderColor='rgba(255,255,255,.06)';
  body.id='cb_'+col.id;

  body.ondragover=e=>{e.preventDefault();body.classList.add('drag-over');};
  body.ondragleave=e=>{if(!body.contains(e.relatedTarget))body.classList.remove('drag-over');};
  body.ondrop=e=>{
    e.preventDefault();body.classList.remove('drag-over');
    if(!drag)return;
    moveCard(drag.cid,drag.from,col.id);drag=null;
  };

  fc.forEach(card=>body.appendChild(mkCard(card,col,P)));

  // Add card area
  const aa=document.createElement('div');aa.id='aa_'+col.id;
  if(addTo===col.id){
    const box=document.createElement('div');box.className='add-inline';
    const inp=document.createElement('input');inp.placeholder='Card title…';inp.id='ainp_'+col.id;
    inp.onkeydown=e=>{
      if(e.key==='Enter'){addCard(col.id,inp.value);addTo=null;}
      if(e.key==='Escape'){addTo=null;render();}
    };
    const row=document.createElement('div');row.style.cssText='display:flex;gap:7px';
    const ok=document.createElement('button');ok.className='btn btn-primary';ok.style.cssText='padding:4px 13px;font-size:12px';ok.textContent='Add';
    ok.onclick=()=>{addCard(col.id,inp.value);addTo=null;};
    const cn=document.createElement('button');cn.className='btn btn-ghost';cn.style.cssText='padding:4px 9px;font-size:12px';cn.textContent='Cancel';
    cn.onclick=()=>{addTo=null;render();};
    row.appendChild(ok);row.appendChild(cn);
    box.appendChild(inp);box.appendChild(row);
    aa.appendChild(box);
    setTimeout(()=>{const i=document.getElementById('ainp_'+col.id);if(i)i.focus();},10);
  } else {
    const ab=document.createElement('button');ab.className='add-card-btn';ab.textContent='+ Add card';
    ab.onclick=()=>{addTo=col.id;render();};
    aa.appendChild(ab);
  }
  body.appendChild(aa);
  wrap.appendChild(body);
  return wrap;
}

function mkCard(card,col,P){
  const pri=PRI[card.pri]||PRI[0];
  const pct=card.items.length?Math.round(card.done.length/card.items.length*100):null;
  const div=document.createElement('div');div.className='card';div.draggable=true;
  div.style.borderLeftColor=pri.d;

  let h=`<div class="card-title">${esc(card.title)}</div>`;
  if(pct!==null){
    h+=`<div class="prog-row"><span>Progress</span><span style="color:${pct===100?'#34d399':'#94a3b8'}">${pct}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${pct===100?'#34d399':P.a}"></div></div>`;
  }
  h+=`<div class="card-meta"><span class="pri-badge" style="background:${pri.b};color:${pri.d}">${pri.l}</span>
    ${card.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  div.innerHTML=h;

  div.ondragstart=e=>{drag={cid:card.id,from:col.id};div.classList.add('dragging');e.dataTransfer.effectAllowed='move';};
  div.ondragend=()=>{drag=null;div.classList.remove('dragging');document.querySelectorAll('.drop-above').forEach(x=>x.classList.remove('drop-above'));};
  div.ondragover=e=>{e.preventDefault();e.stopPropagation();div.classList.add('drop-above');};
  div.ondragleave=()=>div.classList.remove('drop-above');
  div.ondrop=e=>{
    e.preventDefault();e.stopPropagation();div.classList.remove('drop-above');
    document.getElementById('cb_'+col.id)?.classList.remove('drag-over');
    if(!drag)return;
    moveCard(drag.cid,drag.from,col.id,card.id);drag=null;
  };
  div.onclick=()=>showCardModal(card,col.id);
  return div;
}

// ══════════════════════════════════════════════════
//  INLINE EDITING
// ══════════════════════════════════════════════════
function inlineRenameGroup(id,el){
  const g=S.groups.find(x=>x.id===id);if(!g)return;
  const P=PAL[g.pi%PAL.length];
  const inp=document.createElement('input');
  inp.value=g.title;inp.style.cssText=`background:rgba(0,0,0,.4);border:none;border-bottom:2px solid ${P.a};color:${P.a};font-size:14px;font-weight:800;outline:none;width:180px;padding:2px 4px`;
  inp.onblur=()=>renameGroup(id,inp.value||g.title);
  inp.onkeydown=e=>{if(e.key==='Enter')renameGroup(id,inp.value||g.title);if(e.key==='Escape')render();};
  el.replaceWith(inp);inp.focus();inp.select();
}
function inlineRenameCol(id,el){
  const col=S.cols.find(x=>x.id===id);if(!col)return;
  const P=PAL[col.pi%PAL.length];
  const inp=document.createElement('input');
  inp.value=col.title;inp.style.cssText=`flex:1;background:rgba(0,0,0,.4);border:none;border-bottom:2px solid ${P.a};color:#fff;font-size:12px;font-weight:700;outline:none;padding:2px 4px;min-width:0`;
  inp.onblur=()=>renameCol(id,inp.value||col.title);
  inp.onkeydown=e=>{if(e.key==='Enter')renameCol(id,inp.value||col.title);if(e.key==='Escape')render();};
  el.replaceWith(inp);inp.focus();inp.select();
}

function togglePicker(id){
  const el=document.getElementById(id);if(!el)return;
  const vis=el.style.display!=='none';
  document.querySelectorAll('.cpicker').forEach(x=>x.style.display='none');
  if(!vis)el.style.display='flex';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.cpicker')&&!e.target.closest('[onclick*="Picker"]')&&!e.target.closest('[onclick*="togglePicker"]')){
    document.querySelectorAll('.cpicker').forEach(x=>x.style.display='none');
  }
});

function closeModal(){document.getElementById('modal-root').innerHTML='';}

function showAddGroupModal(){
  setModal(`
    <div class="modal-title">Add Group</div>

function showAddColModal(gid){
  const opts=S.groups.map(g=>`<option value="${g.id}" ${g.id===gid?'selected':''}>${esc(g.title)}</option>`).join('');
  setModal(`
    <div class="modal-title">Add Column</div>
    <label class="lbl">Column Name</label>

// ── CARD MODAL ──────────────────────────────────
function showCardModal(card,colId){
  EC=JSON.parse(JSON.stringify(card));
  renderCM(colId);
}
function renderCM(colId){
  const c=EC;const pri=PRI[c.pri]||PRI[0];
  const pct=c.items.length?Math.round(c.done.length/c.items.length*100):null;

  const colBtns=S.cols.map(col=>{
    const P=PAL[col.pi%PAL.length];const act=col.id===colId;
    return `<button class="col-move-btn ${act?'active':''}" style="${act?'border-color:'+P.a+';background:'+P.h+';color:'+P.a:''}" onclick="moveCMCard('${c.id}','${colId}','${col.id}')">${esc(col.title)}</button>`;
  }).join('');

  const chkHtml=c.items.map((it,i)=>{
    const done=c.done.includes(it);
    return `<div class="chk-row">
      <div class="checkbox ${done?'on':''}" onclick="toggleCMItem(${i},'${colId}')">${done?'<span style="color:#000;font-size:10px;font-weight:900">✓</span>':''}</div>
      <span style="flex:1;font-size:13px;color:${done?'#475569':'#cbd5e1'};text-decoration:${done?'line-through':'none'}">${esc(it)}</span>
      <span onclick="removeCMItem(${i},'${colId}')" style="color:#334155;cursor:pointer;font-size:15px;padding:0 4px">×</span>
    </div>`;
  }).join('');

  const tagHtml=c.tags.map(t=>`<span class="tag-chip">${esc(t)}<span class="x" onclick="removeCMTag('${escA(t)}','${colId}')">×</span></span>`).join('');

  setModal(`
    <input id="cm-t" value="${escA(c.title)}" style="width:100%;background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,.15);color:#f1f5f9;font-size:19px;font-weight:700;padding:4px 0 10px;outline:none;margin-bottom:20px;font-family:inherit" oninput="EC.title=this.value">
    
    <label class="lbl">Priority</label>
    <div style="display:flex;gap:8px;margin-bottom:18px">
      ${PRI.map((p,i)=>`<button class="pri-btn" style="${c.pri===i?'background:'+p.b+';border-color:'+p.d+';color:'+p.d:''}" onclick="setCMPri(${i},'${colId}')">${p.l}</button>`).join('')}
    </div>

    <label class="lbl">Move to Column</label>
    <div class="col-move-btns" style="margin-bottom:18px">${colBtns}</div>

    <label class="lbl">Tags</label>
    <div id="cm-tags" style="margin-bottom:7px;min-height:22px">${tagHtml}</div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <input id="cm-nt" class="finput" placeholder="Add tag…" style="flex:1" onkeydown="if(event.key==='Enter')addCMTag('${colId}')">
      <button class="btn btn-ghost" style="padding:7px 11px" onclick="addCMTag('${colId}')">+</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
      <label class="lbl" style="margin-bottom:0">Checklist</label>
      ${pct!==null?`<span style="font-size:12px;font-weight:700;color:${pct===100?'#34d399':'#64748b'}">${pct}% done</span>`:''}
    </div>
    ${pct!==null?`<div style="height:4px;background:rgba(255,255,255,.07);border-radius:99px;margin-bottom:10px"><div style="height:4px;width:${pct}%;background:${pct===100?'#34d399':'#60a5fa'};border-radius:99px;transition:width .3s"></div></div>`:''}
    <div id="cm-chk">${chkHtml}</div>
    <div style="display:flex;gap:8px;margin-top:8px;margin-bottom:24px">
      <input id="cm-ni" class="finput" placeholder="Add checklist item…" style="flex:1" onkeydown="if(event.key==='Enter')addCMItem('${colId}')">
      <button class="btn btn-ghost" style="padding:7px 11px" onclick="addCMItem('${colId}')">+</button>
    </div>

    <div style="display:flex;justify-content:space-between">
      <button class="btn btn-danger" onclick="deleteCard('${c.id}');closeModal()">🗑 Delete</button>
      <div style="display:flex;gap:9px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveCard(EC);closeModal()">Save</button>
      </div>
    </div>
  `,'510px');
}
function setCMPri(p,cid){EC.pri=p;renderCM(cid);}
function addCMTag(cid){const i=document.getElementById('cm-nt');const t=i.value.trim();if(!t||EC.tags.includes(t))return;EC.tags.push(t);i.value='';renderCM(cid);}
function removeCMTag(t,cid){EC.tags=EC.tags.filter(x=>x!==t);renderCM(cid);}
function addCMItem(cid){const i=document.getElementById('cm-ni');const t=i.value.trim();if(!t)return;EC.items.push(t);i.value='';renderCM(cid);}
function removeCMItem(idx,cid){const it=EC.items[idx];EC.done=EC.done.filter(x=>x!==it);EC.items.splice(idx,1);renderCM(cid);}
function toggleCMItem(idx,cid){const it=EC.items[idx];if(EC.done.includes(it))EC.done=EC.done.filter(x=>x!==it);else EC.done.push(it);renderCM(cid);}
function moveCMCard(cid,from,to){if(from===to)return;saveCard(EC);moveCard(cid,from,to);closeModal();}

  const baks=getBaks();
  const tc=S.cols.reduce((n,c)=>n+c.cards.length,0);
  const bakHtml=baks.length===0
    ?'<div style="color:#334155;font-size:13px;padding:16px 0 8px">No snapshots yet. Click "Save Snapshot" to create one.</div>'
    :baks.map(b=>`
      <div class="bak-item">
        <div style="flex:1">
          <div class="bak-name">${esc(b.name)}</div>

        </div>
        <div class="bak-actions">
          <button onclick="restoreBak('${b.id}')" style="background:rgba(96,165,250,.15);color:#60a5fa">Restore</button>

          <button onclick="deleteBak('${b.id}')" style="background:rgba(251,113,133,.1);color:#fb7185">Delete</button>

    </div>

    <div style="background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:11px 14px;margin-bottom:18px;font-size:13px;color:#34d399">
      ✅ <strong>Auto-save is ON</strong> — every change saves instantly to this browser.

    <div style="display:flex;gap:9px;margin-bottom:18px">

    <div style="display:flex;gap:9px;margin-bottom:22px">

      2. At home: open FlowBoard HTML file → <em>Import from .json</em>
    </div>
  `,'560px',()=>{const i=document.getElementById('bak-n');if(i)i.focus();});
}

// ── MODAL HELPER ─────────────────────────────────
function setModal(html,w,cb){
  const root=document.getElementById('modal-root');
  root.innerHTML='';
  const ov=document.createElement('div');ov.className='overlay';ov.onclick=closeModal;
  const m=document.createElement('div');m.className='modal';if(w)m.style.width=w;
  m.onclick=e=>e.stopPropagation();m.innerHTML=html;
  ov.appendChild(m);root.appendChild(ov);
  if(cb)setTimeout(cb,10);
}

function notify(msg){
  const el=document.getElementById('notif');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2600);
}

// ══════════════════════════════════════════════════
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();createBak('Quick Save '+new Date().toLocaleTimeString());}
});
