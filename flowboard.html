// ── AUTO-SNAPSHOT STORE ──
function _autoKey(){return 'fb4_auto_'+(_activeKey||'local');}
// Auto-snapshot stores for boards no longer known to this device (share key
// removed, or a local-only board this device lost track of). DETECTION only
// — never deletes. Used both to build the boot-time review modal and by the
// emergency reclaim path below.
// DETECTION only — never deletes. Returns a Promise of groups, each carrying
// its full snaps array (so the review modal renders synchronously). Reads the
// IDB 'auto' store when active, else the localStorage fallback.
function _findOrphanAutoSnaps(){
  var valid={local:1};
  getKeys().forEach(function(k){if(k.key)valid[k.key]=1;});
  if(_activeKey)valid[_activeKey]=1;
  var sk=localStorage.getItem('fb4_active_key');if(sk)valid[sk]=1;
  function pack(boardKey,storageKey,arr){
    if(!arr||!arr.length)return null;
    var tss=arr.map(function(s){return s.ts||0;});
    return{storageKey:storageKey,boardKey:boardKey,count:arr.length,snaps:arr,
      sizeBytes:new Blob([JSON.stringify(arr)]).size,
      oldest:Math.min.apply(null,tss),newest:Math.max.apply(null,tss)};
  }
  if(!_backupsUseIdb){
    var groups=[];
    for(var i=0;i<localStorage.length;i++){
      var lk=localStorage.key(i);
      if(!lk||lk.indexOf('fb4_auto_')!==0)continue;
      var bk=lk.slice(9);if(valid[bk])continue;
      var arr;try{arr=JSON.parse(localStorage.getItem(lk)||'[]');}catch(e){continue;}
      var g=pack(bk,lk,arr);if(g)groups.push(g);
    }
    return Promise.resolve(groups);
  }
  return _idbKeys('auto').then(function(keys){
    var orphanKeys=keys.filter(function(kk){return kk.indexOf('fb4_auto_')===0&&!valid[kk.slice(9)];});
    return orphanKeys.reduce(function(chain,kk){
      return chain.then(function(acc){
        return _idbGet('auto',kk).then(function(arr){var g=pack(kk.slice(9),kk,arr);if(g)acc.push(g);return acc;});
      });
    },Promise.resolve([]));
  });
}
// Delete one orphan store (dispatches IDB vs localStorage). Returns a Promise.
function _deleteOrphanStore(storageKey){
  if(_backupsUseIdb)return _idbDelete('auto',storageKey);
  try{localStorage.removeItem(storageKey);}catch(e){}
  return Promise.resolve(true);
}
// Sync emergency-path purge (save() quota catch). localStorage ONLY — after IDB
// migration there are no fb4_auto_* keys in localStorage, so this naturally
// finds nothing (culling IDB can't free the localStorage quota that triggered
// the failure anyway, and the live board is tiny). Still does real work under
// the localStorage-fallback backend. Never touches manual snapshots.
function _purgeOrphanAutoSnaps(){
  var total=0;
  var valid={local:1};
  getKeys().forEach(function(k){if(k.key)valid[k.key]=1;});
  if(_activeKey)valid[_activeKey]=1;
  var sk=localStorage.getItem('fb4_active_key');if(sk)valid[sk]=1;
  var orphans=[];
  for(var i=0;i<localStorage.length;i++){
    var lk=localStorage.key(i);
    if(lk&&lk.indexOf('fb4_auto_')===0&&!valid[lk.slice(9)])orphans.push(lk);
  }
  orphans.forEach(function(lk){
    try{var n=JSON.parse(localStorage.getItem(lk)||'[]').length;localStorage.removeItem(lk);total+=n;}catch(e){}
  });
  return total;
}
// Reclaim localStorage after a quota failure: first drop orphaned auto-snap
// stores, then trim every board's auto-snaps down to the 3 newest (auto-snaps
// are self-regenerating, so this is the safest thing to shed). Never touches
// manual snapshots. Returns the number of snapshots removed.
function _reclaimSpace(){
  var removed=_purgeOrphanAutoSnaps();
  var autoKeys=[];
  for(var i=0;i<localStorage.length;i++){
    var lk=localStorage.key(i);
    if(lk&&lk.indexOf('fb4_auto_')===0)autoKeys.push(lk);
  }
  autoKeys.forEach(function(lk){
    try{
      var arr=JSON.parse(localStorage.getItem(lk)||'[]');
      if(arr.length>3){
        arr.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
        removed+=arr.length-3;
        localStorage.setItem(lk,JSON.stringify(arr.slice(0,3)));
      }
    }catch(e){}
  });
  return removed;
}
function _lsGetAutoBaks(){try{return JSON.parse(localStorage.getItem(_autoKey())||'[]');}catch(e){return[];}}
function _lsSetAutoBaks(a){try{localStorage.setItem(_autoKey(),JSON.stringify(a));}catch(e){console.warn('[AutoSnap] Storage full — auto-snapshot skipped.');}}
function getAutoBaks(){
  if(!_backupsUseIdb)return _lsGetAutoBaks();
  if(_autoMirrorKey!==_autoKey()){_hydrateAutoMirror();return[];}
  return _autoMirror||[];
}
function setAutoBaks(a){
  if(!_backupsUseIdb)return _lsSetAutoBaks(a);
  var k=_autoKey();
  if(_autoMirrorKey!==k){console.warn('[AutoSnap] setAutoBaks skipped — mirror not hydrated for '+k);_hydrateAutoMirror();return;}
  _autoMirror=a;_idbPut('auto',k,a);
}

function _createAutoSnap(name,trigger){
  var tc=_syncCardCount(S);
  var autos=getAutoBaks();
  autos.unshift({id:uid(),name:name,ts:Date.now(),trigger:trigger||'auto',cards:tc,data:JSON.stringify(S)});
  if(autos.length>15)autos.splice(15);
  setAutoBaks(autos);
  _savesSinceAutoSnap=0;
  // Push to cloud immediately (debounced 2s — rapid snaps batch into one write)
  _pushAutoSnapsToCloud(autos);
}

// Called once at startup — snapshots the board as it was when the session began.
// Only fires if the board has been modified since the last auto-snapshot.
function _sessionStartSnap(){
  var boardTs=S.lastModified||0;
  if(boardTs===0)return; // never been saved — default demo state, skip
  var autos=getAutoBaks();
  var lastAutoTs=autos.length>0?autos[0].ts:0;
  if(boardTs<=lastAutoTs)return; // no changes since last auto-snap
  _createAutoSnap('Opened \u2013 '+new Date().toLocaleString(),'session');
}

// Called before destructive actions (delCol, delGroup, restore, import).
function _autoSnapBefore(label){
  _createAutoSnap(label,'destructive');
}

function restoreAutoBak(id){
  var b=getAutoBaks().find(function(x){return x.id===id;});
  if(!b||!confirm('Restore this auto-snapshot? Current board will be replaced.'))return;
  _autoSnapBefore('Before: Restore auto-snapshot \u2013 '+new Date().toLocaleTimeString());
  _undoStack=[];_redoStack=[];_persistUndoSession();_updateUndoUI();
  S=JSON.parse(b.data);save();render();closeModal();notify('✅ Board restored from auto-snapshot!');
}
function deleteAutoBak(id){
  var remaining=getAutoBaks().filter(function(x){return x.id!==id;});
  setAutoBaks(remaining);
  _pushAutoSnapsToCloud(remaining);
  showBackupModal();
}

// ── ORPHANED AUTO-SNAPSHOT REVIEW (item 4) ──
// Runs once per fresh page load (see boot sequence). Never deletes anything
// automatically — every deletion here requires an explicit click. If the
// user dismisses without acting, nothing changes, and the exact same groups
// are found and re-shown on the NEXT startup, for as long as they exist.
// Detection is async (IDB); results are cached in _orphanGroups so the modal
// and its click handlers stay synchronous against in-memory data. Each group
// carries its full snaps array. Only the actual delete touches storage (async).
var _orphanGroups=[];
function _checkOrphanSnapshots(){
  _findOrphanAutoSnaps().then(function(groups){
    if(groups&&groups.length){_orphanGroups=groups;showOrphanSnapshotsModal();}
  });
}

        '<div style="font-size:11px;color:var(--txt-d)">'+g.count+' snapshot'+(g.count!==1?'s':'')+' &middot; '+kb+'KB</div>'+

  setModal(

// ── SNAPSHOT DIFF VIEWER ──
var _diffRows=null; // stores {type, textA, textB} keyed by row number

function _computeSnapshotDiff(stateA,stateB){
  var mapA={},mapB={};
  (stateA.cols||[]).forEach(function(col){
    (col.cards||[]).forEach(function(card){mapA[card.id]={card:card,col:col.title||'Untitled'};});
  });
  (stateB.cols||[]).forEach(function(col){
    (col.cards||[]).forEach(function(card){mapB[card.id]={card:card,col:col.title||'Untitled'};});
  });
  var added=[],deleted=[],modified=[];
  Object.keys(mapB).forEach(function(id){
    if(!mapA[id]){added.push({card:mapB[id].card,col:mapB[id].col});}
    else if(JSON.stringify(mapA[id].card)!==JSON.stringify(mapB[id].card)){
      modified.push({cardA:mapA[id].card,colA:mapA[id].col,cardB:mapB[id].card,colB:mapB[id].col});
    }
  });
  Object.keys(mapA).forEach(function(id){
    if(!mapB[id])deleted.push({card:mapA[id].card,col:mapA[id].col});
  });
  return{added:added,modified:modified,deleted:deleted};
}

function showDiffPicker(){
  var allSnaps=[];
  getBaks().forEach(function(b){allSnaps.push({id:b.id,label:b.name,ts:b.ts,src:'m'});});
  getAutoBaks().forEach(function(b){allSnaps.push({id:b.id,label:b.name,ts:b.ts,src:'a'});});
  allSnaps.sort(function(a,b){return b.ts-a.ts;});
  if(allSnaps.length<2){notify('⚠️ Need at least 2 snapshots to compare.');return;}
  var opts=allSnaps.map(function(s){
    return '<option value="'+s.id+'|'+s.src+'">'+esc(s.label)+' — '+new Date(s.ts).toLocaleString()+'</option>';
  }).join('');
  var opts2=allSnaps.map(function(s,i){
    return '<option value="'+s.id+'|'+s.src+'"'+(i===1?' selected':'')+'>'+esc(s.label)+' — '+new Date(s.ts).toLocaleString()+'</option>';
  }).join('');
  setModal(
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">'+
      '<div style="font-size:17px;font-weight:800;color:var(--txt-b)">⇄ Compare Snapshots</div>'+
      '<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="showBackupModal()">← Back</button>'+
    '</div>'+
    '<label class="lbl">Snapshot A <span style="font-weight:400;color:var(--txt-dd)">(older / before)</span></label>'+
    '<select id="diff-sel-a" class="finput" style="width:100%;margin-bottom:14px">'+opts+'</select>'+
    '<label class="lbl">Snapshot B <span style="font-weight:400;color:var(--txt-dd)">(newer / after)</span></label>'+
    '<select id="diff-sel-b" class="finput" style="width:100%;margin-bottom:22px">'+opts2+'</select>'+
    '<button class="btn btn-green" style="width:100%;font-size:13px" onclick="runSnapshotDiff()">⚡ Show Diff</button>',
  '540px');
}

function runSnapshotDiff(){
  var selA=document.getElementById('diff-sel-a');
  var selB=document.getElementById('diff-sel-b');
  if(!selA||!selB)return;
  var partsA=selA.value.split('|'),partsB=selB.value.split('|');
  var idA=partsA[0],srcA=partsA[1],idB=partsB[0],srcB=partsB[1];
  if(idA===idB){notify('⚠️ Please select two different snapshots.');return;}
  showSnapshotDiff(idA,srcA,idB,srcB);
}

function showSnapshotDiff(idA,srcA,idB,srcB){
  var all=getBaks().concat(getAutoBaks());
  var snapA=all.find(function(x){return x.id===idA;});
  var snapB=all.find(function(x){return x.id===idB;});
  if(!snapA||!snapB){notify('⚠️ Snapshot not found.');return;}
  var stateA=JSON.parse(snapA.data),stateB=JSON.parse(snapB.data);
  var diff=_computeSnapshotDiff(stateA,stateB);
  var total=diff.added.length+diff.modified.length+diff.deleted.length;
  var fmtTs=function(ts){var d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
  var trunc=function(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;};

  var header=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
      '<div style="font-size:17px;font-weight:800;color:var(--txt-b)">⇄ Snapshot Diff</div>'+
      '<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="showDiffPicker()">← Back</button>'+
    '</div>'+
    '<div style="font-size:12px;padding:8px 10px;background:var(--surf2);border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;line-height:1.7">'+
      '<span style="color:var(--txt-d)">A:</span> <strong>'+esc(snapA.name)+'</strong> <span style="color:var(--txt-dd)">'+fmtTs(snapA.ts)+'</span><br>'+
      '<span style="color:var(--txt-d)">B:</span> <strong>'+esc(snapB.name)+'</strong> <span style="color:var(--txt-dd)">'+fmtTs(snapB.ts)+'</span>'+
    '</div>';

  var statsBar=
    '<div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap">'+
      '<span style="background:rgba(16,185,129,.15);color:#10b981;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">+'+diff.added.length+' added</span>'+
      '<span style="background:rgba(245,158,11,.15);color:#f59e0b;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">~'+diff.modified.length+' modified</span>'+
      '<span style="background:rgba(225,29,72,.12);color:#e11d48;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">–'+diff.deleted.length+' deleted</span>'+
    '</div>';

  if(total===0){
    setModal(header+statsBar+'<div style="text-align:center;padding:28px;color:var(--txt-d);font-size:13px">✓ Snapshots are identical — no differences found.</div>','580px');
    return;
  }

  // group by sheet
  var sheets={};
  var order=[];
  function addToSheet(name,entry){
    if(!sheets[name]){sheets[name]=[];order.push(name);}
    sheets[name].push(entry);
  }
  diff.modified.forEach(function(item){addToSheet(item.colB||item.colA,{type:'mod',item:item});});
  diff.added.forEach(function(item){addToSheet(item.col,{type:'add',item:item});});
  diff.deleted.forEach(function(item){addToSheet(item.col,{type:'del',item:item});});

  _diffRows={};
  var rn=0;
  var rows='';
  order.forEach(function(sheet){
    rows+='<div class="diff-sheet-header">Sheet: '+esc(sheet)+'</div>';
    sheets[sheet].forEach(function(entry){
      rn++;
      var n=rn,type=entry.type,item=entry.item;
      if(type==='add'){
        var t=item.card.text||'(empty)';
        _diffRows[n]={type:'add',textA:'',textB:t};
        rows+='<div class="diff-row diff-add">'+
          '<span class="diff-type-badge diff-badge-add">+</span>'+
          '<span class="diff-rownum">#'+n+'</span>'+
          '<span class="diff-content" id="dc-'+n+'" style="flex:1">'+esc(trunc(t,80))+'</span>'+
          '<button class="diff-expand-btn" onclick="diffExpand('+n+')" title="Toggle full text">▼</button>'+
        '</div>';
      }else if(type==='del'){
        var t=item.card.text||'(empty)';
        _diffRows[n]={type:'del',textA:t,textB:''};

function diffExpand(n){
  if(!_diffRows||!_diffRows[n])return;
  var d=_diffRows[n];
  var cnt=document.getElementById('dc-'+n);
  var btn=cnt&&cnt.nextElementSibling;
  if(!cnt)return;
  if(cnt.dataset.exp){
    // collapse
    if(d.type==='mod'){
      cnt.innerHTML='<span style="opacity:.55">was: </span>'+esc(d.textA.length>40?d.textA.slice(0,40)+'…':d.textA)+'<br><span style="opacity:.55">now: </span>'+esc(d.textB.length>40?d.textB.slice(0,40)+'…':d.textB);
    }else{
      var t=d.type==='add'?d.textB:d.textA;
      cnt.textContent=t.length>80?t.slice(0,80)+'…':t;
    }

    }else{

    }

  }
}

// Write the full auto-snaps array to Firebase. Debounced 2s so rapid snap creation
// (e.g. session-start + before-destructive firing in quick succession) sends one write.
// Uses the same in-flight counter pattern as the main board-state sync.
function _pushAutoSnapsToCloud(autos){
  if(!FIREBASE_ENABLED||!_autoSnapsRef)return;
  clearTimeout(_autoSnapsWriteTimer);
  _autoSnapsWriteTimer=setTimeout(function(){
    _autoSnapsWriteTimer=null;
    var payload=autos||getAutoBaks();
    if(!payload.length)return; // nothing to push
    _autoSnapsPending++;
    _autoSnapsRef.set(payload).then(function(){
      _autoSnapsPending=Math.max(0,_autoSnapsPending-1);
    }).catch(function(err){
      _autoSnapsPending=Math.max(0,_autoSnapsPending-1);
      console.warn('[AutoSnap] Cloud write failed (snap still saved locally):',err);
    });
  },2000);
}

// ── UNDO / REDO ──
function _updateUndoUI(){
  var ub=document.getElementById('undo-btn');
  var rb=document.getElementById('redo-btn');
  if(ub){
    var ul=_undoStack.length;
    ub.disabled=ul===0;
    ub.title=ul===0?'Nothing to undo':'Undo ('+ul+' step'+(ul!==1?'s':'')+') \u2014 Ctrl+Z';
  }
  if(rb){
    var rl=_redoStack.length;
    rb.disabled=rl===0;
    rb.title=rl===0?'Nothing to redo':'Redo ('+rl+' step'+(rl!==1?'s':'')+') \u2014 Ctrl+Y';
  }
}
function _persistUndoSession(){
  try{
    // Mirror last 10 undo entries to sessionStorage for crash/F5 recovery within the same browser session.
    // sessionStorage clears automatically on browser/tab close — no stale data bleeds across sessions.
    var slice=_undoStack.slice(-10);
    sessionStorage.setItem('fb4_undo',JSON.stringify(slice));
  }catch(e){}
}
function _restoreUndoSession(){
  try{
    var stored=sessionStorage.getItem('fb4_undo');
    if(!stored)return;
    var arr=JSON.parse(stored);
    if(!Array.isArray(arr)||arr.length===0)return;
    _undoStack=arr;
    _updateUndoUI();
    notify('↩ Undo history restored from last session ('+arr.length+' step'+(arr.length!==1?'s':'')+')');
  }catch(e){}
}

// Push current S to undo stack BEFORE a mutation. Call at the start of every action
// function, after any guard/early-return checks but before mutating S.
function _pushUndo(){
  if(_skipFbWrite||_undoInProgress)return; // skip remote renders and undo/redo applies
  _undoStack.push(JSON.stringify(S));
  if(_undoStack.length>50)_undoStack.shift();
  _redoStack=[]; // a new action invalidates any forward redo history
  _persistUndoSession();
  _updateUndoUI();
}

function doUndo(){
  if(_undoStack.length===0)return;
  _redoStack.push(JSON.stringify(S));
  if(_redoStack.length>50)_redoStack.shift();
  _undoInProgress=true;
  S=JSON.parse(_undoStack.pop());
  save();render();
  _undoInProgress=false;
  _persistUndoSession();
  _updateUndoUI();
  notify('↩ Undone'+((_undoStack.length>0)?' ('+_undoStack.length+' more)':''));
}

function doRedo(){
  if(_redoStack.length===0)return;
  _undoStack.push(JSON.stringify(S));
  if(_undoStack.length>50)_undoStack.shift();
  _undoInProgress=true;
  S=JSON.parse(_redoStack.pop());
  save();render();
  _undoInProgress=false;
  _persistUndoSession();
  _updateUndoUI();
  notify('↪ Redone'+((_redoStack.length>0)?' ('+_redoStack.length+' more)':''));
}

function addCard(colId,t,color){
  var c=S.cols.find(function(x){return x.id===colId;});if(!c||!t.trim())return;
  _pushUndo();
  var card={id:uid(),title:t.trim(),pri:0,color:color||null,done:[],items:[],itemMeta:[],tags:[],desc:'',due:'',completed:false,createdAt:Date.now(),updatedAt:Date.now(),completedAt:null};
  c.cards.push(card);newCardId=card.id;save();render();newCardId=null;

function saveCard(card){
  _pushUndo();
  card.updatedAt=Date.now();
  var allDone=card.items&&card.items.length>0&&card.items.every(function(it){return card.done.includes(it);});
  if((card.completed||allDone)&&!card.completedAt)card.completedAt=Date.now();
  else if(!card.completed&&!allDone)card.completedAt=null;
  for(var i=0;i<S.cols.length;i++){
    var idx=S.cols[i].cards.findIndex(function(x){return x.id===card.id;});
    if(idx>=0){S.cols[i].cards[idx]=card;break;}
  }
  save();render();
}
function deleteCard(cid){
  _pushUndo();
  for(var i=0;i<S.cols.length;i++){
    var idx=S.cols[i].cards.findIndex(function(x){return x.id===cid;});
    if(idx>=0){S.cols[i].cards.splice(idx,1);break;}
  }
  save();render();
}
function duplicateCard(cid,colId){
  var col=S.cols.find(function(x){return x.id===colId;});if(!col)return;
  var idx=col.cards.findIndex(function(x){return x.id===cid;});if(idx<0)return;

function mkArchiveCard(card,showRestore){
  var pri=PRI[card.pri]||PRI[0];
  var borderColor=card.color||pri.d;
  var pct=card.items.length?Math.round(card.done.length/card.items.length*100):null;
  var dc=dueClass(card.due);
  var light=isLight();
  var div=document.createElement('div');
  div.className='card';
  div.style.borderLeftColor=borderColor;
  div.style.cursor='default';
  if(card.color){div.dataset.color=card.color;div.style.background=hexToRgba(card.color,light?.09:.13);}
  var h='<div class="card-title">'+esc(card.title)+'</div>';
  if(pct!==null){
    h+='<div class="prog-row"><span>Progress</span><span style="color:'+(pct===100?'#10b981':'var(--txt-m)')+'">'+pct+'%</span></div>'+
      '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+(pct===100?'#10b981':borderColor)+'"></div></div>';
  }
  h+='<div class="card-meta"><span class="pri-badge" style="background:'+pri.b+';color:'+pri.d+'">'+pri.l+'</span>'+
    card.tags.map(function(t){return'<span class="tag">'+esc(t)+'</span>';}).join('');
  if(dc){var icon=dc==='over'?'⚠ ':dc==='soon'?'⏰ ':'📅 ';h+='<span class="due-badge due-'+dc+'">'+icon+dueLabel(card.due)+'</span>';}
  h+='</div>';
  h+='<div style="display:flex;gap:5px;margin-top:8px">';
  if(showRestore)h+='<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;flex:1" onclick="restoreCard(\''+card.id+'\')">↩ Restore</button>';
  h+='<button class="btn btn-danger" style="padding:3px 8px;font-size:11px'+(showRestore?'':';flex:1')+'" onclick="deleteArchivedCard(\''+card.id+'\')">🗑</button>';
  h+='</div>';
  div.innerHTML=h;
  return div;
}

function moveCard(cid,fromId,toId,beforeId){
  var fc=S.cols.find(function(x){return x.id===fromId;}),tc=S.cols.find(function(x){return x.id===toId;});
  if(!fc||!tc)return;
  var idx=fc.cards.findIndex(function(x){return x.id===cid;});if(idx<0)return;
  _pushUndo();
  var card=fc.cards.splice(idx,1)[0];
  card.updatedAt=Date.now();
  if(beforeId){var bi=tc.cards.findIndex(function(x){return x.id===beforeId;});tc.cards.splice(bi<0?tc.cards.length:bi,0,card);}
  else tc.cards.push(card);
  settleCardId=cid;save();render();settleCardId=null;
}

function moveColumn(colId,toGroupId,beforeColId){
  var fc=S.cols.find(function(x){return x.id===colId;});
  if(!fc)return;
  var idx=S.cols.findIndex(function(x){return x.id===colId;});
  _pushUndo();
  var col=S.cols.splice(idx,1)[0];
  col.gid=toGroupId;
  if(beforeColId){
    var bi=S.cols.findIndex(function(x){return x.id===beforeColId;});
    S.cols.splice(bi<0?S.cols.length:bi,0,col);
  }else{
    var lastIdx=-1;
    for(var i=0;i<S.cols.length;i++){if(S.cols[i].gid===toGroupId)lastIdx=i;}
    if(lastIdx!==-1)S.cols.splice(lastIdx+1,0,col);
    else S.cols.push(col);
  }

var _tip=null;
// Sub-pixel truncation test. scrollWidth/clientWidth are integers, so text
// overflowing by <1px shows an ellipsis while the naive comparison says it
// fits; measuring the text node via a Range catches that.
function _chkTxtTruncated(el){
  if(el.scrollWidth>el.clientWidth)return true;
  var r=document.createRange();r.selectNodeContents(el);
  return r.getBoundingClientRect().width>el.getBoundingClientRect().width+0.5;
}
// Row-level preview: bound to the whole .chk-row, not just the text span, so
// hovering the chevron/✕/badge zone (where the ellipsis actually sits) still
// previews the full text.
function showChkTip(e,row){
  var span=row.querySelector('.chk-txt');
  if(!span||!_chkTxtTruncated(span))return;
  showTipAlways(e,span.textContent);
}
function hideTip(){if(_tip)_tip.style.opacity='0';}
function showTipAlways(e,text){
  if(!_tip){_tip=document.createElement('div');_tip.className='chk-tip';document.body.appendChild(_tip);}
  _tip.textContent=text;_tip.style.opacity='1';
  _tip.style.background=isLight()?'#fff':'#1e2d42';
  _tip.style.color=isLight()?'#1d1d1f':'#e2e8f0';
  _tip.style.borderColor=isLight()?'rgba(0,0,0,.12)':'rgba(255,255,255,.1)';
  _tip.style.left=Math.min(e.clientX+14,window.innerWidth-280)+'px';
  _tip.style.top=(e.clientY+14)+'px';
}
function moveTip(e){
  if(!_tip||_tip.style.opacity==='0')return;
  _tip.style.left=Math.min(e.clientX+14,window.innerWidth-280)+'px';
  _tip.style.top=(e.clientY+14)+'px';
}

function renderCal(){
  var drop=document.getElementById(_calDropId(_calField));if(!drop)return;
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var today=new Date();today.setHours(0,0,0,0);
  var selStr=_calField==='created'?(EC.createdAt?_isoDate(new Date(EC.createdAt)):''):
    _calField==='item'?((EC.itemMeta[_calItemIdx]&&EC.itemMeta[_calItemIdx].due)||''):
    (EC.due||'');
  var first=new Date(_calYear,_calMonth,1);
  var startDay=first.getDay();
  var daysInMonth=new Date(_calYear,_calMonth+1,0).getDate();
  var prevDays=new Date(_calYear,_calMonth,0).getDate();
  var h='<div class="cal-hdr">'+
    '<button class="cal-nav" onclick="calNav(-1)">◂</button>'+
    '<span class="cal-hdr-title">'+MONTHS[_calMonth]+' '+_calYear+'</span>'+
    '<button class="cal-nav" onclick="calNav(1)">▸</button>'+
  '</div><div class="cal-grid">';
  DAYS.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<startDay;i++){
    var pd=prevDays-startDay+1+i;
    h+='<div class="cal-day other">'+pd+'</div>';
  }
  for(var d=1;d<=daysInMonth;d++){
    var dt=new Date(_calYear,_calMonth,d);
    var iso=_calYear+'-'+String(_calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='cal-day';
    if(dt.getTime()===today.getTime())cls+=' today';

    if(dt<today&&dt.getTime()!==today.getTime())cls+=' past';
    h+='<div class="'+cls+'" onclick="pickCalDay(\''+iso+'\')">'+d+'</div>';
  }
  var totalCells=startDay+daysInMonth;
  var rem=totalCells%7?7-totalCells%7:0;

function closeChkSortMenu(){

function toggleChkSortMenu(e,colId){
  e.stopPropagation();
  if(document.getElementById('chk-sort-drop')){closeChkSortMenu();return;}
  var btn=e.currentTarget,r=btn.getBoundingClientRect();
  var d=document.createElement('div');d.id='chk-sort-drop';d.className='chk-sort-drop';
  var html=CHK_SORT_OPTS.map(function(o){
    return '<button class="chk-sort-opt'+(_chkSortMode===o.id?' on':'')+'" onclick="applyChkSort(\''+o.id+'\',\''+colId+'\')">'+o.label+'</button>';
  }).join('');
  if(_chkSorted)html+='<button class="chk-sort-opt" onclick="applyChkSort(null,\''+colId+'\')">↺ Original Order</button>';
  d.innerHTML=html;
  d.style.top=(r.bottom+6)+'px';
  document.body.appendChild(d);
  var dw=d.offsetWidth;
  d.style.left=Math.max(8,Math.min(r.right-dw,window.innerWidth-dw-8))+'px';
  // Capture-phase dismissal: the card modal calls stopPropagation() on its own
  // clicks, so a bubble-phase document listener would never see clicks inside
  // the modal. Capturing runs top-down before that, so it catches every click.
  // Clicks on the trigger button or inside the menu are ignored here — their
  // own handlers (toggle / applyChkSort) manage those cases.
  _chkSortDismiss=function(ev){
    if(ev.type==='click'&&(d.contains(ev.target)||btn.contains(ev.target)))return;
    closeChkSortMenu();
  };
  setTimeout(function(){
    document.addEventListener('click',_chkSortDismiss,true);
    document.addEventListener('scroll',_chkSortDismiss,true);
    window.addEventListener('resize',_chkSortDismiss);
  },0);
}
function applyChkSort(mode,colId){
  closeChkSortMenu();
  if(!_chkSorted&&mode!==null){
    _chkOrigItems=EC.items.slice();_chkOrigMeta=EC.itemMeta.slice();
  }
  if(mode===null){
    if(_chkOrigItems){EC.items=_chkOrigItems.slice();EC.itemMeta=_chkOrigMeta.slice();}
    _chkSorted=false;_chkOrigItems=null;_chkOrigMeta=null;_chkSortMode=null;
  }else{
    var idxs=EC.items.map(function(it,i){return i;});
    var order;
    if(mode==='date'){
      order=idxs.slice().sort(function(a,b){
        var da=EC.itemMeta[a].due,db=EC.itemMeta[b].due;
        if(!da&&!db)return a-b;
        if(!da)return 1;if(!db)return -1;
        return da<db?-1:da>db?1:a-b;
      });
    }else if(mode==='priority'){
      order=idxs.slice().sort(function(a,b){
        var pa=EC.itemMeta[a].pri,pb=EC.itemMeta[b].pri;
        var va=pa==null?-1:pa,vb=pb==null?-1:pb;
        if(va===vb)return a-b;
        return vb-va;
      });
    }else if(mode==='done-bottom'){
      order=idxs.filter(function(i){return !EC.done.includes(EC.items[i]);}).concat(idxs.filter(function(i){return EC.done.includes(EC.items[i]);}));
    }
    var srcItems=EC.items,srcMeta=EC.itemMeta;
    EC.items=order.map(function(i){return srcItems[i];});
    EC.itemMeta=order.map(function(i){return srcMeta[i];});
    _chkSorted=true;_chkSortMode=mode;
  }
  _expandedChk.clear();_persistExpandedChk();
  refreshChk(colId);
}

// ── EDGE AUTO-SCROLL DURING DRAG ──
// While a column/card drag is active and the pointer sits near the edge of a
// scrollable container, scroll it so drags can reach off-screen destinations.
// Runs as a rAF loop (not per-pointermove) so scrolling continues while the
// pointer is held still inside the edge zone.
var _dragScrollRAF=null;
function _startDragScroll(){
  if(_dragScrollRAF)return;
  _dragScrollRAF=requestAnimationFrame(_dragScrollTick);
}
function _dragScrollTick(){
  if(!_pd||!_pd.moved||_pd.curX===undefined){_dragScrollRAF=null;return;}
  var EDGE=70,MAX=16,x=_pd.curX,y=_pd.curY,scrolled=false;
  // speed ramps from 0 at the zone boundary to MAX at the container edge
  function spd(depth){return Math.ceil(Math.min(1,depth/EDGE)*MAX);}
  // horizontal: the column row under the pointer
  // returns true only if the container actually scrolled (clamped no-ops don't count)
  function nudge(el,prop,delta){var b=el[prop];el[prop]=b+delta;return el[prop]!==b;}
  var row=_pd.lastHit&&_pd.lastHit.closest?_pd.lastHit.closest('.group-cols'):null;
  if(row){
    var r=row.getBoundingClientRect();
    var right=Math.min(r.right,window.innerWidth),left=Math.max(r.left,0);
    if(x>right-EDGE)scrolled=nudge(row,'scrollLeft',spd(x-(right-EDGE)))||scrolled;
    else if(x<left+EDGE)scrolled=nudge(row,'scrollLeft',-spd((left+EDGE)-x))||scrolled;
  }
  // vertical: a card drag inside a height-limited column body (card drags
  // carry a cid; column drags carry type:'col')
  if(_pd.cid){
    var body=_pd.lastHit&&_pd.lastHit.closest?_pd.lastHit.closest('.col-body'):null;
    if(body&&body.scrollHeight>body.clientHeight){
      var b=body.getBoundingClientRect();
      if(y>b.bottom-40)scrolled=nudge(body,'scrollTop',spd(y-(b.bottom-40)))||scrolled;
      else if(y<b.top+40)scrolled=nudge(body,'scrollTop',-spd((b.top+40)-y))||scrolled;
    }
  }
  // vertical: the board itself (groups stacked beyond the viewport)
  var board=document.getElementById('board');
  if(board){
    var br=board.getBoundingClientRect();
    if(y>br.bottom-EDGE)scrolled=nudge(board,'scrollTop',spd(y-(br.bottom-EDGE)))||scrolled;
    else if(y<br.top+EDGE)scrolled=nudge(board,'scrollTop',-spd((br.top+EDGE)-y))||scrolled;
  }
  // content moved under a stationary pointer — refresh the hit + drop indicator
  if(scrolled&&_pd.ghost){
    _pd.ghost.style.display='none';
    var hit=document.elementFromPoint(x,y);
    _pd.ghost.style.display='';
    _pd.lastHit=hit;
    updateDropIndicator(hit,x,y);
  }
  _dragScrollRAF=requestAnimationFrame(_dragScrollTick);
}

function initPointerDrag(){
  document.addEventListener('pointerdown',function(e){
    if(e.button!==0||e.target.closest('input,textarea,button,select,a,.cpicker,.cm-col-drop,.cm-color-drop'))return;
    var st=e.target.closest('.group-cols');
    if(!st)st=e.target.closest('#topbar');
    if(!st)st=document.getElementById('board');
    if(st){
      if(e.pointerType==='mouse'||e.pointerType==='touch'){
        _swipe={active:true,x:e.clientX,y:e.clientY,vx:0,vy:0,time:Date.now(),target:st,moved:false,dir:null};
        cancelAnimationFrame(_momentumTimer);
      }
    }
  });
  document.addEventListener('pointermove',function(e){
    if(window._pendingPd){
      var threshold=e.pointerType==='touch'?15:5;
      if(Math.abs(e.clientX-window._pendingPd.startX)>threshold||Math.abs(e.clientY-window._pendingPd.startY)>threshold){
        if(window._pendingPd.el)window._pendingPd.el.classList.remove('grab-fading');
        clearTimeout(window._pdTimer);window._pendingPd=null;
      }
    }
    if(_pd){
      _swipe.active=false;
      var dx=e.clientX-_pd.startX,dy=e.clientY-_pd.startY;
      if(!_pd.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        _pd.moved=true;
        _pd.el.classList.remove('grab-fading');_pd.el.style.boxShadow='';_pd.el.style.transform='';
        if(!_pd.ghost){
          var g=_pd.el.cloneNode(true);g.id='dg';

          g.style.cssText='position:fixed;pointer-events:none;z-index:9999;opacity:.88;width:'+_pd.el.offsetWidth+'px;transform:rotate(2deg) scale(1.04);box-shadow:0 16px 48px rgba(0,0,0,.5);border-radius:10px;transition:none;';
          document.body.appendChild(g);_pd.ghost=g;

          document.body.style.userSelect='none';

      }

      _pd.ghost.style.top=(e.clientY-_pd.oy)+'px';
      _pd.ghost.style.display='none';
      var hit=document.elementFromPoint(e.clientX,e.clientY);

      updateDropIndicator(hit,e.clientX,e.clientY);

    }

      var dx=e.clientX-_swipe.x,dy=e.clientY-_swipe.y;
      if(!_swipe.moved && (Math.abs(dx)>2||Math.abs(dy)>2)){
        _swipe.moved=true;
        _swipe.dir=Math.abs(dx)>Math.abs(dy)?'x':'y';
      }
      if(_swipe.moved&&_swipe.target){
        if(_swipe.dir==='x'){
          var t=_swipe.target;
          if((t.classList&&t.classList.contains('group-cols'))||t.id==='topbar') t.scrollLeft-=dx;
        }else{
          var board=document.getElementById('board');if(board)board.scrollTop-=dy;
        }
        var now=Date.now(),dt=Math.max(1,now-_swipe.time);
        _swipe.vx=dx/dt;_swipe.vy=dy/dt;_swipe.time=now;_swipe.x=e.clientX;_swipe.y=e.clientY;
      }
    }
  });
  document.addEventListener('pointerup',function(){
    if(window._pendingPd){if(window._pendingPd.el)window._pendingPd.el.classList.remove('grab-fading');clearTimeout(window._pdTimer);window._pendingPd=null;}
    if(_swipe.active){
      _swipe.active=false;
      if(_swipe.moved){
        var prevent=function(ev){ev.stopPropagation();ev.preventDefault();document.removeEventListener('click',prevent,true);};
        document.addEventListener('click',prevent,true);
        setTimeout(function(){document.removeEventListener('click',prevent,true);},50);
      }
      var vx=_swipe.vx*16,vy=_swipe.vy*16,target=_swipe.target;
      if(_swipe.dir==='x') vy=0; else vx=0;
      if(Math.abs(vx)>1||Math.abs(vy)>1){
        var animate=function(){
          vx*=0.92;vy*=0.92;
          if(Math.abs(vx)<0.5&&Math.abs(vy)<0.5)return;
          if(_swipe.dir==='x'){
            if((target.classList&&target.classList.contains('group-cols'))||target.id==='topbar') target.scrollLeft-=vx;
          }else{
            var board=document.getElementById('board');if(board)board.scrollTop-=vy;
          }
          _momentumTimer=requestAnimationFrame(animate);
        };
        animate();
      }
    }
    if(!_pd)return;
    var pd=_pd;_pd=null;
    document.body.style.userSelect='';
    if(pd.ghost)pd.ghost.remove();
    pd.el.classList.remove('grab-fading');pd.el.style.opacity='';pd.el.style.boxShadow='';pd.el.style.transform='';
    var ind=document.getElementById('drop-ind');if(ind)ind.remove();
    var indCol=document.getElementById('drop-ind-col');if(indCol)indCol.remove();
    document.querySelectorAll('.col-body.drag-over').forEach(function(x){x.classList.remove('drag-over');});
    if(!pd.moved)return;
    var suppress=function(e){e.stopPropagation();e.preventDefault();document.removeEventListener('click',suppress,true);};
    document.addEventListener('click',suppress,true);
    if(pd.type==='col'){
      if(pd.dropGroupId!==undefined){
        moveColumn(pd.colId, pd.dropGroupId, pd.dropBeforeColId);
      }
    }else{
      if(pd.dropColId){
        var destCol=S.cols.find(function(c){return c.id===pd.dropColId;});
        if(destCol&&destCol.sort){destCol.sort=false;notify('↕ Priority sort disabled');}
        settleCardId=pd.cid;moveCard(pd.cid,pd.fromColId,pd.dropColId,pd.dropBeforeId||null);settleCardId=null;
      }
    }
  });
  document.addEventListener('pointercancel',function(){
    if(window._pendingPd){if(window._pendingPd.el)window._pendingPd.el.classList.remove('grab-fading');clearTimeout(window._pdTimer);window._pendingPd=null;}
    _swipe.active=false;cancelAnimationFrame(_momentumTimer);
    if(!_pd)return;
    var pd=_pd;_pd=null;
    document.body.style.userSelect='';
    if(pd.ghost)pd.ghost.remove();
    pd.el.classList.remove('grab-fading');pd.el.style.opacity='';pd.el.style.boxShadow='';pd.el.style.transform='';
    var ind=document.getElementById('drop-ind');if(ind)ind.remove();
    var indCol=document.getElementById('drop-ind-col');if(indCol)indCol.remove();
    document.querySelectorAll('.col-body.drag-over').forEach(function(x){x.classList.remove('drag-over');});
  });
}
// ── CARD DATE FILTER ──
var _cardFilter=localStorage.getItem('fb4_filter')||'all';
var CARD_FILTERS=[
  {id:'all',          label:'All cards'},
  {id:'incomplete',   label:'☐ Incomplete only'},
  {id:'hasDue',       label:'📅 Has due date'},
  {id:'createdToday', label:'Created today'},
  {id:'created7',     label:'Created — last 7 days'},
  {id:'worked7',      label:'Worked on — last 7 days'},
  {id:'completedWeek',label:'Completed this week'},
  {id:'completed7',   label:'Completed — last 7 days'}
];
function _cardIsComplete(k){
  return !!k.completed||(k.items&&k.items.length>0&&k.items.every(function(it){return k.done.includes(it);}));
}
function cardPassesFilter(k,f){
  f=f||_cardFilter;
  if(!f||f==='all')return true;
  var now=Date.now(),day=86400000;
  if(f==='incomplete')return !_cardIsComplete(k);
  if(f==='hasDue')return !!k.due||(k.itemMeta||[]).some(function(m){return !!(m&&m.due);});
  if(f==='createdToday'){var t0=new Date();t0.setHours(0,0,0,0);return (k.createdAt||0)>=t0.getTime();}
  if(f==='created7')return (k.createdAt||0)>=now-7*day;
  if(f==='worked7')return (k.updatedAt||k.createdAt||0)>=now-7*day;
  if(f==='completedWeek'){
    var w=new Date();w.setHours(0,0,0,0);
    var dow=(w.getDay()+6)%7; // Monday = start of week
    return !!k.completedAt&&k.completedAt>=w.getTime()-dow*day;
  }
  if(f==='completed7')return !!k.completedAt&&k.completedAt>=now-7*day;
  return true;
}
// returns true if at least one (non-archived) card in this column passes the given filter
function _colVisible(col,f){
  f=f||_cardFilter;
  if(!f||f==='all')return true;
  return col.cards.some(function(k){return !k.archived&&cardPassesFilter(k,f);});
}
function updateFilterBtn(){
  var b=document.getElementById('filter-btn');if(!b)return;
  var f=CARD_FILTERS.find(function(x){return x.id===_cardFilter;});
  var active=_cardFilter&&_cardFilter!=='all';
  b.textContent=active?'📅 '+f.label:'📅 Filter';
  b.classList.toggle('toggled-on',active);
}
// returns the list of columns belonging to a group (or the synthetic Ungrouped group)
function _gcolsFor(gid){
  return S.cols.filter(function(c){
    if(c.archived)return false;
    if(gid==='__ug')return !c.gid||!S.groups.find(function(g){return g.id===c.gid;});
    return c.gid===gid;
  });
}
// adds .anim-filter-in to col/group DOM nodes that became visible going oldFilter -> newFilter
function _animateFilterIn(oldFilter,newFilter){
  var board=document.getElementById('board');
  S.cols.filter(function(c){return !c.archived;}).forEach(function(col){
    if(!_colVisible(col,oldFilter)&&_colVisible(col,newFilter)){
      var el=board.querySelector('[data-colid="'+col.id+'"]');
      if(el)el.classList.add('anim-filter-in');
    }
  });
  S.groups.concat([{id:'__ug'}]).forEach(function(g){
    var gcols=_gcolsFor(g.id);
    if(!gcols.length)return;
    var wasVis=gcols.some(function(c){return _colVisible(c,oldFilter);});
    var willVis=gcols.some(function(c){return _colVisible(c,newFilter);});
    if(!wasVis&&willVis){
      var gel=board.querySelector('.group[data-gid="'+g.id+'"]');
      if(gel)gel.classList.add('anim-filter-in');
    }
  });
}
// FLIP-slides elements that stay visible into their new positions after a filter-driven reflow
function _flipSurvivors(staying){
  if(!staying.length)return;
  var board=document.getElementById('board'),moves=[];
  staying.forEach(function(s){
    var sel=s.type==='col'?'[data-colid="'+s.id+'"]':'.group[data-gid="'+s.id+'"]';
    var el=board.querySelector(sel);
    if(!el)return;
    var newRect=el.getBoundingClientRect();
    var dx=s.rect.left-newRect.left,dy=s.rect.top-newRect.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    el.style.transition='none';
    el.style.transform='translate('+dx+'px,'+dy+'px)';
    moves.push(el);
  });
  if(!moves.length)return;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      moves.forEach(function(el){
        el.style.transition='transform .25s ease';
        el.style.transform='';
      });
      setTimeout(function(){
        moves.forEach(function(el){el.style.transition='';el.style.transform='';});
      },300);
    });
  });
}
function setCardFilter(id){
  if(id===_cardFilter){closeFilterDrop();return;}
  var oldFilter=_cardFilter;
  closeFilterDrop();
  var board=document.getElementById('board'),goingHidden=[],staying=[];
  S.cols.filter(function(c){return !c.archived;}).forEach(function(col){
    var wasVis=_colVisible(col,oldFilter),willVis=_colVisible(col,id);
    var el=board.querySelector('[data-colid="'+col.id+'"]');
    if(wasVis&&!willVis){
      if(el)goingHidden.push(el);
    }else if(wasVis&&willVis&&el){
      staying.push({type:'col',id:col.id,rect:el.getBoundingClientRect()});
    }
  });
  S.groups.concat([{id:'__ug'}]).forEach(function(g){
    var gcols=_gcolsFor(g.id);
    if(!gcols.length)return;
    var wasVis=gcols.some(function(c){return _colVisible(c,oldFilter);});
    var willVis=gcols.some(function(c){return _colVisible(c,id);});
    var gel=board.querySelector('.group[data-gid="'+g.id+'"]');
    if(wasVis&&!willVis){
      if(gel)goingHidden.push(gel);
    }else if(wasVis&&willVis&&gel){
      staying.push({type:'group',id:g.id,rect:gel.getBoundingClientRect()});
    }
  });
  var apply=function(){
    _cardFilter=id;localStorage.setItem('fb4_filter',id);
    updateFilterBtn();render();
    _animateFilterIn(oldFilter,id);
    _flipSurvivors(staying);
  };
  if(goingHidden.length){
    goingHidden.forEach(function(el){el.classList.add('anim-filter-out');});
    setTimeout(apply,300);
  }else{
    apply();
  }
}
function closeFilterDrop(){var d=document.getElementById('filter-drop');if(d)d.remove();}
function toggleFilterDrop(e){
  e.stopPropagation();
  if(document.getElementById('filter-drop')){closeFilterDrop();return;}
  var btn=document.getElementById('filter-btn'),r=btn.getBoundingClientRect();
  var d=document.createElement('div');d.id='filter-drop';
  d.innerHTML=CARD_FILTERS.map(function(f){
    return '<button class="filter-opt'+(f.id===_cardFilter?' on':'')+'" onclick="setCardFilter(\''+f.id+'\')">'+f.label+'</button>';
  }).join('');
  d.style.top=(r.bottom+6)+'px';
  document.body.appendChild(d);
  // align right edge to button, clamp to viewport
  var dw=d.offsetWidth;
  d.style.left=Math.max(8,Math.min(r.right-dw,window.innerWidth-dw-8))+'px';
  setTimeout(function(){
    var off=function(ev){if(!d.contains(ev.target)){closeFilterDrop();document.removeEventListener('click',off);}};
    document.addEventListener('click',off);
  },0);
}
function _dateOnly(ts){
  return ts?_fmtDate(new Date(ts)):'—';
}
// ── MOVE COLLAPSED COLUMNS TO END (per group) ──
function moveCollapsedToEnd(gid){
  var open=[],closed=[];
  S.cols.forEach(function(c){
    if(c.gid===gid&&!c.archived)(c.collapsed?closed:open).push(c);
  });
  if(!closed.length){notify('No collapsed columns in this group.');return;}
  _pushUndo();
  var firstIdx=S.cols.findIndex(function(c){return c.gid===gid&&!c.archived;});
  var rest=S.cols.filter(function(c){return !(c.gid===gid&&!c.archived);});
  var args=[firstIdx,0].concat(open).concat(closed);
  rest.splice.apply(rest,args);
  S.cols=rest;
  save();render();notify('⇥ Collapsed columns moved to the end.');
}

function mkCard(card,col,P,fillId,expanded){

  if(dc){

function _mkDueLabelHtml(c){
  var dc=c.completed?'done':dueClass(c.due);
  if(dc==='done'){
    return '<span style="font-size:12px;font-weight:800;flex-shrink:0;color:#10b981;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:5px 12px">✓ Done</span>';
  }else if(dc){
    var dlColor=dc==='over'?'#e11d48':dc==='soon'?'#f59e0b':'#60a5fa';
    var dlBg=dc==='over'?'rgba(225,29,72,.15)':dc==='soon'?'rgba(245,158,11,.12)':'rgba(96,165,250,.12)';
    var dlBd=dc==='over'?'rgba(225,29,72,.4)':dc==='soon'?'rgba(245,158,11,.35)':'rgba(96,165,250,.25)';
    var dlGlow=dc==='over'?'0 0 12px rgba(225,29,72,.4),0 0 4px rgba(225,29,72,.2)':dc==='soon'?'0 0 12px rgba(245,158,11,.35),0 0 4px rgba(245,158,11,.15)':'none';
    var dlIcon=dc==='over'?'⚠ Overdue':dc==='soon'?'⏰ Due soon':'📅 '+dueLabel(c.due);
    return '<span style="font-size:12px;font-weight:800;flex-shrink:0;color:'+dlColor+';background:'+dlBg+';border:1px solid '+dlBd+';border-radius:10px;padding:5px 12px;box-shadow:'+dlGlow+';'+(dc==='over'?'animation:deadlinePulse 2s ease-in-out infinite':'')+'">'+dlIcon+'</span>';
  }else if(c.dueAuto){
    return '<span style="font-size:12px;font-weight:800;flex-shrink:0;color:#10b981;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:5px 12px">✅ Due dates complete</span>';
  }
  return '';
}
function _mkDueActionsHtml(c,colId){
  var doneBtn=c.completed
    ?'<button class="btn btn-ghost" style="padding:4px 9px;font-size:11px;flex-shrink:0" onclick="EC.completed=false;EC.completedAt=null;saveCard(EC);renderCM(\''+colId+'\')">↩ Reopen</button>'
    :'<button class="btn btn-green" style="padding:4px 9px;font-size:11px;flex-shrink:0" onclick="markCMDone(\''+colId+'\')">✓ Done</button>';
  // When due dates are synced from items, offer a one-click escape hatch that
  // clears every item's due date (sync itself stays intact — the card due
  // simply mirrors the now-empty item dues).
  var clearAllBtn='<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;flex-shrink:0" title="Clear due dates on all checklist items" onclick="clearAllItemDues(\''+colId+'\')">✕</button>';
  if(c.dueAuto)return (c.due?doneBtn:'')+clearAllBtn;
  return (c.due?
        doneBtn+
        '<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px;flex-shrink:0" onclick="EC.due=\'\';EC.completed=false;EC.completedAt=null;saveCard(EC);renderCM(\''+colId+'\')">✕</button>'
      :'');
}
function clearAllItemDues(colId){
  if(!confirm('Clear the due dates on all checklist items?\n\nThe card’s synced due date will clear with them.'))return;
  _autoSnapBefore('Before: Clear all item due dates – '+new Date().toLocaleTimeString());
  _ensureItemMeta(EC);
  EC.itemMeta.forEach(function(m){if(m)m.due='';});
  _syncCardDueFromItems(EC);
  EC.due=''; // sync leaves the stale derived date in place once no item has a due
  saveCard(EC);
  renderCM(colId);
}

// Custom oversized grab handle for the description box (the native
// resize:vertical corner is ~17px and unstylable cross-browser; this one is
// double the size, always visible, and pointer-based so it also works with
// touch). Height persists through the same EC.descH path the native corner
// uses, which stays enabled as a fallback.
function _initDescResize(){
  var h=document.getElementById('cm-desc-handle'),ta=document.getElementById('cm-desc');
  if(!h||!ta)return;
  h.onpointerdown=function(e){
    e.preventDefault();e.stopPropagation();
    var sy=e.clientY,sh=ta.getBoundingClientRect().height;
    var onMove=function(ev){ta.style.height=Math.max(72,sh+ev.clientY-sy)+'px';};
    var onUp=function(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      var nh=Math.round(ta.getBoundingClientRect().height);
      if(nh!==Math.round(sh)){EC.descH=nh;saveCard(EC);}
    };
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
  };
}

function cleanPastedChecklistItem(s){
  return String(s||'')
    .replace(/^\s*(?:[-*•–—]\s+|\d+[\.)]\s+|[A-Za-z][\.)]\s+|\[[ xX]\]\s*)/,'')
    .replace(/\s+/g,' ')
    .trim();
}
function parseChecklistPaste(text,mode){
  var normalized=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(mode==='single'){
    var single=cleanPastedChecklistItem(normalized);
    return single?[single]:[];
  }
  if(mode==='paragraphs'){
    return normalized.split(/\n\s*\n+/).map(cleanPastedChecklistItem).filter(Boolean);
  }
  return normalized.split('\n').map(cleanPastedChecklistItem).filter(Boolean);
}

function handleCMItemPaste(e,colId){

  var text=clip?clip.getData('text/plain'):'';

  e.preventDefault();
  var input=e.target;
  var before=input&&typeof input.selectionStart==='number'?input.value.slice(0,input.selectionStart):'';
  var after=input&&typeof input.selectionEnd==='number'?input.value.slice(input.selectionEnd):'';
  showCMItemPastePreview(colId,before+text+after);

function _autoResortDone(idx){
  var n=EC.items.length,target=0;
  // target = boundary between the not-done block and the done block
  // (excluding this item). Checking an item moves it to the top of the
  // done block; unchecking moves it to the bottom of the not-done block.
  for(var k=0;k<n;k++){
    if(k===idx)continue;
    if(EC.done.includes(EC.items[k]))break;
    target++;
  }
  if(target===idx)return null;
  var item=EC.items.splice(idx,1)[0];
  var meta=EC.itemMeta.splice(idx,1)[0];
  EC.items.splice(target,0,item);
  EC.itemMeta.splice(target,0,meta);
  var remapped=new Set();
  _expandedChk.forEach(function(x){
    var nx=x;
    if(x===idx)nx=target;
    else if(idx<target){if(x>idx&&x<=target)nx=x-1;}
    else{if(x>=target&&x<idx)nx=x+1;}
    remapped.add(nx);
  });
  _expandedChk=remapped;_persistExpandedChk();
  return target;
}
function toggleCMItem(idx,cid){
  var it=EC.items[idx];var wasDone=EC.done.includes(it);
  if(wasDone)EC.done=EC.done.filter(function(x){return x!==it;});else EC.done.push(it);_cmDirty=true;
  _ensureItemMeta(EC);
  var nowDone=!wasDone;
  EC.itemMeta[idx].completedAt=nowDone?Date.now():null;
  var dueChanged=_syncCardDueFromItems(EC);
  if(dueChanged)refreshCMDue(cid);
  if(!_chkSorted&&_autoResortDone(idx)!==null){refreshChk(cid);return;}

    var row=chk.querySelectorAll('.chk-row')[idx];
    if(row){
      var box=row.querySelector('.checkbox'),txt=row.querySelector('.chk-txt');
      if(box){box.classList.toggle('on',nowDone);box.innerHTML=nowDone?'<span style="color:#fff;font-size:10px;font-weight:900">✓</span>':'';}
      if(txt){txt.style.color=nowDone?'var(--txt-d)':'var(--txt)';txt.style.textDecoration=nowDone?'line-through':'none';}

        dueBtn.className='chk-due-btn'+(dueBtnCls?' '+dueBtnCls:'');

      }
    }
    refreshChkControls(cid);updateCMProgress();
  }else renderCM(cid);
}

// Renders (or lazily probes then renders) the storage usage bar inside the
// open Backup modal. Kept separate from showBackupModal's cb so a manual
// "Recalculate" click can call it again without rebuilding the whole modal.
function renderStorageBar(){
  var wrap=document.getElementById('storage-bar-wrap');if(!wrap)return;
  var mb=function(b){return b>=1024*1024*100?Math.round(b/1024/1024):Math.round(b/1024/1024*10)/10;};
  var fmtCeil=function(b){return b>=1024*1024*1024?(Math.round(b/1024/1024/1024*10)/10)+'GB':mb(b)+'MB';};
  var draw=function(){
    var s=_storageStats();
    var color=s.pct>=90?'#e11d48':s.pct>=70?'#f59e0b':'#10b981';
    var barPct=Math.max(s.pct,s.used>0?1:0); // keep a sliver visible when usage is tiny vs a huge quota
    var note=s.source==='estimate'?' (IndexedDB + localStorage)':(s.isEstimate?' — estimated':'');
    wrap.innerHTML=
      '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--txt-m)">'+
        '<span>'+mb(s.used)+'MB of '+(s.source==='estimate'?'':'~')+fmtCeil(s.ceiling)+' ('+s.pct+'%)'+note+'</span>'+
        '<button class="btn btn-ghost" style="padding:2px 8px;font-size:10px" onclick="_refreshStorageEstimate().then(renderStorageBar)" title="Re-measure storage usage">↻ Recalculate</button>'+
      '</div>'+
      '<div class="storage-bar-track"><div class="storage-bar-fill" style="width:'+barPct+'%;background:'+color+'"></div></div>';
    _updateBackupsBtnState();
  };
  if(!_estimateCache){
    // First measurement: fetch the Storage API estimate off the initial render
    // tick so opening the modal never visibly blocks on it.
    wrap.innerHTML='<div style="font-size:12px;color:var(--txt-d)">Measuring…</div>';
    _refreshStorageEstimate().then(draw);
  }else{
    draw();
  }
}

function openReport(type, cardId){
  var boardName=(S.prefs&&S.prefs.boardName)||'My Board';
  var dateStr=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  var cols=(S.cols||[]).filter(function(c){return !c.archived;});
  // When called from a card modal, narrow to just that one card
  if(cardId){
    cols=cols.map(function(col){
      var match=(col.cards||[]).filter(function(k){return k.id===cardId&&!k.archived;});
      return match.length?{id:col.id,title:col.title,cards:match}:null;
    }).filter(Boolean);
  }
  var titles={overview:'Board Overview',tasks:'Full Task List',agenda:'Meeting Agenda'};
  var reportTitle=cardId&&cols[0]&&cols[0].cards[0]?cols[0].cards[0].title:titles[type]||'Report';
  var PALETTE=['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2'];
  var totalCards=cols.reduce(function(n,c){return n+(c.cards||[]).filter(function(k){return !k.archived;}).length;},0);

  function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function cbHtml(done,color){
    return '<span class="cb'+(done?' chk':'')+'"'+(done?' style="background:'+color+';border-color:'+color+'"':'')+''+'></span>';
  }

  var body='';

  /* ── Board Overview: responsive 3-col grid ── */
  if(type==='overview'){
    var ncols=cols.length<=2?cols.length:3;
    body='<div class="ov-grid" style="grid-template-columns:repeat('+ncols+',1fr)">';
    cols.forEach(function(col,ci){
      var color=PALETTE[ci%PALETTE.length];
      var cards=(col.cards||[]).filter(function(k){return !k.archived;});
      body+='<div class="ov-col" style="border-top-color:'+color+'">';
      body+='<div class="ov-head"><span class="ov-hname">'+xe(col.title)+'</span><span class="ov-hct" style="color:'+color+'">'+cards.length+'</span></div>';
      if(!cards.length){
        body+='<div class="ov-empty">Empty</div>';
      }else{
        cards.forEach(function(card){
          body+='<div class="ov-card"><span class="ov-dot" style="background:'+color+'"></span><span class="ov-ctitle">'+xe(card.title)+'</span>';
          if(card.due)body+='<span class="ov-due">'+xe(card.due)+'</span>';
          body+='</div>';
        });
      }
      body+='</div>';
    });
    body+='</div>';
  }

  /* ── Full Task List: global FFD into 2 columns ──
     Same First Fit Decreasing approach as the Agenda: estimate each board
     column's total height, sort largest-first, then greedily pack entire
     sections into whichever display column is currently shorter. This avoids
     the per-section packing problem where a section with one tall card leaves
     the opposite display column entirely empty. ── */
  if(type==='tasks'){
    var TL_SEP=28,TL_HEAD=32,TL_TASK=18,TL_DESC=16,TL_GAP=6,TL_CHARS=45;
    var tlGroups=[];
    cols.forEach(function(col,ci){
      var color=PALETTE[ci%PALETTE.length];
      var cards=(col.cards||[]).filter(function(k){return !k.archived;});
      if(!cards.length)return;
      var bg=hexToRgba(color,.06);
      var h=TL_SEP;
      cards.forEach(function(card){
        var items=card.items||[];
        var descH=card.desc?Math.max(1,Math.ceil((card.desc||'').length/TL_CHARS))*TL_DESC:0;
        var tasksH=items.reduce(function(sum,item){
          return sum+Math.max(1,Math.ceil((item||'').length/TL_CHARS))*TL_TASK;
        },0);
        h+=TL_HEAD+descH+(items.length?tasksH:TL_TASK)+TL_GAP;
      });
      tlGroups.push({col:col,color:color,cards:cards,h:h,bg:bg});
    });
    // Sort largest-first, then greedy assign to shorter column
    tlGroups.sort(function(a,b){return b.h-a.h;});
    var dcols=[{html:'',h:0},{html:'',h:0}];
    tlGroups.forEach(function(g){
      var side=dcols[0].h<=dcols[1].h?0:1;
      var html='<div class="tl-sep" style="border-left-color:'+g.color+';background:'+g.bg+'">'+
        '<span class="tl-sep-name">'+xe(g.col.title)+'</span>'+
        '<span class="tl-sep-ct">'+g.cards.length+' card'+(g.cards.length!==1?'s':'')+'</span>'+
        '</div>';
      g.cards.forEach(function(card){
        var items=card.items||[];
        var done_n=card.done?card.done.length:0;
        var total_n=items.length;
        html+='<div class="tl-card" style="border-left-color:'+g.color+'">';
        html+='<div class="tl-chead"><span class="tl-ctitle">'+xe(card.title)+'</span>';
        if(total_n)html+='<span class="tl-prog">'+done_n+'/'+total_n+'</span>';
        html+='</div>';
        if(card.desc)html+='<div class="tl-cdesc">'+xe(card.desc)+'</div>';
        if(items.length){
          items.forEach(function(item){
            var done=card.done&&card.done.indexOf(item)>=0;
            html+='<div class="tl-task'+(done?' done':'')+'">'+cbHtml(done,g.color)+'<span class="tl-ttext">'+xe(item)+'</span></div>';
          });
        }else{
          html+='<div class="tl-notasks">No tasks</div>';
        }
        html+='</div>';
      });
      dcols[side].html+=html;
      dcols[side].h+=g.h;
    });
    body='<div class="tl-cols"><div class="tl-col">'+dcols[0].html+'</div><div class="tl-col">'+dcols[1].html+'</div></div>';
  }

  /* ── Meeting Agenda: First Fit Decreasing into 2 columns ──
     Sort groups by estimated height largest-first, then greedily assign
     each to whichever display column is currently shorter. This is the
     classic "First Fit Decreasing" bin-packing heuristic — it produces
     near-optimal column balance and prevents one column running many pages
     longer than the other. Groups appear sorted by size, not board order. ── */
  if(type==='agenda'){
    var n=0;
    // H_CHARS_PER_LINE: print column is ~340px, ag-task font is 11px with ~8px/char
    var H_SEP=28,H_CARD_HEAD=38,H_LINE=20,H_GAP=7,H_CHARS=42;
    var agGroups=[];
    cols.forEach(function(col,ci){
      var color=PALETTE[ci%PALETTE.length];
      var cards=(col.cards||[]).filter(function(k){return !k.archived;});
      if(!cards.length)return;
      var h=H_SEP;
      cards.forEach(function(card){
        var items=card.items||[];
        var nl=items.length;
        // Account for task text wrapping: long items take multiple lines in print
        var tasksH=items.reduce(function(sum,item){
          return sum+Math.max(1,Math.ceil((item||'').length/H_CHARS))*H_LINE;
        },0);
        var notesH=nl<=3?28:nl<=8?50:72;
        h+=H_CARD_HEAD+tasksH+notesH+H_GAP;
      });
      agGroups.push({col:col,color:color,cards:cards,h:h,ci:ci});
    });
    // Sort largest-first for First Fit Decreasing
    agGroups.sort(function(a,b){return b.h-a.h;});
    // Greedy assign to shorter column
    var dcols=[{html:'',h:0},{html:'',h:0}];
    agGroups.forEach(function(g){
      var side=dcols[0].h<=dcols[1].h?0:1;
      var bg=hexToRgba(g.color,.06);
      var h='<div class="ag-sep" style="border-left-color:'+g.color+';background:'+bg+'">'+xe(g.col.title)+'</div>';
      g.cards.forEach(function(card){
        n++;
        h+='<div class="ag-item" style="border-left-color:'+g.color+'">';
        h+='<div class="ag-ihead"><span class="ag-num" style="background:'+g.color+'">'+n+'</span><span class="ag-title">'+xe(card.title)+'</span></div>';
        if(card.items&&card.items.length){

            h+='<div class="ag-task'+(done?' done':'')+'">'+cbHtml(done,g.color)+'<span class="ag-ttext">'+xe(item)+'</span></div>';

        var _nl=card.items?card.items.length:0;var _nLines=_nl<=3?1:_nl<=8?2:3;

        h+='<div class="ag-notes">'+_nHtml+'</div>';
        h+='</div>';
      });
      dcols[side].html+=h;
      dcols[side].h+=g.h;
    });

  }

    '.ag-title{font-size:12px;font-weight:700;color:#111;line-height:1.25;padding-top:2px;}'+
    '.ag-task{display:flex;align-items:flex-start;gap:7px;padding:3px 9px;border-bottom:1px solid #f5f5f5;font-size:11px;color:#333;line-height:1.4;}'+
    '.ag-task.done .ag-ttext{color:#bbb;text-decoration:line-through;}'+
    '.ag-notes{border-top:1px solid #f5f5f5;padding:3px 9px 6px;break-inside:avoid;break-before:avoid;}'+
    '.ag-nline{border-bottom:1px solid #d4d4d4;height:22px;}'+
    /* Continued header — hidden on screen, injected before print for cards that bleed across pages */
    '.ag-cont-hdr{display:none;}'+
    '@media print{'+
      '.ag-cont-hdr{display:flex;align-items:center;gap:7px;padding:4px 9px;background:#f5f5f5;border-top:1px solid #e4e4e4;border-bottom:1px solid #e8e8e8;break-before:page;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'+
      '.ag-cont-ttl{font-size:11px;font-weight:700;color:#555;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}'+
      '.ag-cont-lbl{font-size:9px;color:#aaa;font-style:italic;white-space:nowrap;}'+
    '}'+
    /* Checkbox */
    '.cb{width:11px;height:11px;border:1.5px solid #d0d0d0;border-radius:2px;flex-shrink:0;margin-top:2px;position:relative;display:inline-flex;}'+
    '.cb.chk{-webkit-print-color-adjust:exact;print-color-adjust:exact;}'+
    '.cb.chk::after{content:"";position:absolute;left:2px;top:0;width:3px;height:6px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);}'+
    /* Print button screen only, no layout impact on print */
    '@media screen{.print-btn{position:fixed;top:16px;right:16px;background:#111;color:#fff;border:none;border-radius:7px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.25);z-index:999;}}'+
    '@media screen{.print-btn:hover{background:#333;}}'+
    '@media print{.print-btn{display:none;}.tl-sep,.ag-sep{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}';

  var header=
    '<div class="hdr">'+
      '<span class="hdr-name">'+xe(boardName)+'</span>'+
      '<span class="hdr-div">/</span>'+
      '<span class="hdr-type">'+xe(reportTitle)+'</span>'+
      '<span class="hdr-sp"></span>'+
      '<span class="hdr-date">'+xe(dateStr)+'</span>'+
      '<div class="hdr-sub">'+
        '<span>'+cols.length+' column'+(cols.length!==1?'s':'')+' &nbsp;&middot;&nbsp; '+totalCards+' active card'+(totalCards!==1?'s':'')+'</span>'+
        '<span class="hdr-fb">FlowBoard</span>'+
      '</div>'+
    '</div>';

  // Script injected into the popup: detects ag-item elements that bleed across
  // a page boundary and inserts a "Continued" header at the crossing point.
  // Runs on DOMContentLoaded (so it's visible on screen too, hidden via CSS)
  // and re-runs on beforeprint so print layout measurements are fresh.
  var contScript=
    '<script>(function(){'+
      'var _inj=[];'+
      // Measure printable page height: Letter (11in) minus 2 × 0.6in @page margins
      'function pageH(){'+
        'var r=document.createElement("div");'+
        'r.style.cssText="position:absolute;top:-9999px;width:1in;height:0";'+
        'document.body.appendChild(r);'+
        'var d=r.offsetWidth||96;'+
        'document.body.removeChild(r);'+
        // Scale by 0.85: print columns are ~20% narrower than screen (340px vs 424px),
        // so text wraps more and card heights are taller in print. Injecting earlier
        // (smaller effective page) prevents the cont-hdr landing after the real break.
        'return(11-1.2)*d*0.85;'+
      '}'+
      'function inject(){'+
        // Remove previously injected elements
        '_inj.forEach(function(e){e.parentNode&&e.parentNode.removeChild(e);});_inj=[];'+
        'var ph=pageH();'+
        'var sy=window.pageYOffset||0;'+
        '[].forEach.call(document.querySelectorAll(".ag-item"),function(item){'+
          'var iTop=item.getBoundingClientRect().top+sy;'+
          'var pg0=Math.floor(iTop/ph);'+
          'var pg1=Math.floor((iTop+item.offsetHeight-1)/ph);'+
          'if(pg1<=pg0)return;'+
          // Skip ag-ihead (index 0) and any previously injected cont-hdrs
          'var kids=[].slice.call(item.children).filter(function(k){return!k.classList.contains("ag-cont-hdr")&&!k.classList.contains("ag-ihead");});'+
          'var target=null;'+
          'for(var i=0;i<kids.length;i++){'+
            'if(Math.floor((kids[i].getBoundingClientRect().top+sy)/ph)>pg0){target=kids[i];break;}'+
          '}'+
          'if(!target)return;'+
          // If only the notes block crosses the boundary, don't inject —
          // notes will flow naturally to the next page as a unit (break-inside:avoid).
          // Injecting here would create a page that's almost entirely empty.
          'if(target.classList.contains("ag-notes"))return;'+
          'var te=item.querySelector(".ag-title");'+
          'var ne=item.querySelector(".ag-num");'+
          'var c=document.createElement("div");'+
          'c.className="ag-cont-hdr";'+
          'c.style.borderLeft="3px solid "+item.style.borderLeftColor;'+
          'c.style.borderRadius="0 5px 0 0";'+
          'c.innerHTML='+
            '(ne?"<span class=\\"ag-num\\" style=\\"background:"+item.style.borderLeftColor+";opacity:.5\\">"+ne.textContent+"</span>":"")+'+
            '"<span class=\\"ag-cont-ttl\\">"+(te?te.textContent:"")+"</span>"+'+
            '"<span class=\\"ag-cont-lbl\\">continued ↑</span>";'+
          'item.insertBefore(c,target);_inj.push(c);'+
        '});'+
      '}'+
      'document.addEventListener("DOMContentLoaded",inject);'+
      'window.addEventListener("beforeprint",inject);'+
      'window.addEventListener("afterprint",function(){'+
        '_inj.forEach(function(e){e.parentNode&&e.parentNode.removeChild(e);});_inj=[];'+
      '});'+
    '})();<\/script>';

  var agendaScript=(type==='agenda')?contScript:'';

  var html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'+
    '<title>'+xe(boardName)+' — '+xe(reportTitle)+'</title>'+
    '<style>'+css+'</style></head><body>'+
    '<button class="print-btn" onclick="window.print()">Print / Save PDF</button>'+
    header+body+agendaScript+
    '</body></html>';

  var win=window.open('','_blank');
  if(win){win.document.write(html);win.document.close();}
  else notify('&#x26A0;&#xFE0F; Pop-up blocked — please allow pop-ups for this site.');
}

var _modalW=510,_modalH=null;
function loadModalSize(){if(S.prefs){if(S.prefs.modalW>=320)_modalW=S.prefs.modalW;if(S.prefs.modalH>=200)_modalH=S.prefs.modalH;}}
function saveModalSize(){if(S.prefs){S.prefs.modalW=_modalW;S.prefs.modalH=_modalH;}save();}
function initModalResize(handle,modal){
  handle.addEventListener('mousedown',function(e){
    e.preventDefault();e.stopPropagation();
    var sx=e.clientX,sy=e.clientY;
    var sw=modal.getBoundingClientRect().width,sh=modal.getBoundingClientRect().height;
    function onMove(ev){
      var nw=Math.max(320,Math.min(window.innerWidth*.95,sw+ev.clientX-sx));
      var nh=Math.max(220,Math.min(window.innerHeight*.95,sh+ev.clientY-sy));
      modal.style.width=nw+'px';modal.style.height=nh+'px';modal.style.maxHeight='none';
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
      _modalW=Math.round(modal.getBoundingClientRect().width);
      _modalH=Math.round(modal.getBoundingClientRect().height);
      saveModalSize();
    }
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
  });
}
function setModal(html,w,cb,resizable){
  closeThemePanel();closeAllPops();
  var root=document.getElementById('modal-root');root.innerHTML='';
  var ov=document.createElement('div');ov.className='overlay';ov.onclick=closeModal;
  var m=document.createElement('div');m.className='modal';
  if(resizable){
    m.style.width=Math.min(_modalW, window.innerWidth * 0.95)+'px';
    if(_modalH){m.style.height=Math.min(_modalH, window.innerHeight * 0.95)+'px';m.style.maxHeight='none';}
  }else if(w){m.style.width=w;}
  m.onclick=function(e){e.stopPropagation();};m.innerHTML=html;
  if(resizable){var rh=document.createElement('div');rh.className='modal-resize-handle';m.appendChild(rh);initModalResize(rh,m);}
  ov.appendChild(m);root.appendChild(ov);if(cb)setTimeout(cb,10);
}
function notify(msg,ms){
  var el=document.getElementById('notif');el.textContent=msg;el.classList.add('show');
  clearTimeout(notify._t);
  notify._t=setTimeout(function(){el.classList.remove('show');},ms||7800);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(_pd){if(_pd.ghost)_pd.ghost.remove();_pd.el.style.opacity='';var _i=document.getElementById('drop-ind');if(_i)_i.remove();document.body.style.userSelect='';_pd=null;return;}
    if(document.getElementById('chk-sort-drop')){closeChkSortMenu();return;}
    if(document.getElementById('cm-paste-preview')){closeCMItemPastePreview();return;}
    closeModal();
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();createBak('Quick Save '+new Date().toLocaleTimeString());}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){
    // Don't intercept Ctrl+Z inside text inputs / textareas — let the browser handle it
    if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'))return;
    e.preventDefault();doUndo();
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){
    if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'))return;
    e.preventDefault();doRedo();
  }
});

load();loadTheme();loadModalSize();initUiScale();render();initPointerDrag();_updateBackupsBtnState();
_restoreUndoSession(); // restore undo history if this is a crash-recovery / F5 reload
_usbCheckStoredHandle(); // offer one-click USB reconnect if a handle was saved last session
// Backups now live in IndexedDB (with a localStorage fallback). Initialise that
// store — probe usability, migrate any existing localStorage backups, hydrate
// the current board's mirrors — BEFORE anything that reads/writes backups:
// session-start snapshot, orphan review, and cloud sync (whose auto-snap
// listener merges against the local mirror and must not run before hydration).
function _bootAfterBackupStore(){
  _refreshStorageEstimate();                    // seed the real (IDB+LS) usage gauge
  _sessionStartSnap();                          // auto-snapshot the session's opening state
  setTimeout(_checkOrphanSnapshots,400);        // slight delay so it doesn't compete with paint/USB banner
  initSync();                                   // connect last, so the auto-snap listener sees a hydrated mirror
}
_initBackupStore().then(_bootAfterBackupStore).catch(function(e){
  console.error('[Backups] store init failed, continuing on localStorage:',e);
  _backupsUseIdb=false;_bootAfterBackupStore();
});
