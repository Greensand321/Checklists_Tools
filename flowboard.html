<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ FlowBoard</title>
<style>
:root{
  --bg:#060d18;--topbar:rgba(6,13,24,.88);--bd:rgba(255,255,255,.07);
  --bd-s:rgba(255,255,255,.06);--bd-i:rgba(255,255,255,.1);
  --txt:#e2e8f0;--txt-b:#f1f5f9;--txt-m:#94a3b8;--txt-d:#475569;--txt-dd:#334155;
  --surf:#1a2538;--surf2:rgba(255,255,255,.055);--surf3:rgba(255,255,255,.08);
  --modal:#0e1623;--card:rgba(255,255,255,.055);--card-h:rgba(255,255,255,.1);
  --inp:rgba(255,255,255,.05);--inp2:rgba(255,255,255,.06);--inp-d:rgba(0,0,0,.35);
  --scroll:rgba(255,255,255,.1);--ghost-bg:rgba(255,255,255,.07);
  --ghost-c:#94a3b8;--ghost-bd:rgba(255,255,255,.1);--dnd:rgba(96,165,250,.09);
}
[data-theme="obsidian"]{--bg:#000;--modal:#0a0a0a;--surf:#111;--surf2:rgba(255,255,255,.04);--topbar:rgba(0,0,0,.9);}
[data-theme="graphite"]{--bg:#18191a;--modal:#101112;--surf:#242526;--surf2:rgba(255,255,255,.06);--topbar:rgba(22,23,24,.9);}
[data-theme="navy"]{--bg:#020817;--modal:#040e28;--surf:#0d1b3e;--topbar:rgba(4,14,40,.9);}
[data-theme="twilight"]{--bg:#0d0618;--modal:#080412;--surf:#180d2e;--topbar:rgba(13,6,24,.9);}
[data-theme="aurora"]{--bg:#011a1a;--modal:#010e0e;--surf:#072525;--topbar:rgba(1,14,14,.9);}
[data-theme="forest"]{--bg:#011a08;--modal:#010e04;--surf:#07250f;--topbar:rgba(1,14,4,.9);}
[data-theme="ember"]{--bg:#150803;--modal:#0d0501;--surf:#251005;--topbar:rgba(21,8,3,.9);}
[data-theme="pearl"],[data-theme="azure"],[data-theme="blossom"],[data-theme="meadow"],[data-theme="lavender"],[data-theme="sunset"]{
  --bd:rgba(0,0,0,.09);--bd-s:rgba(0,0,0,.07);--bd-i:rgba(0,0,0,.15);
  --txt:#1d1d1f;--txt-b:#000;--txt-m:#6e6e73;--txt-d:#86868b;--txt-dd:#aeaeb2;
  --surf2:rgba(0,0,0,.04);--surf3:rgba(0,0,0,.07);
  --card:rgba(255,255,255,.82);--card-h:#fff;
  --inp:rgba(0,0,0,.05);--inp2:rgba(0,0,0,.06);--inp-d:rgba(0,0,0,.07);
  --scroll:rgba(0,0,0,.12);--ghost-bg:rgba(0,0,0,.06);--ghost-c:#6e6e73;
  --ghost-bd:rgba(0,0,0,.14);--dnd:rgba(0,100,200,.08);
}
[data-theme="pearl"]   {--bg:#f5f5f7;--modal:#fff;--surf:#fff;--topbar:rgba(255,255,255,.88);}
[data-theme="azure"]   {--bg:#eff6ff;--modal:#fff;--surf:#fff;--topbar:#bfdbfe;}
[data-theme="blossom"] {--bg:#fff0f5;--modal:#fff;--surf:#fff;--topbar:#fbcfe8;}
[data-theme="meadow"]  {--bg:#f0fdf4;--modal:#fff;--surf:#fff;--topbar:#bbf7d0;}
[data-theme="lavender"]{--bg:#f5f3ff;--modal:#fff;--surf:#fff;--topbar:#ddd6fe;}
[data-theme="sunset"]  {--bg:#fff7ed;--modal:#fff;--surf:#fff;--topbar:#fed7aa;}

@keyframes cardNew    {from{opacity:0;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardSettle {0%{transform:scale(1.04);box-shadow:0 8px 28px rgba(0,0,0,.35)}60%{transform:scale(.985)}100%{transform:scale(1);box-shadow:none}}
@keyframes colNew     {from{opacity:0;transform:translateX(22px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes pillIn     {from{opacity:0;transform:scaleY(.7);transform-origin:top}to{opacity:1;transform:scaleY(1)}}
@keyframes bannerIn   {from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardFill   {0%{opacity:0;transform:translateY(-10px) scale(1)}55%{opacity:1;transform:translateY(0) scaleY(.91)}80%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}
@keyframes groupIn    {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes btnPop     {0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}

.anim-card-new    {animation:cardNew    .22s cubic-bezier(.34,1.4,.64,1) both}
.anim-card-settle {animation:cardSettle .28s cubic-bezier(.34,1.3,.64,1) both}
.anim-col-new     {animation:colNew     .24s cubic-bezier(.34,1.3,.64,1) both}
.anim-group-new   {animation:groupIn    .22s cubic-bezier(.34,1.2,.64,1) both}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;transition:background .3s,color .2s}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px}

#topbar{background:var(--topbar);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .3s}
.logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa,#fb7185);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
#search{background:var(--inp2);border:1px solid var(--bd-i);border-radius:10px;color:var(--txt);padding:7px 13px;font-size:13px;width:190px;outline:none;transition:border-color .18s,box-shadow .18s}
#search::placeholder{color:var(--txt-d)}
#search:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}
.topbar-stats{font-size:11px;color:var(--txt-dd);white-space:nowrap}
.btn{border:none;border-radius:9px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:700;transition:opacity .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.95);animation:btnPop .15s ease}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.btn-primary:hover{box-shadow:0 4px 18px rgba(99,102,241,.4)}
.btn-ghost{background:var(--ghost-bg);color:var(--ghost-c);border:1px solid var(--ghost-bd)}
.btn-danger{background:rgba(251,113,133,.12);color:#f43f5e;border:1px solid rgba(251,113,133,.25)}
.btn-green{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.btn-amber{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}

#board{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 22px 40px}
.group{margin-bottom:28px}
.group-hdr{display:flex;align-items:center;gap:9px;padding:8px 2px 10px;border-bottom:2px solid var(--bd-s);margin-bottom:12px}
.group-accent{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:box-shadow .2s,transform .15s}
.group-accent:hover{transform:scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.group-name{font-weight:800;font-size:14px;flex:1;cursor:text}
.group-chip{background:var(--surf2);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--txt-d);font-weight:700}
.collapse-btn{background:none;border:none;color:var(--txt-d);cursor:pointer;font-size:11px;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s}
.collapse-btn:hover{color:var(--txt-m)}
.icon-btn{background:none;border:none;color:var(--bd-i);cursor:pointer;font-size:17px;padding:0 3px;line-height:1;transition:color .15s,transform .12s}
.icon-btn:hover{color:var(--txt-m);transform:scale(1.15)}
.icon-btn:active{transform:scale(.9)}
.group-cols{display:flex;gap:12px;overflow-x:auto;align-items:stretch;padding-bottom:6px}

.col{min-width:268px;max-width:268px;flex-shrink:0;display:flex;flex-direction:column;border-radius:14px}
.col-hdr{border-radius:14px 14px 0 0;padding:10px 12px;display:flex;align-items:center;gap:7px;border:1px solid transparent;border-bottom:none}
.col-name{flex:1;font-weight:700;font-size:12px;color:var(--txt-b);cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.18);cursor:pointer;user-select:none;transition:background .18s,color .18s,transform .12s}
.col-count:hover{transform:scale(1.08)}
.col-count:active{transform:scale(.95)}
.col-body{border-radius:0 0 14px 14px;padding:8px 8px 10px;min-height:56px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;border-top:none;transition:border-color .2s,box-shadow .2s}
.col-body.drag-over{border-color:#60a5fa !important;box-shadow:inset 0 0 20px var(--dnd)}

.anim-card-fill{animation:cardFill .34s cubic-bezier(.34,1.2,.64,1) both}
.col-body.limited{transition:height .32s cubic-bezier(.4,0,.2,1)}
.limit-btn{background:none;border:1px solid var(--bd-i);border-radius:7px;color:var(--txt-d);padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s,background .18s;flex-shrink:0}
.limit-btn:hover{border-color:#60a5fa;color:#60a5fa}
.limit-btn.active{background:rgba(96,165,250,.12);border-color:#60a5fa;color:#60a5fa}

.wip-pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:11px;padding:11px 12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);width:178px;}
.wip-pop input{width:100%;background:var(--inp);border:1px solid var(--bd-i);border-radius:7px;color:var(--txt);padding:5px 9px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;transition:border-color .15s}
.wip-pop input:focus{border-color:#f59e0b}
.wip-pop-label{font-size:10px;font-weight:700;color:var(--txt-d);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.wip-pop-btns{display:flex;gap:6px}
.wip-pop-btns button{flex:1;border:none;border-radius:7px;padding:5px 0;font-size:11px;font-weight:700;cursor:pointer;transition:opacity .12s,transform .12s}
.wip-pop-btns button:hover{opacity:.85}
.wip-pop-btns button:active{transform:scale(.94)}

.col-pill{width:38px;flex-shrink:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 10px;cursor:pointer;min-height:130px;transition:filter .15s,transform .18s;position:relative;border:1px solid transparent;animation:pillIn .22s cubic-bezier(.34,1.3,.64,1) both}
.col-pill:hover{filter:brightness(1.18);transform:scale(1.04)}
.col-pill:active{transform:scale(.97)}
.col-pill-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;max-height:120px;text-overflow:ellipsis;padding:0 2px}
.col-pill-count{border-radius:20px;padding:2px 6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.25);margin-top:6px}
.col-pill-expand{font-size:9px;opacity:.6;margin-top:4px;transition:transform .18s}
.col-pill:hover .col-pill-expand{transform:scale(1.3)}

.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid;border-radius:10px;padding:9px 11px;cursor:grab;transition:background .18s,transform .18s cubic-bezier(.34,1.3,.64,1),box-shadow .18s;user-select:none}
.card:hover{background:var(--card-h);transform:translateY(-2px) scale(1.01);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card:active{transform:scale(.98)}
.card.dragging{opacity:.2;cursor:grabbing;transform:scale(1.03) rotate(1deg)}
.card.drop-above{margin-top:28px;transition:margin-top .18s cubic-bezier(.34,1.3,.64,1)}
.card-title{font-weight:600;font-size:12px;color:var(--txt-b);margin-bottom:5px;line-height:1.4}
.prog-row{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-d);margin-bottom:3px}
.prog-track{height:3px;background:var(--surf2);border-radius:99px;margin-bottom:6px;overflow:hidden}
.prog-fill{height:3px;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pri-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700}
.tag{background:var(--surf3);color:var(--txt-m);border-radius:20px;padding:2px 6px;font-size:10px}
.due-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.due-ok{background:rgba(96,165,250,.15);color:#60a5fa}
.due-soon{background:rgba(245,158,11,.15);color:#f59e0b}
.due-over{background:rgba(225,29,72,.18);color:#e11d48}

/* ── CARD COLOR CIRCLE PICKER ── */
.cm-color-wrap{position:relative;flex-shrink:0;display:flex;align-items:center}
.cm-color-circle{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid var(--bd-i);transition:transform .15s,border-color .15s;flex-shrink:0}
.cm-color-circle:hover{transform:scale(1.18);border-color:var(--txt-m)}
.cm-color-drop{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s,padding .25s}
.cm-color-drop.open{max-height:360px;opacity:1;pointer-events:auto;padding:6px}
.cm-cdrop-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0}
.cm-cdrop-dot:hover{transform:scale(1.2)}
.cm-cdrop-dot.on{border-color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);transform:scale(1.12)}
.cm-cdrop-dot.none-dot{background:var(--surf3);position:relative;overflow:hidden}
.cm-cdrop-dot.none-dot::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 43%,#e11d48 43%,#e11d48 57%,transparent 57%)}

/* ── COLUMN DROPDOWN ── */
.cm-col-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-col-trigger{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none;max-width:160px;overflow:hidden}
.cm-col-trigger:hover{border-color:#60a5fa;color:var(--txt)}
.cm-col-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;min-width:170px}
.cm-col-drop.open{max-height:220px;opacity:1;pointer-events:auto;padding:5px;overflow-y:auto;overflow-x:hidden}
.cm-col-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12px;font-weight:600;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.cm-col-item:hover{background:var(--surf3)}
.cm-col-item.active{color:#60a5fa}

/* ── DATE BUTTON ── */
.cm-date-btn{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none;font-family:inherit;position:relative}
.cm-date-btn:hover{border-color:#60a5fa;color:var(--txt)}

.add-card-btn{background:none;border:1px dashed var(--bd-i);border-radius:9px;color:var(--txt-d);padding:7px;cursor:pointer;font-size:12px;width:100%;transition:all .2s}
.add-card-btn:hover{border-color:#60a5fa;color:#60a5fa;background:rgba(96,165,250,.04)}
.add-card-btn:active{transform:scale(.98)}
.add-inline{background:var(--surf2);border-radius:9px;padding:9px;animation:cardNew .18s cubic-bezier(.34,1.3,.64,1) both}
.add-inline input{width:100%;background:var(--inp-d);border:1px solid var(--bd-i);border-radius:7px;color:var(--txt);padding:6px 9px;font-size:12px;outline:none;margin-bottom:7px;transition:border-color .15s}
.add-inline input:focus{border-color:#60a5fa}

.cpicker{position:absolute;top:22px;right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;padding:9px;display:flex;flex-wrap:wrap;gap:6px;width:148px;z-index:99;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.cdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .12s,transform .15s}
.cdot:hover{transform:scale(1.2)}
.cdot:active{transform:scale(.9)}
.cdot.on{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.3);transform:scale(1.1)}

#theme-panel{position:fixed;background:var(--surf);border:1px solid var(--bd-i);border-radius:16px;padding:14px 13px 12px;z-index:400;box-shadow:0 16px 50px rgba(0,0,0,.45);width:330px;display:none}
#theme-panel.open{display:block;animation:modalIn .2s cubic-bezier(.34,1.2,.64,1) both}
.tp-title{font-size:11px;font-weight:800;color:var(--txt-m);text-transform:uppercase;letter-spacing:.9px;margin-bottom:10px}
.tp-sec{font-size:9px;font-weight:700;color:var(--txt-dd);text-transform:uppercase;letter-spacing:.8px;grid-column:1/-1;padding-top:8px;padding-bottom:3px;border-top:1px solid var(--bd-s);margin-top:4px}
.tp-sec:first-child{border-top:none;padding-top:0;margin-top:0}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tswatch{border:2px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.tswatch:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tswatch:active{transform:scale(.97)}
.tswatch.active{border-color:#60a5fa;box-shadow:0 0 0 1px rgba(96,165,250,.35)}
.tswatch-inner{height:36px;position:relative;overflow:hidden}
.tswatch-ribbon{position:absolute;top:0;left:0;right:0;height:40%;min-height:12px}
.tswatch-bg-fill{position:absolute;bottom:-20px;left:0;right:0;top:40%}
.tswatch-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.tswatch-name{font-size:9px;font-weight:700;text-align:center;padding:3px 2px 4px;background:var(--surf2);color:var(--txt-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--modal);border:1px solid var(--bd);border-radius:18px;padding:26px;width:510px;max-width:100%;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:800;color:var(--txt-b);margin-bottom:18px}
.lbl{display:block;font-size:10px;color:var(--txt-d);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.finput{background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;color:var(--txt);padding:8px 12px;font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .18s,box-shadow .18s}
.finput::placeholder{color:var(--txt-d)}
.finput:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.12)}
.ftextarea{background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;color:var(--txt);padding:8px 12px;font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .18s,box-shadow .18s;resize:vertical;min-height:72px;line-height:1.5}
.ftextarea::placeholder{color:var(--txt-d)}
.ftextarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.12)}

var curTheme='midnight';
var _previewTheme=null,_revertTimer=null;
function isLight(){return!THEMES.find(function(t){return t.id===curTheme;})?.dark;}

function applyTheme(id,permanent){
  if(permanent===undefined)permanent=true;
  if(permanent){curTheme=id;_previewTheme=null;localStorage.setItem('fb4_theme',id);render();}
  document.documentElement.setAttribute('data-theme',id);
  document.querySelectorAll('#theme-grid .tswatch').forEach(function(el){el.classList.toggle('active',el.dataset.tid===id);});
}
function loadTheme(){var s=localStorage.getItem('fb4_theme')||'midnight';curTheme=s;document.documentElement.setAttribute('data-theme',s);}

function renderThemeGrid(){
  var g=document.getElementById('theme-grid');if(!g)return;
  function swatch(t){
    var div=document.createElement('div');
    div.className='tswatch'+(curTheme===t.id?' active':'');
    div.dataset.tid=t.id;div.title=t.name;
    div.innerHTML='<div class="tswatch-inner"><div class="tswatch-ribbon" style="background:'+t.bar+'"></div><div class="tswatch-bg-fill" style="background:'+t.bg+'"></div><div class="tswatch-emoji">'+t.emoji+'</div></div><div class="tswatch-name">'+t.name+'</div>';
    div.addEventListener('mouseenter',function(){clearTimeout(_revertTimer);_previewTheme=t.id;document.documentElement.setAttribute('data-theme',t.id);document.querySelectorAll('#theme-grid .tswatch').forEach(function(el){el.classList.toggle('active',el===div);});});
    div.addEventListener('mouseleave',function(){_revertTimer=setTimeout(function(){_previewTheme=null;document.documentElement.setAttribute('data-theme',curTheme);document.querySelectorAll('#theme-grid .tswatch').forEach(function(el){el.classList.toggle('active',el.dataset.tid===curTheme);});},80);});
    div.addEventListener('click',function(e){e.stopPropagation();clearTimeout(_revertTimer);_previewTheme=null;applyTheme(t.id,true);closeThemePanel();});
    return div;
  }
  var dk=THEMES.filter(function(t){return t.dark;}),lt=THEMES.filter(function(t){return !t.dark;});
  g.innerHTML='';
  var dkSec=document.createElement('div');dkSec.className='tp-sec';dkSec.textContent='Dark';g.appendChild(dkSec);
  dk.forEach(function(t){g.appendChild(swatch(t));});
  var ltSec=document.createElement('div');ltSec.className='tp-sec';ltSec.textContent='Light · Apple-Inspired';g.appendChild(ltSec);
  lt.forEach(function(t){g.appendChild(swatch(t));});
}
function toggleThemePanel(){
  var p=document.getElementById('theme-panel'),btn=document.getElementById('theme-btn');
  if(p.classList.contains('open')){p.classList.remove('open');return;}
  var r=btn.getBoundingClientRect();p.style.top=(r.bottom+8)+'px';p.style.right=(window.innerWidth-r.right)+'px';
  p.classList.add('open');renderThemeGrid();
}
function closeThemePanel(){
  document.getElementById('theme-panel')?.classList.remove('open');
  clearTimeout(_revertTimer);_revertTimer=null;
  if(_previewTheme){_previewTheme=null;document.documentElement.setAttribute('data-theme',curTheme);}
}

function dueClass(due){
  if(!due)return null;
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(due+'T00:00:00');
  var diff=Math.round((d-today)/(1000*60*60*24));
  if(diff<0)return'over';if(diff<=2)return'soon';return'ok';
}
function dueLabel(due){
  if(!due)return'';
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(due+'T00:00:00');
  var diff=Math.round((d-today)/(1000*60*60*24));
  if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';
  if(diff<0)return Math.abs(diff)+'d overdue';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function save(){
  try{
    var data=JSON.stringify(S);localStorage.setItem('fb4',data);
    var used=new Blob([data]).size+new Blob([localStorage.getItem('fb4_baks')||'']).size;
    if(used>4*1024*1024&&!save._warned){save._warned=true;notify('⚠️ Storage nearly full — export a backup soon!');}
    else if(used<=4*1024*1024){save._warned=false;}
  }catch(e){notify('❌ Save failed — storage may be full!');}
}
function load(){
  try{var r=localStorage.getItem('fb4');if(r){S=JSON.parse(r);
    S.groups.forEach(function(g){if(g.limit===undefined)g.limit=0;});
    S.cols.forEach(function(c){
      if(c.wip===undefined)c.wip=0;
      if(c.collapsed===undefined)c.collapsed=false;
      c.cards.forEach(function(k){
        if(k.color===undefined)k.color=null;
        if(k.desc===undefined)k.desc='';
        if(k.due===undefined)k.due='';
      });
    });return;}}catch(e){}
  S=defaultState();save();
}

function getBaks(){try{return JSON.parse(localStorage.getItem('fb4_baks')||'[]');}catch(e){return[];}}
function setBaks(a){localStorage.setItem('fb4_baks',JSON.stringify(a));}
function createBak(name){
  var a=getBaks(),tc=S.cols.reduce(function(n,c){return n+c.cards.length;},0);
  a.unshift({id:uid(),name:name||'Snapshot '+new Date().toLocaleString(),ts:Date.now(),cards:tc,data:JSON.stringify(S)});
  if(a.length>25)a.splice(25);setBaks(a);notify('📌 Snapshot saved!');showBackupModal();
}
function renameBak(id){
  var baks=getBaks();
  var b=baks.find(function(x){return x.id===id;});
  if(!b)return;
  var el=document.getElementById('bakname_'+id);
  if(!el)return;
  var orig=b.name;
  var inp=document.createElement('input');
  inp.value=orig;
  inp.style.cssText='background:transparent;border:none;border-bottom:1px solid #60a5fa;color:var(--txt-b);font-size:13px;font-weight:700;outline:none;width:100%;font-family:inherit;padding:1px 0';
  inp.onblur=function(){
    var v=inp.value.trim()||orig;
    baks.forEach(function(x){if(x.id===id)x.name=v;});
    setBaks(baks);showBackupModal();
  };
  inp.onkeydown=function(e){
    if(e.key==='Enter'){inp.blur();}
    else if(e.key==='Escape'){inp.value=orig;inp.blur();}
  };
  el.replaceWith(inp);inp.focus();inp.select();
}
function restoreBak(id){
  var b=getBaks().find(function(x){return x.id===id;});
  if(!b||!confirm('Restore snapshot? Current board will be replaced.'))return;
  S=JSON.parse(b.data);save();render();closeModal();notify('✅ Board restored!');
}
function deleteBak(id){setBaks(getBaks().filter(function(x){return x.id!==id;}));showBackupModal();}
function exportBak(id){
  var data,name;
  if(id){var b=getBaks().find(function(x){return x.id===id;});if(!b)return;data=b.data;name=b.name;}
  else{data=JSON.stringify(S);name='flowboard_export';}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=name.replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'_')+'_'+Date.now()+'.json';a.click();
}
function importBak(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!d.cols)throw 0;
      if(!confirm('Import? Current board will be replaced.'))return;S=d;save();render();closeModal();notify('✅ Imported!');}
    catch(e2){alert('Invalid FlowBoard file.');}};r.readAsText(f);};inp.click();
}

function saveCard(card){
  for(var i=0;i<S.cols.length;i++){
    var idx=S.cols[i].cards.findIndex(function(x){return x.id===card.id;});
    if(idx>=0){S.cols[i].cards[idx]=card;break;}
  }
  save();render();
}
function deleteCard(cid){
  for(var i=0;i<S.cols.length;i++){
    var idx=S.cols[i].cards.findIndex(function(x){return x.id===cid;});
    if(idx>=0){S.cols[i].cards.splice(idx,1);break;}
  }
  save();render();
}
function duplicateCard(cid,colId){
  var col=S.cols.find(function(x){return x.id===colId;});if(!col)return;
  var idx=col.cards.findIndex(function(x){return x.id===cid;});if(idx<0)return;
  var copy=JSON.parse(JSON.stringify(col.cards[idx]));
  copy.id=uid();copy.title='Copy of '+col.cards[idx].title;
  col.cards.splice(idx+1,0,copy);
  newCardId=copy.id;save();render();newCardId=null;
  forceCloseModal();notify('📋 Card duplicated!');
}
function moveCard(cid,fromId,toId,beforeId){
  var fc=S.cols.find(function(x){return x.id===fromId;}),tc=S.cols.find(function(x){return x.id===toId;});
  if(!fc||!tc)return;
  var idx=fc.cards.findIndex(function(x){return x.id===cid;});if(idx<0)return;
  var card=fc.cards.splice(idx,1)[0];
  if(beforeId){var bi=tc.cards.findIndex(function(x){return x.id===beforeId;});tc.cards.splice(bi<0?tc.cards.length:bi,0,card);}
  else tc.cards.push(card);
  settleCardId=cid;save();render();settleCardId=null;
}

function getGroupForCol(colId){var col=S.cols.find(function(x){return x.id===colId;});if(!col||!col.gid)return null;return S.groups.find(function(x){return x.id===col.gid;})||null;}
function setGroupLimit(gid,n){var g=S.groups.find(function(x){return x.id===gid;});if(g){g.limit=Math.max(0,parseInt(n)||0);save();render();}}
function toggleLimitPop(gid){closeAllPops();if(openLimitGid===gid){openLimitGid=null;return;}openLimitGid=gid;var el=document.getElementById('limitpop_'+gid);if(el)el.style.display='block';}
function saveLimitPop(gid){var inp=document.getElementById('limitinp_'+gid);if(inp)setGroupLimit(gid,inp.value);openLimitGid=null;}
function clearGroupLimit(gid){setGroupLimit(gid,0);openLimitGid=null;}
function closeAllPops(){document.querySelectorAll('.wip-pop').forEach(function(x){x.style.display='none';});openLimitGid=null;}

// ── CHECKLIST ──
function mkChkHtml(colId){
  return EC.items.map(function(it,i){
    var done=EC.done.includes(it);
    return '<div class="chk-row" draggable="true"'+
      ' ondragstart="chkDragStart(event,'+i+')"'+
      ' ondragover="chkDragOver(event)"'+
      ' ondrop="chkDrop(event,'+i+',\''+colId+'\')"'+
      ' ondragend="chkDragEnd()">'+
      '<span class="chk-handle">⠿</span>'+
      '<div class="checkbox '+(done?'on':'')+'" onclick="toggleCMItem('+i+',\''+colId+'\')">'+(done?'<span style="color:#fff;font-size:10px;font-weight:900">✓</span>':'')+' </div>'+
      '<span class="chk-txt" ondblclick="editCMItem('+i+',\''+colId+'\')" onmouseenter="showTip(event,\''+escA(it)+'\')" onmouseleave="hideTip()" style="flex:1;font-size:13px;color:'+(done?'var(--txt-d)':'var(--txt)')+';text-decoration:'+(done?'line-through':'none')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;cursor:text">'+esc(it)+'</span>'+
      '<span onclick="removeCMItem('+i+',\''+colId+'\')" style="color:var(--txt-dd);cursor:pointer;font-size:15px;padding:0 4px;flex-shrink:0">×</span>'+
      '</div>';
  }).join('');
}
function mkChkControls(colId){
  if(!EC.items.length)return'';
  var allDone=EC.items.every(function(it){return EC.done.includes(it);});
  var hasDone=EC.done.length>0;
  return '<div id="cm-chk-ctrl" style="display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px">'+
    '<button class="chk-ctrl-btn" onclick="toggleChkSort(\''+colId+'\')">'+(  _chkSorted?'↺ Original':'⇅ Sort')+'</button>'+
    '<button class="chk-ctrl-btn" onclick="toggleAllItems(\''+colId+'\')">'+(allDone?'☐ Uncheck all':'☑ Check all')+'</button>'+
    (hasDone?'<button class="chk-ctrl-btn" style="color:#e11d48" onclick="clearCompleted(\''+colId+'\')">🗑 Clear done</button>':'')+
    '</div>';
}
function refreshChk(colId){
  var chk=document.getElementById('cm-chk');if(chk)chk.innerHTML=mkChkHtml(colId);
  refreshChkControls(colId);updateCMProgress();
}
function refreshChkControls(colId){
  var ctrl=document.getElementById('cm-chk-ctrl');
  var newHtml=mkChkControls(colId);
  var tmp=document.createElement('div');tmp.innerHTML=newHtml;var newEl=tmp.firstChild;
  if(ctrl&&newEl)ctrl.replaceWith(newEl);
  else if(ctrl&&!newEl)ctrl.remove();
  else if(!ctrl&&newEl){var chk=document.getElementById('cm-chk');if(chk)chk.before(newEl);}
}
function toggleChkSort(colId){
  if(!_chkSorted){
    _chkOrigItems=EC.items.slice();
    EC.items=EC.items.filter(function(it){return !EC.done.includes(it);}).concat(EC.items.filter(function(it){return EC.done.includes(it);}));
    _chkSorted=true;
  }else{
    EC.items=_chkOrigItems.slice();_chkSorted=false;_chkOrigItems=null;
  }
  refreshChk(colId);
}
function toggleAllItems(colId){
  var allDone=EC.items.length>0&&EC.items.every(function(it){return EC.done.includes(it);});
  EC.done=allDone?[]:EC.items.slice();_cmDirty=true;saveCard(EC);refreshChk(colId);
}
function clearCompleted(colId){
  EC.items=EC.items.filter(function(it){return !EC.done.includes(it);});EC.done=[];saveCard(EC);refreshChk(colId);
}
function editCMItem(idx,colId){
  var rows=document.querySelectorAll('#cm-chk .chk-row');
  var row=rows[idx];if(!row)return;
  var txt=row.querySelector('.chk-txt');if(!txt)return;
  var orig=EC.items[idx];
  var inp=document.createElement('input');
  inp.value=orig;
  inp.style.cssText='flex:1;background:var(--inp);border:1px solid #60a5fa;border-radius:6px;color:var(--txt);font-size:13px;outline:none;padding:2px 7px;font-family:inherit;min-width:0';
  inp.onblur=function(){
    var v=inp.value.trim();
    if(v&&v!==orig){
      EC.items[idx]=v;
      if(EC.done.includes(orig)){EC.done=EC.done.filter(function(x){return x!==orig;});EC.done.push(v);}
      saveCard(EC);
    }
    refreshChk(colId);
  };
  inp.onkeydown=function(e){
    if(e.key==='Enter'){inp.blur();}
    else if(e.key==='Escape'){inp.value=orig;inp.blur();}
  };
  txt.replaceWith(inp);inp.focus();inp.select();
}

var _chkDragIdx=null;
function chkDragStart(e,idx){_chkDragIdx=idx;e.stopPropagation();e.dataTransfer.effectAllowed='move';setTimeout(function(){var r=e.target.closest('.chk-row');if(r)r.classList.add('chk-dragging');},0);}
function chkDragOver(e){e.preventDefault();e.stopPropagation();document.querySelectorAll('#cm-chk .chk-row').forEach(function(r){r.classList.remove('chk-drag-over');});var t=e.target.closest('.chk-row');if(t)t.classList.add('chk-drag-over');}
function chkDrop(e,idx,colId){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('#cm-chk .chk-row').forEach(function(r){r.classList.remove('chk-drag-over');r.classList.remove('chk-dragging');});
  if(_chkDragIdx===null||_chkDragIdx===idx){_chkDragIdx=null;return;}
  var item=EC.items.splice(_chkDragIdx,1)[0];EC.items.splice(idx,0,item);
  _chkDragIdx=null;saveCard(EC);refreshChk(colId);
}
function chkDragEnd(){document.querySelectorAll('#cm-chk .chk-row').forEach(function(r){r.classList.remove('chk-drag-over');r.classList.remove('chk-dragging');});_chkDragIdx=null;}

function render(){
  save();
  var q=document.getElementById('search').value.toLowerCase().trim();
  var board=document.getElementById('board'),st=board.scrollTop;
  S.cols.forEach(function(c){var el=document.getElementById('cb_'+c.id);if(el)_colHeights[c.id]=el.getBoundingClientRect().height;});
  board.innerHTML='';
  var tc=S.cols.reduce(function(n,c){return n+c.cards.length;},0);
  document.getElementById('stats').textContent=S.groups.length+' group'+(S.groups.length!==1?'s':'')+' · '+S.cols.length+' cols · '+tc+' cards';
  S.groups.forEach(function(g){board.appendChild(mkGroup(g,S.cols.filter(function(c){return c.gid===g.id;}),q,false));});
  var ug=S.cols.filter(function(c){return !c.gid||!S.groups.find(function(g){return g.id===c.gid;});});
  if(ug.length)board.appendChild(mkGroup({id:'__ug',title:'📦 Ungrouped',pi:0,col:false},ug,q,true));
  var r=document.createElement('div');r.style.cssText='padding:6px 0 20px';
  var b=document.createElement('button');b.className='btn btn-ghost';b.style.fontSize='12px';b.textContent='＋ Add Group';
  b.onclick=function(){showAddGroupModal();};r.appendChild(b);board.appendChild(r);
  board.scrollTop=st;
}

function mkGroup(g,gcols,q,fake){
  var P=PAL[g.pi%PAL.length],tc=gcols.reduce(function(n,c){return n+c.cards.length;},0);
  var wrap=document.createElement('div');wrap.className='group';
  if(g.id===newGroupId)wrap.classList.add('anim-group-new');
  var hdr=document.createElement('div');hdr.className='group-hdr';hdr.style.borderBottomColor=P.a+'55';
  var dot=document.createElement('div');dot.className='group-accent';dot.style.cssText='background:'+P.a+';box-shadow:0 0 8px '+P.a+'80';
  if(!fake)dot.onclick=function(){togglePicker('gp_'+g.id);};hdr.appendChild(dot);
  if(!fake){
    var cb=document.createElement('button');cb.className='collapse-btn';cb.title=g.col?'Expand':'Collapse';cb.textContent=g.col?'▶':'▼';cb.onclick=function(){toggleGroupCol(g.id);};hdr.appendChild(cb);
  }
  var nt=document.createElement('span');nt.className='group-name';nt.style.color=P.a;nt.textContent=g.title;
  if(!fake){nt.title='Double-click to rename';nt.ondblclick=function(){inlineRenameGroup(g.id,nt);};}
  hdr.appendChild(nt);
  var ch=document.createElement('span');ch.className='group-chip';ch.textContent=tc+' card'+(tc!==1?'s':'');hdr.appendChild(ch);
  if(!fake){
    var lw=document.createElement('div');lw.style.position='relative';
    var lb=document.createElement('button');lb.className='limit-btn'+(g.limit?' active':'');
    lb.textContent=g.limit?'⊞ '+g.limit:'⊞ Limit';
    lb.title=g.limit?'Visible cards per column: '+g.limit+' — click to change':'Set visible card limit per column';
    lb.onclick=function(e){e.stopPropagation();toggleLimitPop(g.id);};
    var lp=document.createElement('div');lp.className='wip-pop';lp.id='limitpop_'+g.id;lp.style.display='none';
    lp.onclick=function(e){e.stopPropagation();};
    var lpLbl=document.createElement('div');lpLbl.className='wip-pop-label';lpLbl.textContent='Cards per column';lp.appendChild(lpLbl);
    var lpInp=document.createElement('input');lpInp.id='limitinp_'+g.id;lpInp.type='number';lpInp.min='1';lpInp.max='99';lpInp.placeholder='e.g. 5';
    if(g.limit)lpInp.value=g.limit;
    lpInp.onkeydown=function(e){if(e.key==='Enter')saveLimitPop(g.id);if(e.key==='Escape')closeAllPops();};lp.appendChild(lpInp);
    var lpBtns=document.createElement('div');lpBtns.className='wip-pop-btns';
    var lpSet=document.createElement('button');lpSet.textContent='Set';lpSet.style.cssText='background:#60a5fa;color:#000';lpSet.onclick=function(){saveLimitPop(g.id);};
    var lpClr=document.createElement('button');lpClr.textContent='Clear';lpClr.style.cssText='background:var(--surf3);color:var(--txt-m)';lpClr.onclick=function(){clearGroupLimit(g.id);};
    lpBtns.appendChild(lpSet);lpBtns.appendChild(lpClr);lp.appendChild(lpBtns);
    setTimeout(function(){if(openLimitGid===g.id){lp.style.display='block';lpInp.focus();}},0);
    lw.appendChild(lb);lw.appendChild(lp);hdr.appendChild(lw);
    var pp=document.createElement('div');pp.style.position='relative';
    var picker=document.createElement('div');picker.className='cpicker';picker.id='gp_'+g.id;picker.style.display='none';
    PAL.forEach(function(p,i){var d=document.createElement('div');d.className='cdot'+(g.pi===i?' on':'');d.style.background=p.a;d.title=p.n;d.onclick=function(){setGroupPi(g.id,i);};picker.appendChild(d);});
    pp.appendChild(picker);hdr.appendChild(pp);
    var ac=document.createElement('button');ac.className='icon-btn';ac.title='Add column';ac.textContent='+';ac.style.fontSize='19px';ac.onclick=function(){showAddColModal(g.id);};hdr.appendChild(ac);
    var db=document.createElement('button');db.className='icon-btn';db.title='Delete group';db.textContent='×';db.onclick=function(){delGroup(g.id);};hdr.appendChild(db);
  }
  wrap.appendChild(hdr);
  if(!g.col){
    var crow=document.createElement('div');crow.className='group-cols';crow.id='gcols_'+g.id;
    gcols.forEach(function(col){crow.appendChild(col.collapsed?mkPill(col):mkCol(col,q));});
    if(!fake){
      var pb=document.createElement('button');
      pb.style.cssText='min-width:56px;height:42px;background:var(--surf2);border:2px dashed var(--bd);border-radius:12px;color:var(--txt-d);cursor:pointer;font-size:20px;flex-shrink:0;transition:all .2s,transform .15s;align-self:flex-start';
      pb.textContent='+';pb.title='Add column';
      pb.onmouseenter=function(){pb.style.borderColor=P.a;pb.style.color=P.a;pb.style.background=hexToRgba(P.a,.06);pb.style.transform='scale(1.08)';};
      pb.onmouseleave=function(){pb.style.borderColor='var(--bd)';pb.style.color='var(--txt-d)';pb.style.background='var(--surf2)';pb.style.transform='scale(1)';};
      pb.onmousedown=function(){pb.style.transform='scale(.96)';};
      pb.onclick=function(){showAddColModal(g.id);};crow.appendChild(pb);
    }
    wrap.appendChild(crow);

  return wrap;

function mkPill(col){
  var P=PAL[col.pi%PAL.length],light=isLight();
  var hdrBg=light?hexToRgba(P.a,.22):P.h,hdrBd=light?hexToRgba(P.a,.35):'rgba(255,255,255,.08)';

  var titleEl=document.createElement('div');titleEl.className='col-pill-title';titleEl.style.color=light?P.a:'var(--txt-b)';titleEl.textContent=col.title;pill.appendChild(titleEl);
  var countEl=document.createElement('div');countEl.className='col-pill-count';countEl.style.cssText='background:rgba(0,0,0,.22);color:'+P.a;
  countEl.textContent=col.cards.length;pill.appendChild(countEl);
  var expandEl=document.createElement('div');expandEl.className='col-pill-expand';expandEl.textContent='▶';expandEl.style.color=light?P.a:'var(--txt-d)';pill.appendChild(expandEl);

}

function mkCol(col,q){
  var P=PAL[col.pi%PAL.length],light=isLight();
  var hdrBg=light?hexToRgba(P.a,.22):P.h,bodyBg=light?hexToRgba(P.a,.07):P.b;
  var hdrBd=light?hexToRgba(P.a,.35):'rgba(255,255,255,.08)',bodyBd=light?hexToRgba(P.a,.2):'rgba(255,255,255,.06)';
  var grp=getGroupForCol(col.id),limit=grp?grp.limit||0:0;
  var fc=col.cards.filter(function(k){return !q||k.title.toLowerCase().includes(q)||k.tags.some(function(t){return t.toLowerCase().includes(q);});});
  var wrap=document.createElement('div');wrap.className='col';
  if(col.id===newColId)wrap.classList.add('anim-col-new');
  var hdr=document.createElement('div');hdr.className='col-hdr';hdr.style.background=hdrBg;hdr.style.borderColor=hdrBd;
  var collapseBtn=document.createElement('button');collapseBtn.className='icon-btn';collapseBtn.title='Collapse';collapseBtn.textContent='◀';
  collapseBtn.style.cssText='font-size:10px;opacity:.55;color:'+(light?P.a:'rgba(255,255,255,.4)');
  collapseBtn.onclick=function(e){e.stopPropagation();setColCollapsed(col.id,true);};hdr.appendChild(collapseBtn);
  var nt=document.createElement('span');nt.className='col-name';nt.textContent=col.title;
  nt.style.color=light?P.a:'var(--txt-b)';nt.title='Double-click to rename';nt.ondblclick=function(){inlineRenameCol(col.id,nt);};hdr.appendChild(nt);
  var cnt=document.createElement('span');cnt.className='col-count';
  cnt.textContent=String(col.cards.length);
  cnt.style.color=P.a;cnt.style.background=light?hexToRgba(P.a,.15):'rgba(0,0,0,.22)';
  hdr.appendChild(cnt);
  var pp=document.createElement('div');pp.style.position='relative';
  var cd=document.createElement('div');
  cd.style.cssText='width:13px;height:13px;border-radius:50%;background:'+P.a+';cursor:pointer;border:2px solid '+(light?'rgba(255,255,255,.7)':'rgba(255,255,255,.28)')+';box-shadow:0 0 5px '+P.a+'80;transition:transform .15s';
  cd.title='Change color';cd.onmouseenter=function(){cd.style.transform='scale(1.25)';};cd.onmouseleave=function(){cd.style.transform='scale(1)';};
  cd.onclick=function(e){e.stopPropagation();togglePicker('cp_'+col.id);};pp.appendChild(cd);
  var picker=document.createElement('div');picker.className='cpicker';picker.id='cp_'+col.id;picker.style.display='none';
  PAL.forEach(function(p,i){var d=document.createElement('div');d.className='cdot'+(col.pi===i?' on':'');d.style.background=p.a;d.title=p.n;d.onclick=function(){setColPi(col.id,i);};picker.appendChild(d);});
  pp.appendChild(picker);hdr.appendChild(pp);
  var db=document.createElement('button');db.className='icon-btn';db.textContent='×';db.title='Delete column';
  db.style.color=light?hexToRgba(P.a,.5):'rgba(255,255,255,.22)';db.onclick=function(){delCol(col.id);};hdr.appendChild(db);
  wrap.appendChild(hdr);
  var body=document.createElement('div');body.className='col-body';body.style.background=bodyBg;body.style.borderColor=bodyBd;body.id='cb_'+col.id;
  if(limit>0&&col.cards.length>0){
    var slots=Math.min(col.cards.length,limit);
    var targetH=slots*CARD_SLOT_H+COL_BODY_PAD;
    body.classList.add('limited');
    var prevH=_colHeights[col.id];
    if(prevH&&Math.round(prevH)!==targetH){
      body.style.height=prevH+'px';
      requestAnimationFrame(function(){requestAnimationFrame(function(){body.style.height=targetH+'px';});});
    }else{
      body.style.height=targetH+'px';
    }
    if(col.cards.length>limit)body.style.overflowY='auto';
  }
  body.ondragover=function(e){e.preventDefault();body.classList.add('drag-over');};
  body.ondragleave=function(e){if(!body.contains(e.relatedTarget))body.classList.remove('drag-over');};
  body.ondrop=function(e){e.preventDefault();body.classList.remove('drag-over');if(!drag)return;moveCard(drag.cid,drag.from,col.id);drag=null;};
  var fillId=(limit>0&&col.cards.length===limit)?newCardId:null;
  fc.forEach(function(card){body.appendChild(mkCard(card,col,P,fillId));});
  if(fc.length===0&&addTo!==col.id){
    var empty=document.createElement('div');
    empty.style.cssText='text-align:center;padding:18px 8px 10px;font-size:11px;color:var(--txt-dd);pointer-events:none;user-select:none;line-height:1.6';
    empty.innerHTML='<div style="font-size:20px;margin-bottom:5px;opacity:.4">📭</div>No cards yet';
    body.appendChild(empty);
  }
  var aa=document.createElement('div');aa.id='aa_'+col.id;
  if(addTo===col.id){
    var box=document.createElement('div');box.className='add-inline';
    var inp=document.createElement('input');inp.placeholder='Card title…';inp.id='ainp_'+col.id;inp.style.marginBottom='8px';
    var cpRow=mkInlineColorPicker(addCardColor,function(c){
      addCardColor=c;
      box.querySelectorAll('.cc-dot').forEach(function(d){
        var dColor=d.style.background||null;
        var match=(c===null&&d.classList.contains('none-dot'))||(c&&dColor===c);
        d.classList.toggle('on',match);
      });
    });
    cpRow.style.marginBottom='8px';
    inp.onkeydown=function(e){
      if(e.key==='Enter'){addCard(col.id,inp.value,addCardColor);addCardColor=null;addTo=null;}
      if(e.key==='Escape'){addCardColor=null;addTo=null;render();}
    };
    var row=document.createElement('div');row.style.cssText='display:flex;gap:7px';
    var ok=document.createElement('button');ok.className='btn btn-primary';ok.style.cssText='padding:4px 13px;font-size:12px';ok.textContent='Add';
    ok.onclick=function(){addCard(col.id,inp.value,addCardColor);addCardColor=null;addTo=null;};
    var cn=document.createElement('button');cn.className='btn btn-ghost';cn.style.cssText='padding:4px 9px;font-size:12px';cn.textContent='Cancel';
    cn.onclick=function(){addCardColor=null;addTo=null;render();};
    row.appendChild(ok);row.appendChild(cn);
    box.appendChild(inp);box.appendChild(cpRow);box.appendChild(row);aa.appendChild(box);
    setTimeout(function(){var i=document.getElementById('ainp_'+col.id);if(i)i.focus();},10);
  }else{
    var ab=document.createElement('button');ab.className='add-card-btn';ab.textContent='+ Add card';
    if(light){ab.style.borderColor=hexToRgba(P.a,.3);ab.style.color=hexToRgba(P.a,.6);}
    ab.onclick=function(){addCardColor=null;addTo=col.id;render();};aa.appendChild(ab);
  }
  body.appendChild(aa);wrap.appendChild(body);
  return wrap;
}

function mkCard(card,col,P,fillId){
  var pri=PRI[card.pri]||PRI[0];
  var borderColor=card.color||pri.d;
  var pct=card.items.length?Math.round(card.done.length/card.items.length*100):null;
  var dc=dueClass(card.due);
  var div=document.createElement('div');div.className='card';div.draggable=true;
  div.style.borderLeftColor=borderColor;
  if(card.color)div.style.background=hexToRgba(card.color,isLight()?.09:.13);
  if(card.id===fillId)div.classList.add('anim-card-fill');
  else if(card.id===newCardId)div.classList.add('anim-card-new');
  else if(card.id===settleCardId)div.classList.add('anim-card-settle');
  var h='<div class="card-title">'+esc(card.title)+'</div>';
  if(pct!==null){
    h+='<div class="prog-row"><span>Progress</span><span style="color:'+(pct===100?'#10b981':'var(--txt-m)')+'">'+pct+'%</span></div>'+
      '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+(pct===100?'#10b981':borderColor)+'"></div></div>';
  }
  h+='<div class="card-meta"><span class="pri-badge" style="background:'+pri.b+';color:'+pri.d+'">'+pri.l+'</span>'+card.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
  if(dc){
    var icon=dc==='over'?'⚠ ':dc==='soon'?'⏰ ':'📅 ';
    h+='<span class="due-badge due-'+dc+'">'+icon+dueLabel(card.due)+'</span>';
  }
  h+='</div>';
  div.innerHTML=h;
  div.ondragstart=function(e){drag={cid:card.id,from:col.id};div.classList.add('dragging');e.dataTransfer.effectAllowed='move';};
  div.ondragend=function(){drag=null;div.classList.remove('dragging');document.querySelectorAll('.drop-above').forEach(function(x){x.classList.remove('drop-above');});};
  div.ondragover=function(e){e.preventDefault();e.stopPropagation();div.classList.add('drop-above');};
  div.ondragleave=function(){div.classList.remove('drop-above');};
  div.ondrop=function(e){
    e.preventDefault();e.stopPropagation();div.classList.remove('drop-above');
    var cb=document.getElementById('cb_'+col.id);if(cb)cb.classList.remove('drag-over');
    if(!drag)return;var cid=drag.cid,from=drag.from;drag=null;
    settleCardId=cid;moveCard(cid,from,col.id,card.id);settleCardId=null;
  };
  div.onclick=function(){showCardModal(card.id,col.id);};
  return div;
}

function closeModal(){

}
function forceCloseModal(){

function showDraftWarning(){
  document.getElementById('draft-warning')?.remove();
  var m=document.querySelector('#modal-root .modal');
  if(!m){document.getElementById('modal-root').innerHTML='';return;}
  var ni=document.getElementById('cm-ni');

  var w=document.createElement('div');
  w.id='draft-warning';
  w.style.cssText='background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.4);border-radius:10px;padding:11px 14px;margin-bottom:14px;animation:bannerIn .18s cubic-bezier(.34,1.2,.64,1) both';

    '<div style="display:flex;gap:8px">'+
    '<button id="dw-add" style="flex:1;border:none;border-radius:7px;padding:6px 0;background:#f59e0b;color:#000;font-weight:700;cursor:pointer;font-size:12px">➕ Add &amp; Close</button>'+

}

function setCMPri(p,cid){EC.pri=p;saveCard(EC);renderCM(cid);}
function addCMTag(cid){var i=document.getElementById('cm-nt'),t=i.value.trim();if(!t||EC.tags.includes(t))return;EC.tags.push(t);i.value='';saveCard(EC);renderCM(cid);}
function removeCMTag(t,cid){EC.tags=EC.tags.filter(function(x){return x!==t;});saveCard(EC);renderCM(cid);}

function addCMItem(colId){
  var i=document.getElementById('cm-ni'),t=i.value.trim();if(!t)return;
  EC.items.unshift(t);i.value='';saveCard(EC);
  refreshChk(colId);
  var chk=document.getElementById('cm-chk');
  if(chk){
    var first=chk.querySelector('.chk-row');
    if(first){
      first.style.opacity='0';first.style.transform='translateY(-8px)';
      first.style.transition='opacity .2s ease,transform .2s cubic-bezier(.34,1.3,.64,1)';
      requestAnimationFrame(function(){requestAnimationFrame(function(){first.style.opacity='1';first.style.transform='translateY(0)';});});
    }
  }
  setTimeout(function(){var ni=document.getElementById('cm-ni');if(ni)ni.focus();},0);
}
function updateCMProgress(){
  var pct=EC.items.length?Math.round(EC.done.length/EC.items.length*100):null;
  var fill=document.getElementById('cm-prog-fill');
  var label=document.querySelector('#modal-root .prog-label');
  if(fill)fill.style.width=(pct||0)+'%';
  if(label)label.textContent=pct+'% done';
}
function removeCMItem(idx,cid){
  var it=EC.items[idx];EC.done=EC.done.filter(function(x){return x!==it;});EC.items.splice(idx,1);_cmDirty=true;
  var chk=document.getElementById('cm-chk');
  if(chk){var rows=chk.querySelectorAll('.chk-row');if(rows[idx])rows[idx].remove();refreshChkControls(cid);updateCMProgress();}
  else renderCM(cid);
}
function toggleCMItem(idx,cid){
  var it=EC.items[idx];var wasDone=EC.done.includes(it);
  if(wasDone)EC.done=EC.done.filter(function(x){return x!==it;});else EC.done.push(it);_cmDirty=true;
  var chk=document.getElementById('cm-chk');
  if(chk){
    var row=chk.querySelectorAll('.chk-row')[idx];
    if(row){
      var box=row.querySelector('.checkbox'),txt=row.querySelector('.chk-txt'),nowDone=!wasDone;
      if(box){box.classList.toggle('on',nowDone);box.innerHTML=nowDone?'<span style="color:#fff;font-size:10px;font-weight:900">✓</span>':'';}
      if(txt){txt.style.color=nowDone?'var(--txt-d)':'var(--txt)';txt.style.textDecoration=nowDone?'line-through':'none';}
    }
    refreshChkControls(cid);updateCMProgress();
  }else renderCM(cid);
}
function moveCMCard(cid,from,to){if(from===to)return;saveCard(EC);moveCard(cid,from,to);forceCloseModal();}

function showBackupModal(){
  var baks=getBaks();
  var bakHtml=baks.length===0
    ?'<div style="color:var(--txt-dd);font-size:13px;padding:16px 0 8px">No snapshots yet.</div>'
    :baks.map(function(b){
      return '<div class="bak-item">'+
        '<div style="flex:1"><div id="bakname_'+b.id+'" class="bak-name" ondblclick="renameBak(\''+b.id+'\')" title="Double-click to rename">'+esc(b.name)+'</div>'+
        '<div class="bak-date">'+new Date(b.ts).toLocaleString()+' · '+b.cards+' card'+(b.cards!==1?'s':'')+'</div></div>'+
        '<div class="bak-actions">'+
          '<button onclick="restoreBak(\''+b.id+'\')" style="background:rgba(96,165,250,.15);color:#3b82f6">Restore</button>'+
          '<button onclick="exportBak(\''+b.id+'\')" style="background:var(--surf3);color:var(--txt-m)">Export</button>'+
          '<button onclick="deleteBak(\''+b.id+'\')" style="background:rgba(225,29,72,.1);color:#e11d48">Delete</button>'+
        '</div></div>';
    }).join('');
  setModal(
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">'+
      '<div style="font-size:17px;font-weight:800;color:var(--txt-b)">💾 Backup & Restore</div>'+
      '<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="closeModal()">✕</button>'+
    '</div>'+
    '<div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:10px;padding:11px 14px;margin-bottom:18px;font-size:13px;color:#10b981">'+
      '✅ <strong>Auto-save is ON</strong> — every change saves instantly.'+
    '</div>'+
    '<label class="lbl">Save Snapshot</label>'+
    '<div style="display:flex;gap:9px;margin-bottom:18px">'+
      '<input id="bak-n" class="finput" placeholder="Snapshot name…" style="flex:1" onkeydown="if(event.key===\'Enter\')createBak(document.getElementById(\'bak-n\').value)">'+
      '<button class="btn btn-green" onclick="createBak(document.getElementById(\'bak-n\').value)">📌 Save</button>'+
    '</div>'+
    '<label class="lbl">Transfer Board</label>'+
    '<div style="display:flex;gap:9px;margin-bottom:22px">'+
      '<button class="btn btn-ghost" style="flex:1;font-size:12px" onclick="exportBak(null)">⬇ Export .json</button>'+
      '<button class="btn btn-ghost" style="flex:1;font-size:12px" onclick="importBak()">⬆ Import .json</button>'+
    '</div>'+
    '<label class="lbl">Snapshots ('+baks.length+'/25)</label>'+
    '<div style="max-height:280px;overflow-y:auto;padding-right:2px">'+bakHtml+'</div>'+
    '<div style="margin-top:14px;padding:11px 13px;background:var(--surf2);border-radius:10px;font-size:12px;color:var(--txt-d);line-height:1.8">'+
      '<strong style="color:var(--txt-m)">💡 Transfer your board:</strong><br>'+
      '1. Export as .json → save to USB or email<br>'+
      '2. On another device: open FlowBoard → Import .json'+
    '</div>',
  '560px',function(){var i=document.getElementById('bak-n');if(i)i.focus();});
}

function setModal(html,w,cb){
  closeThemePanel();closeAllPops();
  var root=document.getElementById('modal-root');root.innerHTML='';
  var ov=document.createElement('div');ov.className='overlay';ov.onclick=closeModal;
  var m=document.createElement('div');m.className='modal';if(w)m.style.width=w;
  m.onclick=function(e){e.stopPropagation();};m.innerHTML=html;
  ov.appendChild(m);root.appendChild(ov);if(cb)setTimeout(cb,10);
}
function notify(msg){
  var el=document.getElementById('notif');el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2600);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();createBak('Quick Save '+new Date().toLocaleTimeString());}
});

loadTheme();load();render();
</script>
</body>
</html>
