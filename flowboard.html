<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ FlowBoard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#060d18;--topbar:rgba(6,13,24,.88);--bd:rgba(255,255,255,.07);
  --bd-s:rgba(255,255,255,.06);--bd-i:rgba(255,255,255,.1);
  --txt:#e2e8f0;--txt-b:#f1f5f9;--txt-m:#94a3b8;--txt-d:#475569;--txt-dd:#334155;
  --surf:#1a2538;--surf2:rgba(255,255,255,.055);--surf3:rgba(255,255,255,.08);
  --modal:#0e1623;--card:rgba(255,255,255,.055);--card-h:rgba(255,255,255,.1);
  --inp:rgba(255,255,255,.05);--inp2:rgba(255,255,255,.06);--inp-d:rgba(0,0,0,.35);
  --scroll:rgba(255,255,255,.1);--ghost-bg:rgba(255,255,255,.07);
  --ghost-c:#94a3b8;--ghost-bd:rgba(255,255,255,.1);--dnd:rgba(96,165,250,.09);
}
[data-theme="obsidian"]{--bg:#000;--modal:#0a0a0a;--surf:#111;--surf2:rgba(255,255,255,.04);--topbar:rgba(0,0,0,.9);}
[data-theme="graphite"]{--bg:#18191a;--modal:#101112;--surf:#242526;--surf2:rgba(255,255,255,.06);--topbar:rgba(22,23,24,.9);}
[data-theme="navy"]{--bg:#020817;--modal:#040e28;--surf:#0d1b3e;--topbar:rgba(4,14,40,.9);}
[data-theme="twilight"]{--bg:#0d0618;--modal:#080412;--surf:#180d2e;--topbar:rgba(13,6,24,.9);}
[data-theme="aurora"]{--bg:#011a1a;--modal:#010e0e;--surf:#072525;--topbar:rgba(1,14,14,.9);}
[data-theme="forest"]{--bg:#011a08;--modal:#010e04;--surf:#07250f;--topbar:rgba(1,14,4,.9);}
[data-theme="ember"]{--bg:#150803;--modal:#0d0501;--surf:#251005;--topbar:rgba(21,8,3,.9);}
[data-theme="pearl"],[data-theme="azure"],[data-theme="blossom"],[data-theme="meadow"],[data-theme="lavender"],[data-theme="sunset"]{
  --bd:rgba(0,0,0,.09);--bd-s:rgba(0,0,0,.07);--bd-i:rgba(0,0,0,.15);
  --txt:#1d1d1f;--txt-b:#000;--txt-m:#6e6e73;--txt-d:#86868b;--txt-dd:#aeaeb2;
  --surf2:rgba(0,0,0,.04);--surf3:rgba(0,0,0,.07);
  --card:rgba(255,255,255,.82);--card-h:#fff;
  --inp:rgba(0,0,0,.05);--inp2:rgba(0,0,0,.06);--inp-d:rgba(0,0,0,.07);
  --scroll:rgba(0,0,0,.12);--ghost-bg:rgba(0,0,0,.06);--ghost-c:#6e6e73;
  --ghost-bd:rgba(0,0,0,.14);--dnd:rgba(0,100,200,.08);
}
[data-theme="pearl"]   {--bg:#f5f5f7;--modal:#fff;--surf:#fff;--topbar:rgba(255,255,255,.88);}
[data-theme="azure"]   {--bg:#eff6ff;--modal:#fff;--surf:#fff;--topbar:#bfdbfe;}
[data-theme="blossom"] {--bg:#fff0f5;--modal:#fff;--surf:#fff;--topbar:#fbcfe8;}
[data-theme="meadow"]  {--bg:#f0fdf4;--modal:#fff;--surf:#fff;--topbar:#bbf7d0;}
[data-theme="lavender"]{--bg:#f5f3ff;--modal:#fff;--surf:#fff;--topbar:#ddd6fe;}
[data-theme="sunset"]  {--bg:#fff7ed;--modal:#fff;--surf:#fff;--topbar:#fed7aa;}

@keyframes cardNew    {from{opacity:0;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardSettle {0%{transform:scale(1.04);box-shadow:0 8px 28px rgba(0,0,0,.35)}60%{transform:scale(.985)}100%{transform:scale(1);box-shadow:none}}
@keyframes colNew     {from{opacity:0;transform:translateX(22px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes pillIn     {from{opacity:0;transform:scaleY(.7);transform-origin:top}to{opacity:1;transform:scaleY(1)}}
@keyframes bannerIn   {from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardFill   {0%{opacity:0;transform:translateY(-10px) scale(1)}55%{opacity:1;transform:translateY(0) scaleY(.91)}80%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}
@keyframes groupIn    {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes btnPop     {0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes deadlinePulse{0%,100%{box-shadow:0 0 12px rgba(225,29,72,.4),0 0 4px rgba(225,29,72,.2)}50%{box-shadow:0 0 20px rgba(225,29,72,.6),0 0 8px rgba(225,29,72,.35)}}
.card.grab-fading{opacity:.35;transition:opacity .8s ease;cursor:grabbing}

.anim-card-new    {animation:cardNew    .22s cubic-bezier(.34,1.4,.64,1) both}
.anim-card-settle {animation:cardSettle .28s cubic-bezier(.34,1.3,.64,1) both}
.anim-col-new     {animation:colNew     .24s cubic-bezier(.34,1.3,.64,1) both}
.anim-group-new   {animation:groupIn    .22s cubic-bezier(.34,1.2,.64,1) both}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;transition:background .3s,color .2s;overscroll-behavior:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px}

#topbar{background:var(--topbar);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .3s}
.logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa,#fb7185);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
#search{background:var(--inp2);border:1px solid var(--bd-i);border-radius:10px;color:var(--txt);padding:7px 13px;font-size:13px;width:190px;outline:none;transition:border-color .18s,box-shadow .18s}
#search::placeholder{color:var(--txt-d)}
#search:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}
.topbar-stats{font-size:11px;color:var(--txt-dd);white-space:nowrap}
.btn{border:none;border-radius:9px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:700;transition:opacity .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.95);animation:btnPop .15s ease}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.btn-primary:hover{box-shadow:0 4px 18px rgba(99,102,241,.4)}
.btn-ghost{background:var(--ghost-bg);color:var(--ghost-c);border:1px solid var(--ghost-bd)}
.btn-danger{background:rgba(251,113,133,.12);color:#f43f5e;border:1px solid rgba(251,113,133,.25)}
.btn-green{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.btn-amber{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
#topbar .btn{display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0 15px;height:34px}

#board{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 22px 40px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.group{margin-bottom:28px}
.group-hdr{display:flex;align-items:center;gap:9px;padding:4px 2px 8px;border-bottom:2px solid var(--bd-s);margin-bottom:12px}
.group-accent{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:box-shadow .2s,transform .15s}
.group-accent:hover{transform:scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.group-name{font-weight:800;font-size:14px;flex:1;cursor:text}
.group-chip{background:var(--surf2);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--txt-d);font-weight:700}
.collapse-btn{background:none;border:none;color:var(--txt-d);cursor:pointer;font-size:11px;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s}
.collapse-btn:hover{color:var(--txt-m)}
.icon-btn{background:none;border:none;color:var(--bd-i);cursor:pointer;font-size:17px;padding:0 3px;line-height:1;transition:color .15s,transform .12s}
.icon-btn:hover{color:var(--txt-m);transform:scale(1.15)}
.icon-btn:active{transform:scale(.9)}
.group-cols{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px;overscroll-behavior-x:none;touch-action:none}

.col{min-width:268px;max-width:268px;flex-shrink:0;display:flex;flex-direction:column;border-radius:14px}
.col-hdr{border-radius:14px 14px 0 0;padding:10px 12px;display:flex;align-items:center;gap:7px;border:1px solid transparent;border-bottom:none;flex-shrink:0}
.col-name{flex:1;font-weight:700;font-size:12px;color:var(--txt-b);cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.18);cursor:pointer;user-select:none;transition:background .18s,color .18s,transform .12s}
.col-count:hover{transform:scale(1.08)}
.col-count:active{transform:scale(.95)}
.col-body{border-radius:0;padding:8px 8px 4px;min-height:0;flex:1;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;border-top:none;border-bottom:none;transition:border-color .2s,box-shadow .2s;overflow-y:auto}
.col-body::-webkit-scrollbar{width:4px}.col-body::-webkit-scrollbar-track{background:transparent}.col-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.col-body.drag-over{border-color:#60a5fa !important;box-shadow:inset 0 0 20px var(--dnd)}
.col-body.drag-over+.col-foot{border-color:#60a5fa !important}
.col-foot{border-radius:0 0 14px 14px;padding:4px 8px 8px;border:1px solid transparent;border-top:none;flex-shrink:0}

.anim-card-fill{animation:cardFill .34s cubic-bezier(.34,1.2,.64,1) both}
.col-body.limited{transition:height .32s cubic-bezier(.4,0,.2,1);overflow:hidden}
.limit-btn{background:none;border:1px solid var(--bd-i);border-radius:8px;color:var(--txt-d);padding:0 10px;font-size:11px;line-height:1;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s,background .18s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;height:28px}
.limit-btn:hover{border-color:#60a5fa;color:#60a5fa}
.limit-btn.active{background:rgba(96,165,250,.12);border-color:#60a5fa;color:#60a5fa}

.wip-pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:11px;padding:11px 12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);width:178px;}
.wip-pop input{width:100%;background:var(--inp);border:1px solid var(--bd-i);border-radius:7px;color:var(--txt);padding:5px 9px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;transition:border-color .15s}
.wip-pop input:focus{border-color:#f59e0b}
.wip-pop-label{font-size:10px;font-weight:700;color:var(--txt-d);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.wip-pop-btns{display:flex;gap:6px}
.wip-pop-btns button{flex:1;border:none;border-radius:7px;padding:5px 0;font-size:11px;font-weight:700;cursor:pointer;transition:opacity .12s,transform .12s}
.wip-pop-btns button:hover{opacity:.85}
.wip-pop-btns button:active{transform:scale(.94)}

.col-pill{width:38px;flex-shrink:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 10px;cursor:pointer;min-height:130px;transition:filter .15s,transform .18s;position:relative;border:1px solid transparent;animation:pillIn .22s cubic-bezier(.34,1.3,.64,1) both}
.col-pill:hover{filter:brightness(1.18);transform:scale(1.04)}
.col-pill:active{transform:scale(.97)}
.col-pill-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;max-height:120px;text-overflow:ellipsis;padding:0 2px}
.col-pill-count{border-radius:20px;padding:2px 6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.25);margin-top:6px}
.col-pill-expand{font-size:9px;opacity:.6;margin-top:4px;transition:transform .18s}
.col-pill:hover .col-pill-expand{transform:scale(1.3)}

.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid;border-radius:10px;padding:9px 11px;cursor:grab;transition:background .18s,transform .18s cubic-bezier(.34,1.3,.64,1),box-shadow .18s;user-select:none;touch-action:none}
.card:hover{background:var(--card-h);transform:translateY(-2px) scale(1.01);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card:active{transform:scale(.98)}
#drop-ind{height:3px;background:#60a5fa;border-radius:99px;margin:0 4px;box-shadow:0 0 8px rgba(96,165,250,.55);pointer-events:none;flex-shrink:0}
.card-title{font-weight:600;font-size:12px;color:var(--txt-b);margin-bottom:5px;line-height:1.4}
.prog-row{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-d);margin-bottom:3px}
.prog-track{height:3px;background:var(--surf2);border-radius:99px;margin-bottom:6px;overflow:hidden}
.prog-fill{height:3px;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pri-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700}
.tag{background:var(--surf3);color:var(--txt-m);border-radius:20px;padding:2px 6px;font-size:10px}
.due-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.due-ok{background:rgba(96,165,250,.15);color:#60a5fa}
.due-soon{background:rgba(245,158,11,.15);color:#f59e0b}
.due-over{background:rgba(225,29,72,.18);color:#e11d48}

/* ── CARD COLOR CIRCLE PICKER ── */
.cm-color-wrap{position:relative;flex-shrink:0;display:flex;align-items:center}
.cm-color-circle{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid var(--bd-i);transition:transform .15s,border-color .15s;flex-shrink:0}
.cm-color-circle:hover{transform:scale(1.18);border-color:var(--txt-m)}
.cm-color-drop{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s,padding .25s}
.cm-color-drop.open{max-height:360px;opacity:1;pointer-events:auto;padding:6px}
.cm-cdrop-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0}
.cm-cdrop-dot:hover{transform:scale(1.2)}
.cm-cdrop-dot.on{border-color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);transform:scale(1.12)}
.cm-cdrop-dot.none-dot{background:var(--surf3);position:relative;overflow:hidden}
.cm-cdrop-dot.none-dot::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 43%,#e11d48 43%,#e11d48 57%,transparent 57%)}

/* ── COLUMN DROPDOWN ── */
.cm-col-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-col-trigger{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none;max-width:160px;overflow:hidden}
.cm-col-trigger:hover{border-color:#60a5fa;color:var(--txt)}
.cm-col-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;min-width:170px}
.cm-col-drop.open{max-height:220px;opacity:1;pointer-events:auto;padding:5px;overflow-y:auto;overflow-x:hidden}
.cm-col-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12px;font-weight:600;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.cm-col-item:hover{background:var(--surf3)}
.cm-col-item.active{color:#60a5fa}

/* ── TAGS DROPDOWN ── */
.cm-tags-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-tags-trigger{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none}
.cm-tags-trigger:hover{border-color:#60a5fa;color:var(--txt)}
.cm-tags-drop{position:absolute;top:calc(100% + 6px);left:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;min-width:220px;padding:0}
.cm-tags-drop.open{max-height:80px;opacity:1;pointer-events:auto;padding:10px 10px 8px}

/* ── DATE / CALENDAR ── */
.cm-cal{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-date-btn{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none;font-family:inherit;position:relative}
.cm-date-btn:hover{border-color:#60a5fa;color:var(--txt)}
.cm-cal-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:14px;z-index:200;box-shadow:0 12px 40px rgba(0,0,0,.5);width:280px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;padding:0}
.cm-cal-drop.open{max-height:360px;opacity:1;pointer-events:auto;padding:14px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-hdr-title{font-size:14px;font-weight:800;color:var(--txt-b)}
.cal-nav{background:none;border:1px solid var(--bd-i);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt-m);font-size:14px;transition:background .15s,border-color .15s,color .15s}
.cal-nav:hover{background:var(--surf3);border-color:#60a5fa;color:#60a5fa}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:10px;font-weight:700;color:var(--txt-dd);text-transform:uppercase;padding:4px 0 8px}
.cal-day{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:background .15s,color .12s,transform .12s;border:2px solid transparent;margin:0 auto}
.cal-day:hover{background:var(--surf3);color:var(--txt);transform:scale(1.1)}
.cal-day.today{border-color:rgba(96,165,250,.4);color:#60a5fa}
.cal-day.selected{background:#3b82f6;color:#fff;border-color:#3b82f6;font-weight:800}
.cal-day.selected:hover{background:#2563eb;border-color:#2563eb}
.cal-day.other{color:var(--txt-dd);opacity:.4}
.cal-day.past{opacity:.5}
.cal-foot{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.cal-foot button{border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:opacity .12s,transform .12s;font-family:inherit}
.cal-foot button:hover{opacity:.85}
.cal-foot button:active{transform:scale(.95)}

.add-card-btn{background:none;border:1px dashed var(--bd-i);border-radius:9px;color:var(--txt-d);padding:7px;cursor:pointer;font-size:12px;width:100%;transition:all .2s}
.add-card-btn:hover{border-color:#60a5fa;color:#60a5fa;background:rgba(96,165,250,.04)}
.add-card-btn:active{transform:scale(.98)}

function _syncCardCount(state){return(state.cols||[]).reduce(function(n,c){return n+(c.cards?c.cards.length:0);},0);}
function _syncColIds(state){return(state.cols||[]).map(function(c){return c.id;});}

function _isSafeWrite(state){
  if(!_remoteBaseline)return true; // no baseline yet (new board) — allow
  var cards=_syncCardCount(state);
  var colIds=_syncColIds(state);
  var baseCards=_remoteBaseline.cards;
  var baseColIds=_remoteBaseline.colIds;
  var baseGroups=_remoteBaseline.groups;
  // block: complete group wipe when board had groups
  if(baseGroups>0&&(state.groups||[]).length===0)return false;
  // block: complete column wipe when board had columns
  if(baseColIds.length>0&&colIds.length===0)return false;
  // block: card count drops to 0 from a board with meaningful data
  if(baseCards>3&&cards===0)return false;
  // block: >75% card loss in one write AND more than 5 cards would vanish
  var dropped=baseCards-cards;
  if(baseCards>0&&dropped/baseCards>0.75&&dropped>5)return false;

  if(baseColIds.length>2&&colIds.length>0){
    var matches=colIds.filter(function(id){return baseColIds.indexOf(id)!==-1;}).length;
    if(matches/baseColIds.length<0.2)return false;
  }
  return true;
}

function _setRemoteBaseline(state){
  _remoteBaseline={cards:_syncCardCount(state),colIds:_syncColIds(state),groups:(state.groups||[]).length};

  if(!FIREBASE_ENABLED||!_activeKey||_userDisconnected)return;

function connectToKey(key){
  // ── reset auto-reconnect state for this new attempt ──
  clearTimeout(_retryTimer);_retryTimer=null;
  _userDisconnected=false;
  _reconnecting=true;
  // flush any debounced board-state write before switching so local changes aren't lost
  if(_syncTimer&&_syncRef&&_activeKey){
    clearTimeout(_syncTimer);_syncTimer=null;
    if(_isSafeWrite(S)){
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);});
    }else{
      console.warn('Flush blocked by safety gate — local S looks like wrong board data.');
    }
  }
  // tear down any in-flight auto-snap write timer before switching boards
  clearTimeout(_autoSnapsWriteTimer);_autoSnapsWriteTimer=null;
  _remoteBaseline=null; // clear baseline when switching — new board has different structure
  if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncRef=null;_syncListener=null;}
  if(_autoSnapsRef&&_autoSnapsListener){_autoSnapsRef.off('value',_autoSnapsListener);_autoSnapsRef=null;_autoSnapsListener=null;}
  if(!FIREBASE_ENABLED||!key){updateSyncStatus('local');return;}
  _activeKey=key;localStorage.setItem('fb4_active_key',key);
  updateSyncStatus('syncing');
  clearTimeout(_connectTimeout);
  _connectTimeout=setTimeout(function(){
    if(_activeKey){updateSyncStatus('error');_reconnecting=false;_scheduleRetry();}
  },10000);
  _syncRef=_db.ref('boards/'+key+'/state');
  _syncListener=_syncRef.on('value',function(snap){
    if(_pendingWrites>0)return; // our own write in-flight — ignore echo
    var remote=snap.val();
    if(remote===null){
      // new board — push local up and establish baseline
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);_reconnecting=false;_retryStep=0;updateSyncStatus('synced');}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_reconnecting=false;updateSyncStatus('error');_scheduleRetry();});
      return;
    }
    migrateRemote(remote);
    // ── Board identity guard: only fires during ACTIVE sync (baseline already set) ──
    // On initial connect or board switch _remoteBaseline is null, so S still holds the
    // previous board's data. Pushing local here would overwrite the target board with the
    // wrong board's content — which is exactly the bug we must prevent.
    // During active sync (baseline set) a sudden boardId change on the remote is suspicious
    // (cross-contamination from another tab/device) — in that case push local to correct it.
    if(_remoteBaseline&&remote.boardId&&S.boardId&&remote.boardId!==S.boardId&&_isSafeWrite(S)){
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);_reconnecting=false;_retryStep=0;updateSyncStatus('synced');}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_reconnecting=false;updateSyncStatus('error');_scheduleRetry();});
      return;
    }
    // ── Conflict resolution: last-write-wins via lastModified timestamp ──
    // Set remote as the safety-gate baseline first so _isSafeWrite can compare
    // local S against the known cloud structure before any push.
    _setRemoteBaseline(remote);
    var localTs=S.lastModified||0;
    var remoteTs=remote.lastModified||0;
    // On initial connect / board switch the remote boardId differs from the stale local S.
    // Always trust the remote — it IS the board we just switched to.
    if(remote.boardId&&S.boardId&&remote.boardId!==S.boardId){
      _applyRemote(remote);_reconnecting=false;_retryStep=0;updateSyncStatus('synced');
      return;
    }
    if(localTs>remoteTs&&_isSafeWrite(S)){
      // Local is newer AND structurally consistent with cloud — push local up.
      _pendingWrites++;
      _syncRef.set(S).then(function(){
        _pendingWrites=Math.max(0,_pendingWrites-1);
        _setRemoteBaseline(S);
        _reconnecting=false;_retryStep=0;
        updateSyncStatus('synced');
        notify('☁ Local changes were newer — synced to cloud.');
      }).catch(function(err){
        // Push failed — safe fallback: adopt cloud state so nothing is left inconsistent.
        _pendingWrites=Math.max(0,_pendingWrites-1);
        console.warn('[Sync] Push-local failed, reverting to cloud state:',err);
        _applyRemote(remote);
        _reconnecting=false;_retryStep=0;
        updateSyncStatus('synced');
      });
      return;
    }
    // Remote is newer, tied, or safety gate blocked the local push — apply cloud state.
    _applyRemote(remote);
    _reconnecting=false;_retryStep=0;
    updateSyncStatus('synced');
  },function(err){console.warn('[Sync] Firebase listener error:',err);_reconnecting=false;updateSyncStatus('error');_scheduleRetry();});

  // ── Auto-snapshots cloud sync ──
  // Separate Firebase path — independent of the main board-state listener.
  // Bidirectional merge: remote-only snaps come down, local-only snaps (created offline) go up.
  _autoSnapsRef=_db.ref('boards/'+key+'/autoSnaps');
  _autoSnapsListener=_autoSnapsRef.on('value',function(snap){
    if(_autoSnapsPending>0)return; // our own write in-flight — ignore echo
    var remote=snap.val();
    // Firebase may return a sparse-key object instead of an array for edge cases — normalise.
    if(remote&&!Array.isArray(remote))remote=Object.values(remote).filter(Boolean);
    var local=getAutoBaks();
    if(!remote||remote.length===0){
      // No cloud snaps yet — push local ones up (e.g. first time connecting from this device)
      if(local.length>0)_pushAutoSnapsToCloud(local);
      return;
    }
    // Compute what's in remote but not local, and vice-versa
    var localIds=local.map(function(x){return x.id;});
    var remoteIds=remote.map(function(x){return x.id;});
    var remoteOnly=remote.filter(function(x){return localIds.indexOf(x.id)===-1;});
    var localOnly=local.filter(function(x){return remoteIds.indexOf(x.id)===-1;});
    if(remoteOnly.length===0&&localOnly.length===0)return; // fully in sync — nothing to do
    // Merge: take everything from both sides, sort newest-first, cap at 15
    var merged=remote.concat(localOnly);
    merged.sort(function(a,b){return b.ts-a.ts;});
    if(merged.length>15)merged.splice(15);
    setAutoBaks(merged);
    if(localOnly.length>0){
      // Push merged set back so local-only snaps (created offline) reach the cloud
      _pushAutoSnapsToCloud(merged);
    }
  },function(err){
    console.warn('[AutoSnap] Cloud read failed — using local cache:',err);
  });
}

function forcePushToCloud(){

  _autoSnapBefore('Before: Manual force-push to cloud – '+new Date().toLocaleTimeString());
  updateSyncStatus('syncing');

  save();
  _syncRef.set(S).then(function(){
    _pendingWrites=Math.max(0,_pendingWrites-1);

function forcePullFromCloud(){

  if(!confirm('Pull the cloud board to your local device?\n\nThis will replace your current local board with the cloud version.'))return;
  _autoSnapBefore('Before: Manual force-pull from cloud – '+new Date().toLocaleTimeString());
  updateSyncStatus('syncing');
  _syncRef.once('value').then(function(snap){
    var remote=snap.val();
    if(!remote){notify('⚠️ No cloud data found for this board.');updateSyncStatus('synced');return;}
    migrateRemote(remote);
    _applyRemote(remote);
    updateSyncStatus('synced');
    notify('☁ Cloud board loaded locally.');

  }).catch(function(err){
    updateSyncStatus('error');

function disconnectSync(){
  if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncRef=null;_syncListener=null;}
  if(_autoSnapsRef&&_autoSnapsListener){_autoSnapsRef.off('value',_autoSnapsListener);_autoSnapsRef=null;_autoSnapsListener=null;}
  clearTimeout(_syncTimer);clearTimeout(_connectTimeout);_connectTimeout=null;
  clearTimeout(_retryTimer);_retryTimer=null;
  clearTimeout(_autoSnapsWriteTimer);_autoSnapsWriteTimer=null;
  _pendingWrites=0;_autoSnapsPending=0;_skipFbWrite=false;_remoteBaseline=null;

// Apply a validated remote snapshot to local state and re-render.
// Always call _setRemoteBaseline before this so the safety gate has the right context.
function _applyRemote(remote){
  _setRemoteBaseline(remote);
  S=remote;
  // Remote state replaces local — the existing undo stack belongs to the old S and
  // would produce incorrect results if applied to the new remote state. Clear it.
  _undoStack=[];_redoStack=[];
  try{sessionStorage.removeItem('fb4_undo');}catch(e){}
  _updateUndoUI();
  curTheme=S.prefs.theme;
  document.documentElement.setAttribute('data-theme',S.prefs.theme);
  if(S.prefs.modalW>=320)_modalW=S.prefs.modalW;
  _modalH=(S.prefs.modalH>=200?S.prefs.modalH:null);
  if(S.prefs.boardName&&_activeKey&&(!remote.boardId||remote.boardId===S.boardId)){
    var lk=getKeys();var lke=lk.find(function(k){return k.key===_activeKey;});
    if(lke&&lke.label!==S.prefs.boardName){lke.label=S.prefs.boardName;setKeys(lk);window._keysModalRender&&window._keysModalRender();}
  }
  _skipFbWrite=true;save();render();_skipFbWrite=false;
}

function initSync(){
  if(!FIREBASE_ENABLED)return;
  // Only wrap the SDK init — a throw here means Firebase is unavailable and we should bail.
  // Everything after (listeners, connectToKey, event hooks) runs outside the catch so that
  // a future error there never silently kills the startup sequence.
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _db=firebase.database();
    // NOTE: setPersistenceEnabled is a Firestore-only API. Firebase RTDB web SDK does NOT
    // support disk persistence (mobile SDKs only). In-memory caching + auto-reconnect are
    // handled automatically by the RTDB SDK — no explicit call needed.
  }catch(e){console.warn('[Sync] Firebase init failed:',e);return;}

  _db.ref('.info/connected').on('value',function(snap){
    if(!_activeKey)return;
    if(!snap.val()){
      // Gone offline — clear stuck pending writes so remote updates aren't blocked on reconnect
      clearTimeout(_syncTimer);_pendingWrites=0;
      updateSyncStatus('offline');
      // restart watchdog — if we don't come back within 10s, show error and schedule retry
      clearTimeout(_connectTimeout);
      _connectTimeout=setTimeout(function(){
        if(_activeKey){updateSyncStatus('error');_reconnecting=false;_scheduleRetry();}
      },10000);
    }else{
      // Back online — verify the Firebase listener is still wired up
      if(!_syncRef||!_syncListener){
        // Listener was lost (e.g. long suspension, SDK re-init) — re-establish cleanly
        _reconnecting=false;
        _retryStep=0;
        connectToKey(_activeKey);
      }else if(_pendingWrites===0){
        updateSyncStatus('synced');
      }
    }
  });
  var savedKey=localStorage.getItem('fb4_active_key');
  if(savedKey)connectToKey(savedKey);

  // Background-refresh labels for every inactive board so the keys modal
  // always shows current names without requiring a board switch.
  // Fetches only the prefs/boardName field — minimal bandwidth.
  getKeys().forEach(function(ke){
    if(ke.key===savedKey)return;
    _db.ref('boards/'+ke.key+'/state/prefs/boardName').once('value').then(function(snap){
      var remoteName=snap.val();
      if(!remoteName)return;
      var lk=getKeys();
      var lke=lk.find(function(k){return k.key===ke.key;});
      if(lke&&lke.label!==remoteName){lke.label=remoteName;setKeys(lk);window._keysModalRender&&window._keysModalRender();}
    }).catch(function(){});
  });

  // ── Background reconnect triggers ──
  // Fires when device regains network (e.g. wifi reconnected, browser reopen after sleep)
  window.addEventListener('online',function(){
    if(!FIREBASE_ENABLED||!_activeKey||_userDisconnected||_reconnecting)return;
    clearTimeout(_retryTimer);_retryTimer=null;_retryStep=0;
    connectToKey(_activeKey);
  });
  // Fires when the user returns to a backgrounded/hidden tab
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(!FIREBASE_ENABLED||!_activeKey||_userDisconnected||_reconnecting)return;
    if(_syncStatus==='error'||_syncStatus==='offline'){
      clearTimeout(_retryTimer);_retryTimer=null;_retryStep=0;
      connectToKey(_activeKey);
    }
  });
}

function save(){
  if(!_skipFbWrite)S.lastModified=Date.now(); // only stamp real local changes, not remote renders
  try{
    var data=JSON.stringify(S);localStorage.setItem('fb4',data);
    var used=new Blob([data]).size
      +new Blob([localStorage.getItem(_bakKey())||'']).size
      +new Blob([localStorage.getItem(_autoKey())||'']).size;
    if(used>4*1024*1024&&!save._warned){save._warned=true;notify('⚠️ Storage nearly full — export a backup soon!');}
    else if(used<=4*1024*1024){save._warned=false;}
  }catch(e){notify('❌ Save failed — storage may be full!');}
  // ── Idle auto-snapshot: fires 20min after the last real user action ──
  if(!_skipFbWrite&&!_undoInProgress){
    _savesSinceAutoSnap++;
    clearTimeout(_idleSnapTimer);
    _idleSnapTimer=setTimeout(function(){
      if(_savesSinceAutoSnap>0){
        _createAutoSnap('Idle checkpoint \u2013 '+new Date().toLocaleTimeString(),'idle');
      }
    },20*60*1000);
  }
  if(!_skipFbWrite)usbSave();
  if(FIREBASE_ENABLED&&_syncRef&&_activeKey&&!_skipFbWrite&&!_usbMode){
    clearTimeout(_syncTimer);
    _syncTimer=setTimeout(function(){
      if(!_isSafeWrite(S)){
        updateSyncStatus('error');
        notify('🛑 Sync blocked — this write would delete most of your board data. Switch boards or reload to resync.');
        console.error('Firebase write blocked by safety gate. Baseline:',_remoteBaseline,'Attempted:',{cards:_syncCardCount(S),cols:S.cols&&S.cols.length,groups:S.groups&&S.groups.length});
        return;
      }
      _pendingWrites++;
      updateSyncStatus('syncing');
      _syncRef.set(S).then(function(){
        _pendingWrites=Math.max(0,_pendingWrites-1);
        _setRemoteBaseline(S); // update baseline to confirmed state
        if(_pendingWrites===0)updateSyncStatus('synced');
      }).catch(function(err){
        _pendingWrites=Math.max(0,_pendingWrites-1);
        updateSyncStatus('error');
        console.error('Firebase write failed:',err);
      });
    },600);
  }
}

function updateUSBStatus(state){

  var el=document.getElementById('sync-status');if(!el)return;
  var map={
    off:        {t:'\u{1F4BE} Local',      c:'var(--txt-dd)',bg:'var(--surf2)',         bd:'var(--bd)',              cur:'default', ttl:''},

    synced:     {t:'🟢 USB Synced', c:'#10b981',     bg:'rgba(16,185,129,.12)', bd:'rgba(16,185,129,.35)',   cur:'default', ttl:'USB drive connected and syncing'},
    lost:       {t:'🔴 USB Lost',   c:'#e11d48',     bg:'rgba(225,29,72,.15)',  bd:'rgba(225,29,72,.45)',    cur:'pointer', ttl:'Drive connection severed — click to reconnect'},
  };

function _usbBoardFilename(boardId){return 'board-'+boardId+'.json';}

function _usbReadIndex(){
  return _usbHandle.getFileHandle(USB_INDEX_FILENAME).then(function(fh){
    return fh.getFile().then(function(f){return f.text();});
  }).then(function(txt){
    var idx=JSON.parse(txt);
    return Array.isArray(idx)?idx:[];
  });
}

function _usbWriteIndex(index){
  if(!_usbHandle)return Promise.resolve();
  return _usbHandle.getFileHandle(USB_INDEX_FILENAME,{create:true}).then(function(fh){
    return fh.createWritable();
  }).then(function(w){
    return w.write(JSON.stringify(index)).then(function(){return w.close();});
  });
}

function _usbUpdateIndex(state){
  var idx=_usbIndex||[];
  var entry={boardId:state.boardId,name:(state.prefs&&state.prefs.boardName)||'Board',
    lastModified:state.lastModified||0,
    cards:(state.cols||[]).reduce(function(n,c){return n+(c.cards||[]).filter(function(k){return !k.archived;}).length;},0)};
  var found=false;
  for(var i=0;i<idx.length;i++){if(idx[i].boardId===state.boardId){idx[i]=entry;found=true;break;}}
  if(!found)idx.push(entry);
  _usbIndex=idx;
  return _usbWriteIndex(idx);
}

function _usbWriteBoard(state){
  if(!_usbHandle)return Promise.resolve();
  return _usbHandle.getFileHandle(_usbBoardFilename(state.boardId),{create:true}).then(function(fh){
    return fh.createWritable();
  }).then(function(w){
    return w.write(JSON.stringify(state)).then(function(){return w.close();});
  }).catch(function(e){
    console.warn('[USB] Write failed:',e);
    handleUSBLost();
  });
}

function _usbWriteState(state){
  if(!_usbHandle)return Promise.resolve();
  return _usbWriteBoard(state).then(function(){return _usbUpdateIndex(state);}).catch(function(e){
    console.warn('[USB] Write failed:',e);handleUSBLost();
  });
}

function connectUSB(handle){
  _usbHandle=handle;
  updateUSBStatus('connecting');
  _usbReadIndex().then(function(index){
    _usbIndex=index;
    var entry=null;
    for(var i=0;i<index.length;i++){if(index[i].boardId===S.boardId){entry=index[i];break;}}
    if(entry){
      return handle.getFileHandle(_usbBoardFilename(S.boardId)).then(function(fh){
        return fh.getFile().then(function(f){return f.text();});
      }).then(function(txt){
        var remote=JSON.parse(txt);
        var localTs=S.lastModified||0,remoteTs=remote.lastModified||0;
        if(remoteTs>localTs){
          _autoSnapBefore('Before: USB drive loaded (drive was newer) – '+new Date().toLocaleTimeString());
          _applyFromUSB(remote);
          notify('💾 Drive data loaded — it was newer than your local board.');
        }else{
          _usbWriteState(S);
          notify('💾 Drive updated — your local board was newer.');
        }
        _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();
        if(document.querySelector('#modal-root .overlay'))showBackupModal();
      });
    }else{
      showUSBBoardPickerModal(index);
    }
  }).catch(function(e){
    if(e.name==='NotFoundError'){
      handle.getFileHandle('flowboard-data.json').then(function(fh){
        return fh.getFile().then(function(f){return f.text();});
      }).then(function(txt){
        var legacy=JSON.parse(txt);
        if(!legacy.boardId)legacy.boardId=uid();
        var idx=[{boardId:legacy.boardId,name:(legacy.prefs&&legacy.prefs.boardName)||'Board',
          lastModified:legacy.lastModified||0,
          cards:(legacy.cols||[]).reduce(function(n,c){return n+(c.cards||[]).filter(function(k){return !k.archived;}).length;},0)}];
        _usbIndex=idx;
        return _usbWriteIndex(idx).then(function(){return _usbWriteBoard(legacy);}).then(function(){return legacy;});
      }).then(function(legacy){
        if(legacy.boardId===S.boardId){
          var localTs=S.lastModified||0,remoteTs=legacy.lastModified||0;
          if(remoteTs>localTs){
            _autoSnapBefore('Before: USB drive loaded (drive was newer) – '+new Date().toLocaleTimeString());
            _applyFromUSB(legacy);
            notify('💾 Legacy drive data migrated — drive was newer.');
          }else{
            _usbWriteState(S);
            notify('💾 Drive migrated to new format — your local board was newer.');
          }
          _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();
          if(document.querySelector('#modal-root .overlay'))showBackupModal();
        }else{
          showUSBBoardPickerModal(_usbIndex);
        }
      }).catch(function(le){
        if(le.name==='NotFoundError'){
          _usbWriteState(S).then(function(){
            _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();
            notify('💾 Board saved to USB drive!');
            if(document.querySelector('#modal-root .overlay'))showBackupModal();
          });
        }else{
          _usbMode=false;_usbHandle=null;
          updateSyncStatus(_activeKey?'synced':'local');
          notify('❌ Drive error: '+le.message);
        }
      });
    }else{
      _usbMode=false;_usbHandle=null;
      updateSyncStatus(_activeKey?'synced':'local');
      notify('❌ Drive error: '+e.message);
    }
  });
}

    var remote=JSON.parse(txt);

function load(){
  try{var r=localStorage.getItem('fb4');if(r){S=JSON.parse(r);
    // migrate prefs from old localStorage keys if not yet in S
    if(!S.prefs){
      var _lsm={};try{_lsm=JSON.parse(localStorage.getItem('fb4_modal_size')||'{}');}catch(e){}
      S.prefs={theme:localStorage.getItem('fb4_theme')||'midnight',modalW:(_lsm.w>=320?_lsm.w:510),modalH:(_lsm.h>=200?_lsm.h:null)};
    }
    if(S.prefs.theme===undefined)S.prefs.theme='midnight';
    if(S.prefs.modalW===undefined)S.prefs.modalW=510;
    if(S.prefs.modalH===undefined)S.prefs.modalH=null;
    if(!S.prefs.boardName)S.prefs.boardName='My Board';
    if(!S.lastModified)S.lastModified=0;
    // reconcile boardName into fb4_keys immediately so the modal never shows a stale label
    var _sk=localStorage.getItem('fb4_active_key');
    if(_sk&&S.prefs.boardName){
      var _lk=getKeys();
      var _lke=_lk.find(function(k){return k.key===_sk;});
      if(_lke&&_lke.label!==S.prefs.boardName){_lke.label=S.prefs.boardName;setKeys(_lk);}
    }
    S.groups.forEach(function(g){if(g.limit===undefined)g.limit=0;});
    S.cols.forEach(function(c){
      if(c.wip===undefined)c.wip=0;
      if(c.collapsed===undefined)c.collapsed=false;
      if(c.sort===undefined)c.sort=false;
      c.cards.forEach(function(k){
        if(k.color===undefined)k.color=null;
        if(k.desc===undefined)k.desc='';
        if(k.due===undefined)k.due='';
      });
    });if(!S.boardId)S.boardId=uid();return;}}catch(e){}
  // No localStorage data — persist the default state but do NOT stamp lastModified=Date.now().
  // Keeping lastModified=0 ensures the Firebase listener sees the cloud as newer on first connect
  // and pulls the real board instead of overwriting it with this empty default.
  S=defaultState();_skipFbWrite=true;save();_skipFbWrite=false;
}

function _autoKey(){return 'fb4_auto_'+(_activeKey||'local');}
function getAutoBaks(){try{return JSON.parse(localStorage.getItem(_autoKey())||'[]');}catch(e){return[];}}
function setAutoBaks(a){try{localStorage.setItem(_autoKey(),JSON.stringify(a));}catch(e){console.warn('[AutoSnap] Storage full — auto-snapshot skipped.');}}

function _createAutoSnap(name,trigger){
  var tc=_syncCardCount(S);
  var autos=getAutoBaks();
  autos.unshift({id:uid(),name:name,ts:Date.now(),trigger:trigger||'auto',cards:tc,data:JSON.stringify(S)});
  if(autos.length>15)autos.splice(15);
  setAutoBaks(autos);
  _savesSinceAutoSnap=0;
  // Push to cloud immediately (debounced 2s — rapid snaps batch into one write)
  _pushAutoSnapsToCloud(autos);
}

// Called once at startup — snapshots the board as it was when the session began.
// Only fires if the board has been modified since the last auto-snapshot.
function _sessionStartSnap(){
  var boardTs=S.lastModified||0;
  if(boardTs===0)return; // never been saved — default demo state, skip
  var autos=getAutoBaks();
  var lastAutoTs=autos.length>0?autos[0].ts:0;
  if(boardTs<=lastAutoTs)return; // no changes since last auto-snap
  _createAutoSnap('Opened \u2013 '+new Date().toLocaleString(),'session');
}

// Called before destructive actions (delCol, delGroup, restore, import).
function _autoSnapBefore(label){
  _createAutoSnap(label,'destructive');
}

function restoreAutoBak(id){
  var b=getAutoBaks().find(function(x){return x.id===id;});
  if(!b||!confirm('Restore this auto-snapshot? Current board will be replaced.'))return;
  _autoSnapBefore('Before: Restore auto-snapshot \u2013 '+new Date().toLocaleTimeString());
  _undoStack=[];_redoStack=[];_persistUndoSession();_updateUndoUI();
  S=JSON.parse(b.data);save();render();closeModal();notify('✅ Board restored from auto-snapshot!');
}
function deleteAutoBak(id){
  var remaining=getAutoBaks().filter(function(x){return x.id!==id;});
  setAutoBaks(remaining);
  _pushAutoSnapsToCloud(remaining);
  showBackupModal();
}

// Write the full auto-snaps array to Firebase. Debounced 2s so rapid snap creation
// (e.g. session-start + before-destructive firing in quick succession) sends one write.
// Uses the same in-flight counter pattern as the main board-state sync.
function _pushAutoSnapsToCloud(autos){
  if(!FIREBASE_ENABLED||!_autoSnapsRef)return;
  clearTimeout(_autoSnapsWriteTimer);
  _autoSnapsWriteTimer=setTimeout(function(){
    _autoSnapsWriteTimer=null;
    var payload=autos||getAutoBaks();
    if(!payload.length)return; // nothing to push
    _autoSnapsPending++;
    _autoSnapsRef.set(payload).then(function(){
      _autoSnapsPending=Math.max(0,_autoSnapsPending-1);
    }).catch(function(err){
      _autoSnapsPending=Math.max(0,_autoSnapsPending-1);
      console.warn('[AutoSnap] Cloud write failed (snap still saved locally):',err);
    });
  },2000);
}

// ── UNDO / REDO ──
function _updateUndoUI(){
  var ub=document.getElementById('undo-btn');
  var rb=document.getElementById('redo-btn');
  if(ub){
    var ul=_undoStack.length;
    ub.disabled=ul===0;
    ub.title=ul===0?'Nothing to undo':'Undo ('+ul+' step'+(ul!==1?'s':'')+') \u2014 Ctrl+Z';
  }
  if(rb){
    var rl=_redoStack.length;
    rb.disabled=rl===0;
    rb.title=rl===0?'Nothing to redo':'Redo ('+rl+' step'+(rl!==1?'s':'')+') \u2014 Ctrl+Y';
  }
}
function _persistUndoSession(){
  try{
    // Mirror last 10 undo entries to sessionStorage for crash/F5 recovery within the same browser session.
    // sessionStorage clears automatically on browser/tab close — no stale data bleeds across sessions.
    var slice=_undoStack.slice(-10);
    sessionStorage.setItem('fb4_undo',JSON.stringify(slice));
  }catch(e){}
}
function _restoreUndoSession(){
  try{
    var stored=sessionStorage.getItem('fb4_undo');
    if(!stored)return;
    var arr=JSON.parse(stored);
    if(!Array.isArray(arr)||arr.length===0)return;
    _undoStack=arr;
    _updateUndoUI();
    notify('↩ Undo history restored from last session ('+arr.length+' step'+(arr.length!==1?'s':'')+')');
  }catch(e){}
}

// Push current S to undo stack BEFORE a mutation. Call at the start of every action
// function, after any guard/early-return checks but before mutating S.
function _pushUndo(){
  if(_skipFbWrite||_undoInProgress)return; // skip remote renders and undo/redo applies
  _undoStack.push(JSON.stringify(S));
  if(_undoStack.length>50)_undoStack.shift();
  _redoStack=[]; // a new action invalidates any forward redo history
  _persistUndoSession();
  _updateUndoUI();
}

function doUndo(){
  if(_undoStack.length===0)return;
  _redoStack.push(JSON.stringify(S));
  if(_redoStack.length>50)_redoStack.shift();
  _undoInProgress=true;
  S=JSON.parse(_undoStack.pop());
  save();render();
  _undoInProgress=false;
  _persistUndoSession();
  _updateUndoUI();
  notify('↩ Undone'+((_undoStack.length>0)?' ('+_undoStack.length+' more)':''));
}

function doRedo(){
  if(_redoStack.length===0)return;
  _undoStack.push(JSON.stringify(S));
  if(_undoStack.length>50)_undoStack.shift();
  _undoInProgress=true;
  S=JSON.parse(_redoStack.pop());
  save();render();
  _undoInProgress=false;
  _persistUndoSession();
  _updateUndoUI();
  notify('↪ Redone'+((_redoStack.length>0)?' ('+_redoStack.length+' more)':''));
}

function moveCard(cid,fromId,toId,beforeId){
  var fc=S.cols.find(function(x){return x.id===fromId;}),tc=S.cols.find(function(x){return x.id===toId;});
  if(!fc||!tc)return;
  var idx=fc.cards.findIndex(function(x){return x.id===cid;});if(idx<0)return;
  _pushUndo();
  var card=fc.cards.splice(idx,1)[0];
  if(beforeId){var bi=tc.cards.findIndex(function(x){return x.id===beforeId;});tc.cards.splice(bi<0?tc.cards.length:bi,0,card);}
  else tc.cards.push(card);
  settleCardId=cid;save();render();settleCardId=null;
}

function moveColumn(colId,toGroupId,beforeColId){
  var fc=S.cols.find(function(x){return x.id===colId;});
  if(!fc)return;
  var idx=S.cols.findIndex(function(x){return x.id===colId;});
  _pushUndo();
  var col=S.cols.splice(idx,1)[0];
  col.gid=toGroupId;
  if(beforeColId){
    var bi=S.cols.findIndex(function(x){return x.id===beforeColId;});
    S.cols.splice(bi<0?S.cols.length:bi,0,col);
  }else{
    var lastIdx=-1;
    for(var i=0;i<S.cols.length;i++){if(S.cols[i].gid===toGroupId)lastIdx=i;}
    if(lastIdx!==-1)S.cols.splice(lastIdx+1,0,col);
    else S.cols.push(col);
  }
  save();render();
}

function getGroupForCol(colId){var col=S.cols.find(function(x){return x.id===colId;});if(!col||!col.gid)return null;return S.groups.find(function(x){return x.id===col.gid;})||null;}
function setGroupLimit(gid,n){var g=S.groups.find(function(x){return x.id===gid;});if(!g)return;_pushUndo();g.limit=Math.max(0,parseInt(n)||0);save();render();}

var _calMonth=null,_calYear=null,_calColId=null;
function openCMCal(e,colId){
  e.stopPropagation();

  _calColId=colId;

function renderCal(){
  var drop=document.getElementById('cm-cal-drop');if(!drop)return;
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var today=new Date();today.setHours(0,0,0,0);
  var selStr=EC.due||'';
  var first=new Date(_calYear,_calMonth,1);
  var startDay=first.getDay();
  var daysInMonth=new Date(_calYear,_calMonth+1,0).getDate();
  var prevDays=new Date(_calYear,_calMonth,0).getDate();
  var h='<div class="cal-hdr">'+
    '<button class="cal-nav" onclick="calNav(-1)">◂</button>'+
    '<span class="cal-hdr-title">'+MONTHS[_calMonth]+' '+_calYear+'</span>'+
    '<button class="cal-nav" onclick="calNav(1)">▸</button>'+
  '</div><div class="cal-grid">';
  DAYS.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<startDay;i++){
    var pd=prevDays-startDay+1+i;
    h+='<div class="cal-day other">'+pd+'</div>';
  }
  for(var d=1;d<=daysInMonth;d++){
    var dt=new Date(_calYear,_calMonth,d);
    var iso=_calYear+'-'+String(_calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='cal-day';
    if(dt.getTime()===today.getTime())cls+=' today';
    if(iso===selStr)cls+=' selected';
    if(dt<today&&dt.getTime()!==today.getTime())cls+=' past';
    h+='<div class="'+cls+'" onclick="pickCalDay(\''+iso+'\')">'+d+'</div>';
  }
  var totalCells=startDay+daysInMonth;
  var rem=totalCells%7?7-totalCells%7:0;
  for(var i=1;i<=rem;i++){h+='<div class="cal-day other">'+i+'</div>';}
  h+='</div>';
  h+='<div class="cal-foot">'+
    '<button style="background:var(--surf3);color:var(--txt-m)" onclick="pickCalDay(\'\')">Clear</button>'+
    '<button style="background:rgba(96,165,250,.15);color:#60a5fa" onclick="pickCalToday()">Today</button>'+
  '</div>';
  drop.innerHTML=h;
}
function calNav(dir){_calMonth+=dir;if(_calMonth>11){_calMonth=0;_calYear++;}if(_calMonth<0){_calMonth=11;_calYear--;}renderCal();}
function pickCalDay(iso){
  EC.due=iso;saveCard(EC);

function updateDropIndicator(el,x,y){

      _pd.dropBeforeColId=(refEl&&refEl.dataset&&refEl.dataset.colid)?refEl.dataset.colid:null;

  }else{
    var card=el.closest&&el.closest('.card[data-cid]');

      var r=card.getBoundingClientRect(),above=y<r.top+r.height/2;
      var ind2=document.createElement('div');ind2.id='drop-ind';
      card.parentNode.insertBefore(ind2,above?card:card.nextSibling);
      _pd.dropColId=body?body.id.slice(3):_pd.fromColId;
      var refEl=above?card:card.nextSibling;
      while(refEl&&refEl.id==='drop-ind')refEl=refEl.nextSibling;
      _pd.dropBeforeId=(refEl&&refEl.dataset&&refEl.dataset.cid)?refEl.dataset.cid:null;
    }else if(body&&!card){
      body.classList.add('drag-over');

        cancelAnimationFrame(_momentumTimer);
      }
    }
  });
  document.addEventListener('pointermove',function(e){
    if(window._pendingPd){
      var threshold=e.pointerType==='touch'?15:5;
      if(Math.abs(e.clientX-window._pendingPd.startX)>threshold||Math.abs(e.clientY-window._pendingPd.startY)>threshold){
        if(window._pendingPd.el)window._pendingPd.el.classList.remove('grab-fading');
        clearTimeout(window._pdTimer);window._pendingPd=null;
      }
    }
    if(_pd){
      _swipe.active=false;
      var dx=e.clientX-_pd.startX,dy=e.clientY-_pd.startY;
      if(!_pd.moved){
        if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
        _pd.moved=true;
        _pd.el.classList.remove('grab-fading');_pd.el.style.boxShadow='';_pd.el.style.transform='';
        if(!_pd.ghost){
          var g=_pd.el.cloneNode(true);g.id='dg';
          g.classList.remove('anim-card-new','anim-card-settle','anim-card-fill','grab-fading','anim-col-new');
          g.style.cssText='position:fixed;pointer-events:none;z-index:9999;opacity:.88;width:'+_pd.el.offsetWidth+'px;transform:rotate(2deg) scale(1.04);box-shadow:0 16px 48px rgba(0,0,0,.5);border-radius:10px;transition:none;';
          document.body.appendChild(g);_pd.ghost=g;
          _pd.el.style.opacity='0.15';
          document.body.style.userSelect='none';
        }
      }
      _pd.ghost.style.left=(e.clientX-_pd.ox)+'px';
      _pd.ghost.style.top=(e.clientY-_pd.oy)+'px';
      _pd.ghost.style.display='none';
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      _pd.ghost.style.display='';
      updateDropIndicator(hit,e.clientX,e.clientY);
      return;
    }
    if(_swipe.active){
      var dx=e.clientX-_swipe.x,dy=e.clientY-_swipe.y;
      if(!_swipe.moved && (Math.abs(dx)>2||Math.abs(dy)>2)){
        _swipe.moved=true;
        _swipe.dir=Math.abs(dx)>Math.abs(dy)?'x':'y';
      }
      if(_swipe.moved&&_swipe.target){
        if(_swipe.dir==='x'){
          if(_swipe.target.classList&&_swipe.target.classList.contains('group-cols')) _swipe.target.scrollLeft-=dx;
        }else{
          var board=document.getElementById('board');if(board)board.scrollTop-=dy;
        }
        var now=Date.now(),dt=Math.max(1,now-_swipe.time);
        _swipe.vx=dx/dt;_swipe.vy=dy/dt;_swipe.time=now;_swipe.x=e.clientX;_swipe.y=e.clientY;
      }
    }
  });
  document.addEventListener('pointerup',function(){
    if(window._pendingPd){if(window._pendingPd.el)window._pendingPd.el.classList.remove('grab-fading');clearTimeout(window._pdTimer);window._pendingPd=null;}
    if(_swipe.active){
      _swipe.active=false;
      if(_swipe.moved){
        var prevent=function(ev){ev.stopPropagation();ev.preventDefault();document.removeEventListener('click',prevent,true);};
        document.addEventListener('click',prevent,true);
        setTimeout(function(){document.removeEventListener('click',prevent,true);},50);
      }
      var vx=_swipe.vx*16,vy=_swipe.vy*16,target=_swipe.target;
      if(_swipe.dir==='x') vy=0; else vx=0;
      if(Math.abs(vx)>1||Math.abs(vy)>1){
        var animate=function(){
          vx*=0.92;vy*=0.92;
          if(Math.abs(vx)<0.5&&Math.abs(vy)<0.5)return;
          if(_swipe.dir==='x'){
            if(target.classList&&target.classList.contains('group-cols')) target.scrollLeft-=vx;
          }else{
            var board=document.getElementById('board');if(board)board.scrollTop-=vy;
          }
          _momentumTimer=requestAnimationFrame(animate);
        };
        animate();
      }
    }
    if(!_pd)return;
    var pd=_pd;_pd=null;
    document.body.style.userSelect='';
    if(pd.ghost)pd.ghost.remove();
    pd.el.classList.remove('grab-fading');pd.el.style.opacity='';pd.el.style.boxShadow='';pd.el.style.transform='';
    var ind=document.getElementById('drop-ind');if(ind)ind.remove();
    var indCol=document.getElementById('drop-ind-col');if(indCol)indCol.remove();
    document.querySelectorAll('.col-body.drag-over').forEach(function(x){x.classList.remove('drag-over');});
    if(!pd.moved)return;
    var suppress=function(e){e.stopPropagation();e.preventDefault();document.removeEventListener('click',suppress,true);};
    document.addEventListener('click',suppress,true);
    if(pd.type==='col'){
      if(pd.dropGroupId!==undefined){
        moveColumn(pd.colId, pd.dropGroupId, pd.dropBeforeColId);
      }
    }else{
      if(pd.dropColId){
        var destCol=S.cols.find(function(c){return c.id===pd.dropColId;});
        if(destCol&&destCol.sort){destCol.sort=false;notify('↕ Priority sort disabled');}
        settleCardId=pd.cid;moveCard(pd.cid,pd.fromColId,pd.dropColId,pd.dropBeforeId||null);settleCardId=null;
      }
    }
  });
  document.addEventListener('pointercancel',function(){
    if(window._pendingPd){if(window._pendingPd.el)window._pendingPd.el.classList.remove('grab-fading');clearTimeout(window._pdTimer);window._pendingPd=null;}
    _swipe.active=false;cancelAnimationFrame(_momentumTimer);
    if(!_pd)return;
    var pd=_pd;_pd=null;
    document.body.style.userSelect='';
    if(pd.ghost)pd.ghost.remove();
    pd.el.classList.remove('grab-fading');pd.el.style.opacity='';pd.el.style.boxShadow='';pd.el.style.transform='';
    var ind=document.getElementById('drop-ind');if(ind)ind.remove();
    var indCol=document.getElementById('drop-ind-col');if(indCol)indCol.remove();
    document.querySelectorAll('.col-body.drag-over').forEach(function(x){x.classList.remove('drag-over');});
  });
}

  var pri=PRI[card.pri]||PRI[0];
  var borderColor=card.color||pri.d;
  var pct=card.items.length?Math.round(card.done.length/card.items.length*100):null;
  var dc=dueClass(card.due);
  var div=document.createElement('div');div.className='card';div.dataset.cid=card.id;
  div.style.borderLeftColor=borderColor;
  if(card.color){div.dataset.color=card.color;div.style.background=hexToRgba(card.color,isLight()?.09:.13);}
  if(card.id===fillId)div.classList.add('anim-card-fill');
  else if(card.id===newCardId)div.classList.add('anim-card-new');
  else if(card.id===settleCardId)div.classList.add('anim-card-settle');
  var h='<div class="card-title">'+esc(card.title)+'</div>';
  if(pct!==null){
    h+='<div class="prog-row"><span>Progress</span><span style="color:'+(pct===100?'#10b981':'var(--txt-m)')+'">'+pct+'%</span></div>'+
      '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+(pct===100?'#10b981':borderColor)+'"></div></div>';
  }
  h+='<div class="card-meta"><span class="pri-badge" style="background:'+pri.b+';color:'+pri.d+'">'+pri.l+'</span>'+card.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
  if(dc){
    var icon=dc==='over'?'⚠ ':dc==='soon'?'⏰ ':'📅 ';
    h+='<span class="due-badge due-'+dc+'">'+icon+dueLabel(card.due)+'</span>';
  }
  h+='</div>';
  div.innerHTML=h;
  if(expanded&&card.items&&card.items.length){
    var incomplete=card.items.filter(function(it){return !card.done.includes(it);});
    var taskWrap=document.createElement('div');taskWrap.className='card-tasks';
    if(incomplete.length){
      incomplete.slice(0,3).forEach(function(item){
        var t=document.createElement('div');t.className='card-task';t.textContent=item;
        t.onmouseenter=function(e){showTipAlways(e,item);};
        t.onmousemove=moveTip;
        t.onmouseleave=hideTip;
        taskWrap.appendChild(t);
      });
    }else{
      var done=document.createElement('div');
      done.style.cssText='font-size:11px;color:#10b981;padding:2px 4px;line-height:1.5';
      done.textContent='✓ All tasks complete';
      taskWrap.appendChild(done);
    }
    var meta=div.querySelector('.card-meta');
    if(meta)div.insertBefore(taskWrap,meta);else div.appendChild(taskWrap);
  }
  div.addEventListener('pointerdown',function(e){
    if((e.button!==0&&e.pointerType!=='touch')||e.target.closest('input,textarea,button,select,a'))return;
    var r=div.getBoundingClientRect();
    window._pendingPd={cid:card.id,fromColId:col.id,el:div,startX:e.clientX,startY:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,moved:false,ghost:null,dropColId:null,dropBeforeId:null};
    div.classList.add('grab-fading');
    window._pdTimer=setTimeout(function(){
      var pd=window._pendingPd;if(!pd)return;
      _pd=pd;window._pendingPd=null;
      div.classList.remove('grab-fading');
      var g=div.cloneNode(true);g.id='dg';
      g.classList.remove('anim-card-new','anim-card-settle','anim-card-fill','grab-fading');
      var br=div.getBoundingClientRect();
      g.style.cssText='position:fixed;pointer-events:none;z-index:9999;opacity:.88;width:'+br.width+'px;left:'+br.left+'px;top:'+br.top+'px;transform:rotate(2deg) scale(1.04);box-shadow:0 16px 48px rgba(0,0,0,.5);border-radius:10px;transition:none;';
      document.body.appendChild(g);_pd.ghost=g;
      div.style.opacity='0.15';
      document.body.style.userSelect='none';
    },800);
  });
  div.addEventListener('click',function(){if(!_pd||!_pd.moved)showCardModal(card.id,col.id);});
  return div;
}

    '<div style="display:flex;gap:8px">'+
    '<button id="dw-add" style="flex:1;border:none;border-radius:7px;padding:6px 0;background:#f59e0b;color:#000;font-weight:700;cursor:pointer;font-size:12px">➕ Add &amp; Close</button>'+

function cleanPastedChecklistItem(s){
  return String(s||'')
    .replace(/^\s*(?:[-*•–—]\s+|\d+[\.)]\s+|[A-Za-z][\.)]\s+|\[[ xX]\]\s*)/,'')
    .replace(/\s+/g,' ')
    .trim();
}
function parseChecklistPaste(text,mode){
  var normalized=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(mode==='single'){
    var single=cleanPastedChecklistItem(normalized);
    return single?[single]:[];
  }
  if(mode==='paragraphs'){
    return normalized.split(/\n\s*\n+/).map(cleanPastedChecklistItem).filter(Boolean);
  }
  return normalized.split('\n').map(cleanPastedChecklistItem).filter(Boolean);
}

function handleCMItemPaste(e,colId){
  var clip=e.clipboardData||window.clipboardData;
  var text=clip?clip.getData('text/plain'):'';
  if(!text||!/[\r\n]/.test(text))return;
  e.preventDefault();
  var input=e.target;
  var before=input&&typeof input.selectionStart==='number'?input.value.slice(0,input.selectionStart):'';
  var after=input&&typeof input.selectionEnd==='number'?input.value.slice(input.selectionEnd):'';
  showCMItemPastePreview(colId,before+text+after);
}

function openReport(type, cardId){
  var boardName=(S.prefs&&S.prefs.boardName)||'My Board';

  var cols=(S.cols||[]).filter(function(c){return !c.archived;});

var _modalW=510,_modalH=null;
function loadModalSize(){if(S.prefs){if(S.prefs.modalW>=320)_modalW=S.prefs.modalW;if(S.prefs.modalH>=200)_modalH=S.prefs.modalH;}}
function saveModalSize(){if(S.prefs){S.prefs.modalW=_modalW;S.prefs.modalH=_modalH;}save();}
function initModalResize(handle,modal){
  handle.addEventListener('mousedown',function(e){
    e.preventDefault();e.stopPropagation();
    var sx=e.clientX,sy=e.clientY;
    var sw=modal.getBoundingClientRect().width,sh=modal.getBoundingClientRect().height;
    function onMove(ev){
      var nw=Math.max(320,Math.min(window.innerWidth*.95,sw+ev.clientX-sx));
      var nh=Math.max(220,Math.min(window.innerHeight*.95,sh+ev.clientY-sy));
      modal.style.width=nw+'px';modal.style.height=nh+'px';modal.style.maxHeight='none';
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
      _modalW=Math.round(modal.getBoundingClientRect().width);
      _modalH=Math.round(modal.getBoundingClientRect().height);
      saveModalSize();
    }
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
  });
}
function setModal(html,w,cb,resizable){
  closeThemePanel();closeAllPops();
  var root=document.getElementById('modal-root');root.innerHTML='';
  var ov=document.createElement('div');ov.className='overlay';ov.onclick=closeModal;
  var m=document.createElement('div');m.className='modal';
  if(resizable){
    m.style.width=Math.min(_modalW, window.innerWidth * 0.95)+'px';
    if(_modalH){m.style.height=Math.min(_modalH, window.innerHeight * 0.95)+'px';m.style.maxHeight='none';}
  }else if(w){m.style.width=w;}
  m.onclick=function(e){e.stopPropagation();};m.innerHTML=html;
  if(resizable){var rh=document.createElement('div');rh.className='modal-resize-handle';m.appendChild(rh);initModalResize(rh,m);}
  ov.appendChild(m);root.appendChild(ov);if(cb)setTimeout(cb,10);
}

    e.preventDefault();doUndo();
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){
    if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'))return;
    e.preventDefault();doRedo();
  }
});

load();loadTheme();loadModalSize();render();initPointerDrag();
_sessionStartSnap();   // auto-snapshot the board state at session start (runs after load())
_restoreUndoSession(); // restore undo history if this is a crash-recovery / F5 reload
initSync();
</script>
