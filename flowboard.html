<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ FlowBoard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#060d18;--topbar:rgba(6,13,24,.88);--bd:rgba(255,255,255,.07);
  --bd-s:rgba(255,255,255,.06);--bd-i:rgba(255,255,255,.1);
  --txt:#e2e8f0;--txt-b:#f1f5f9;--txt-m:#94a3b8;--txt-d:#475569;--txt-dd:#334155;
  --surf:#1a2538;--surf2:rgba(255,255,255,.055);--surf3:rgba(255,255,255,.08);
  --modal:#0e1623;--card:rgba(255,255,255,.055);--card-h:rgba(255,255,255,.1);
  --inp:rgba(255,255,255,.05);--inp2:rgba(255,255,255,.06);--inp-d:rgba(0,0,0,.35);
  --scroll:rgba(255,255,255,.1);--ghost-bg:rgba(255,255,255,.07);
  --ghost-c:#94a3b8;--ghost-bd:rgba(255,255,255,.1);--dnd:rgba(96,165,250,.09);
}
[data-theme="obsidian"]{--bg:#000;--modal:#0a0a0a;--surf:#111;--surf2:rgba(255,255,255,.04);--topbar:rgba(0,0,0,.9);}
[data-theme="graphite"]{--bg:#18191a;--modal:#101112;--surf:#242526;--surf2:rgba(255,255,255,.06);--topbar:rgba(22,23,24,.9);}
[data-theme="navy"]{--bg:#020817;--modal:#040e28;--surf:#0d1b3e;--topbar:rgba(4,14,40,.9);}
[data-theme="twilight"]{--bg:#0d0618;--modal:#080412;--surf:#180d2e;--topbar:rgba(13,6,24,.9);}
[data-theme="aurora"]{--bg:#011a1a;--modal:#010e0e;--surf:#072525;--topbar:rgba(1,14,14,.9);}
[data-theme="forest"]{--bg:#011a08;--modal:#010e04;--surf:#07250f;--topbar:rgba(1,14,4,.9);}
[data-theme="ember"]{--bg:#150803;--modal:#0d0501;--surf:#251005;--topbar:rgba(21,8,3,.9);}
[data-theme="pearl"],[data-theme="azure"],[data-theme="blossom"],[data-theme="meadow"],[data-theme="lavender"],[data-theme="sunset"]{
  --bd:rgba(0,0,0,.09);--bd-s:rgba(0,0,0,.07);--bd-i:rgba(0,0,0,.15);
  --txt:#1d1d1f;--txt-b:#000;--txt-m:#6e6e73;--txt-d:#86868b;--txt-dd:#aeaeb2;
  --surf2:rgba(0,0,0,.04);--surf3:rgba(0,0,0,.07);
  --card:rgba(255,255,255,.82);--card-h:#fff;
  --inp:rgba(0,0,0,.05);--inp2:rgba(0,0,0,.06);--inp-d:rgba(0,0,0,.07);
  --scroll:rgba(0,0,0,.12);--ghost-bg:rgba(0,0,0,.06);--ghost-c:#6e6e73;
  --ghost-bd:rgba(0,0,0,.14);--dnd:rgba(0,100,200,.08);
}
[data-theme="pearl"]   {--bg:#f5f5f7;--modal:#fff;--surf:#fff;--topbar:rgba(255,255,255,.88);}
[data-theme="azure"]   {--bg:#eff6ff;--modal:#fff;--surf:#fff;--topbar:#bfdbfe;}
[data-theme="blossom"] {--bg:#fff0f5;--modal:#fff;--surf:#fff;--topbar:#fbcfe8;}
[data-theme="meadow"]  {--bg:#f0fdf4;--modal:#fff;--surf:#fff;--topbar:#bbf7d0;}
[data-theme="lavender"]{--bg:#f5f3ff;--modal:#fff;--surf:#fff;--topbar:#ddd6fe;}
[data-theme="sunset"]  {--bg:#fff7ed;--modal:#fff;--surf:#fff;--topbar:#fed7aa;}

@keyframes cardNew    {from{opacity:0;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardSettle {0%{transform:scale(1.04);box-shadow:0 8px 28px rgba(0,0,0,.35)}60%{transform:scale(.985)}100%{transform:scale(1);box-shadow:none}}
@keyframes colNew     {from{opacity:0;transform:translateX(22px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes pillIn     {from{opacity:0;transform:scaleY(.7);transform-origin:top}to{opacity:1;transform:scaleY(1)}}
@keyframes bannerIn   {from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardFill   {0%{opacity:0;transform:translateY(-10px) scale(1)}55%{opacity:1;transform:translateY(0) scaleY(.91)}80%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}
@keyframes groupIn    {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes btnPop     {0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes deadlinePulse{0%,100%{box-shadow:0 0 12px rgba(225,29,72,.4),0 0 4px rgba(225,29,72,.2)}50%{box-shadow:0 0 20px rgba(225,29,72,.6),0 0 8px rgba(225,29,72,.35)}}
@keyframes filterOut  {from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.94)}}
@keyframes filterIn   {from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.card.grab-fading{opacity:.35;transition:opacity .8s ease;cursor:grabbing}

.anim-card-new    {animation:cardNew    .22s cubic-bezier(.34,1.4,.64,1) both}
.anim-card-settle {animation:cardSettle .28s cubic-bezier(.34,1.3,.64,1) both}
.anim-col-new     {animation:colNew     .24s cubic-bezier(.34,1.3,.64,1) both}
.anim-group-new   {animation:groupIn    .22s cubic-bezier(.34,1.2,.64,1) both}
.anim-filter-out  {animation:filterOut  .15s ease both}
.anim-filter-in   {animation:filterIn   .22s cubic-bezier(.34,1.3,.64,1) both}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;transition:background .3s,color .2s;overscroll-behavior:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px}

#topbar{background:var(--topbar);border-bottom:1px solid var(--bd);padding:11px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .3s;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
.logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa,#fb7185);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
#search{background:var(--inp2);border:1px solid var(--bd-i);border-radius:10px;color:var(--txt);padding:7px 13px;font-size:13px;width:190px;outline:none;transition:border-color .18s,box-shadow .18s}
#search::placeholder{color:var(--txt-d)}
#search:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}
.topbar-stats{font-size:11px;color:var(--txt-dd);white-space:nowrap}
.btn{border:none;border-radius:9px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:700;transition:opacity .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.95);animation:btnPop .15s ease}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.btn-primary:hover{box-shadow:0 4px 18px rgba(99,102,241,.4)}
.btn-ghost{background:var(--ghost-bg);color:var(--ghost-c);border:1px solid var(--ghost-bd)}
.btn-danger{background:rgba(251,113,133,.12);color:#f43f5e;border:1px solid rgba(251,113,133,.25)}
.btn-green{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.btn-amber{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
#topbar .btn{display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0 15px;height:34px}
.tb-sep{width:1px;height:20px;background:var(--bd);flex-shrink:0;margin:0 2px}
.btn-group{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid var(--ghost-bd)}
.btn-group .btn{border-radius:0;border:none;border-right:1px solid var(--ghost-bd)}
.btn-group .btn:last-child{border-right:none}

#board{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 22px 40px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.group{margin-bottom:28px}
.group-hdr{display:flex;align-items:center;gap:9px;padding:4px 2px 8px;border-bottom:2px solid var(--bd-s);margin-bottom:12px}
.group-accent{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:box-shadow .2s,transform .15s}
.group-accent:hover{transform:scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.group-name{font-weight:800;font-size:14px;flex:1;cursor:text}
.group-chip{background:var(--surf2);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--txt-d);font-weight:700}
.collapse-btn{background:none;border:none;color:var(--txt-d);cursor:pointer;font-size:11px;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s}
.collapse-btn:hover{color:var(--txt-m)}
.icon-btn{background:none;border:none;color:var(--bd-i);cursor:pointer;font-size:17px;padding:0 3px;line-height:1;transition:color .15s,transform .12s}
.icon-btn:hover{color:var(--txt-m);transform:scale(1.15)}
.icon-btn:active{transform:scale(.9)}
.group-cols{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px;overscroll-behavior-x:none;touch-action:none}

.col{min-width:268px;max-width:268px;flex-shrink:0;display:flex;flex-direction:column;border-radius:14px}
.col-hdr{border-radius:14px 14px 0 0;padding:10px 12px;display:flex;align-items:center;gap:7px;border:1px solid transparent;border-bottom:none;flex-shrink:0}
.col-name{flex:1;font-weight:700;font-size:12px;color:var(--txt-b);cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-count{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.18);cursor:pointer;user-select:none;transition:background .18s,color .18s,transform .12s}
.col-count:hover{transform:scale(1.08)}
.col-count:active{transform:scale(.95)}
.col-body{border-radius:0;padding:8px 8px 4px;min-height:0;flex:1;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;border-top:none;border-bottom:none;transition:border-color .2s,box-shadow .2s;overflow-y:auto}
.col-body::-webkit-scrollbar{width:4px}.col-body::-webkit-scrollbar-track{background:transparent}.col-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.col-body.drag-over{border-color:#60a5fa !important;box-shadow:inset 0 0 20px var(--dnd)}
.col-body.drag-over+.col-foot{border-color:#60a5fa !important}
.col-foot{border-radius:0 0 14px 14px;padding:4px 8px 8px;border:1px solid transparent;border-top:none;flex-shrink:0}

.anim-card-fill{animation:cardFill .34s cubic-bezier(.34,1.2,.64,1) both}
.col-body.limited{transition:height .32s cubic-bezier(.4,0,.2,1);overflow:hidden}
.limit-btn{background:none;border:1px solid var(--bd-i);border-radius:8px;color:var(--txt-d);padding:0 10px;font-size:11px;line-height:1;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .18s,color .18s,background .18s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;height:28px}
.limit-btn:hover{border-color:#60a5fa;color:#60a5fa}
.limit-btn.active{background:rgba(96,165,250,.12);border-color:#60a5fa;color:#60a5fa}

.wip-pop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:11px;padding:11px 12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);width:178px;}
.wip-pop input{width:100%;background:var(--inp);border:1px solid var(--bd-i);border-radius:7px;color:var(--txt);padding:5px 9px;font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;transition:border-color .15s}
.wip-pop input:focus{border-color:#f59e0b}
.wip-pop-label{font-size:10px;font-weight:700;color:var(--txt-d);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.wip-pop-btns{display:flex;gap:6px}
.wip-pop-btns button{flex:1;border:none;border-radius:7px;padding:5px 0;font-size:11px;font-weight:700;cursor:pointer;transition:opacity .12s,transform .12s}
.wip-pop-btns button:hover{opacity:.85}
.wip-pop-btns button:active{transform:scale(.94)}

.col-pill{width:38px;flex-shrink:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 10px;cursor:pointer;min-height:130px;transition:filter .15s,transform .18s;position:relative;border:1px solid transparent;animation:pillIn .22s cubic-bezier(.34,1.3,.64,1) both}
.col-pill:hover{filter:brightness(1.18);transform:scale(1.04)}
.col-pill:active{transform:scale(.97)}
.col-pill-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;max-height:120px;text-overflow:ellipsis;padding:0 2px}
.col-pill-count{border-radius:20px;padding:2px 6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.25);margin-top:6px}
.col-pill-expand{font-size:9px;opacity:.6;margin-top:4px;transition:transform .18s}
.col-pill:hover .col-pill-expand{transform:scale(1.3)}

.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid;border-radius:10px;padding:9px 11px;cursor:grab;transition:background .18s,transform .18s cubic-bezier(.34,1.3,.64,1),box-shadow .18s;user-select:none;touch-action:none}
.card:hover{background:var(--card-h);transform:translateY(-2px) scale(1.01);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card:active{transform:scale(.98)}
#drop-ind{height:3px;background:#60a5fa;border-radius:99px;margin:0 4px;box-shadow:0 0 8px rgba(96,165,250,.55);pointer-events:none;flex-shrink:0}
.card-title{font-weight:600;font-size:12px;color:var(--txt-b);margin-bottom:5px;line-height:1.4}
.prog-row{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-d);margin-bottom:3px}
.prog-track{height:3px;background:var(--surf2);border-radius:99px;margin-bottom:6px;overflow:hidden}
.prog-fill{height:3px;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.pri-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700}
.tag{background:var(--surf3);color:var(--txt-m);border-radius:20px;padding:2px 6px;font-size:10px}
.due-badge{border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.due-ok{background:rgba(96,165,250,.15);color:#60a5fa}
.due-soon{background:rgba(245,158,11,.15);color:#f59e0b}
.due-over{background:rgba(225,29,72,.18);color:#e11d48}
.due-done{background:rgba(16,185,129,.15);color:#10b981}

/* ── CARD COLOR CIRCLE PICKER ── */
.cm-color-wrap{position:relative;flex-shrink:0;display:flex;align-items:center}
.cm-color-circle{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid var(--bd-i);transition:transform .15s,border-color .15s;flex-shrink:0}
.cm-color-circle:hover{transform:scale(1.18);border-color:var(--txt-m)}
.cm-color-drop{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s,padding .25s}
.cm-color-drop.open{max-height:360px;opacity:1;pointer-events:auto;padding:6px}
.cm-cdrop-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0}
.cm-cdrop-dot:hover{transform:scale(1.2)}
.cm-cdrop-dot.on{border-color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);transform:scale(1.12)}
.cm-cdrop-dot.none-dot{background:var(--surf3);position:relative;overflow:hidden}
.cm-cdrop-dot.none-dot::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 43%,#e11d48 43%,#e11d48 57%,transparent 57%)}

/* ── COLUMN DROPDOWN ── */
.cm-col-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-col-trigger{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none;max-width:160px;overflow:hidden}
.cm-col-trigger:hover{border-color:#60a5fa;color:var(--txt)}
.cm-col-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;min-width:170px}
.cm-col-drop.open{max-height:220px;opacity:1;pointer-events:auto;padding:5px;overflow-y:auto;overflow-x:hidden}
.cm-col-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:12px;font-weight:600;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.cm-col-item:hover{background:var(--surf3)}
.cm-col-item.active{color:#60a5fa}

/* ── TAGS DROPDOWN ── */
.cm-tags-wrap{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-tags-trigger{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none}
.cm-tags-trigger:hover{border-color:#60a5fa;color:var(--txt)}
.cm-tags-drop{position:absolute;top:calc(100% + 6px);left:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:12px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.45);max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;min-width:220px;padding:0}
.cm-tags-drop.open{max-height:80px;opacity:1;pointer-events:auto;padding:10px 10px 8px}

/* ── DATE / CALENDAR ── */
.cm-cal{position:relative;display:inline-flex;align-items:center;flex-shrink:0}
.cm-date-btn{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--bd-i);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:border-color .18s,color .18s;white-space:nowrap;user-select:none;font-family:inherit;position:relative}
.cm-date-btn:hover{border-color:#60a5fa;color:var(--txt)}
.cm-cal-drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd-i);border-radius:14px;z-index:200;box-shadow:0 12px 40px rgba(0,0,0,.5);width:280px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .2s;padding:0}
.cm-meta-label{font-size:10px;color:var(--txt-d);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.btn.toggled-on{border-color:rgba(96,165,250,.55);color:#60a5fa;background:rgba(96,165,250,.1)}
.cm-cal-drop.open{max-height:360px;opacity:1;pointer-events:auto;padding:14px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-hdr-title{font-size:14px;font-weight:800;color:var(--txt-b)}
.cal-nav{background:none;border:1px solid var(--bd-i);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt-m);font-size:14px;transition:background .15s,border-color .15s,color .15s}
.cal-nav:hover{background:var(--surf3);border-color:#60a5fa;color:#60a5fa}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:10px;font-weight:700;color:var(--txt-dd);text-transform:uppercase;padding:4px 0 8px}
.cal-day{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--txt-m);cursor:pointer;transition:background .15s,color .12s,transform .12s;border:2px solid transparent;margin:0 auto}

// ── IndexedDB helpers for persisting the USB directory handle across sessions ──
function _usbIDB(cb){
  if(typeof indexedDB==='undefined'||!indexedDB){cb(new Error('IndexedDB unavailable'));return;}
  var req;
  try{req=indexedDB.open(_USB_IDB_NAME,1);}catch(e){cb(e);return;}
  req.onupgradeneeded=function(e){e.target.result.createObjectStore(_USB_IDB_STORE);};
  req.onsuccess=function(e){cb(null,e.target.result);};
  req.onerror=function(e){cb(e);};
}
function _usbSaveHandle(handle){
  _usbIDB(function(err,db){
    if(err)return;
    var tx=db.transaction(_USB_IDB_STORE,'readwrite');
    tx.objectStore(_USB_IDB_STORE).put(handle,_USB_IDB_KEY);
  });
}
function _usbClearHandle(){
  _usbIDB(function(err,db){
    if(err)return;
    var tx=db.transaction(_USB_IDB_STORE,'readwrite');
    tx.objectStore(_USB_IDB_STORE).delete(_USB_IDB_KEY);
  });
}
function _usbLoadStoredHandle(cb){
  _usbIDB(function(err,db){
    if(err){cb(null);return;}
    var req=db.transaction(_USB_IDB_STORE,'readonly').objectStore(_USB_IDB_STORE).get(_USB_IDB_KEY);
    req.onsuccess=function(e){cb(e.target.result||null);};
    req.onerror=function(){cb(null);};
  });
}

var _autoSnapsRef=null;        // Firebase ref for boards/{key}/autoSnaps

// ── UNDO / REDO STATE ──
var _undoStack=[];        // array of JSON strings (full S snapshots), max 50 entries
var _redoStack=[];        // array of JSON strings, max 50 entries

function _syncCardCount(state){return(state.cols||[]).reduce(function(n,c){return n+(c.cards?c.cards.length:0);},0);}
function _syncColIds(state){return(state.cols||[]).map(function(c){return c.id;});}

function _isSafeWrite(state){
  if(!_remoteBaseline)return true; // no baseline yet (new board) — allow
  var cards=_syncCardCount(state);
  var colIds=_syncColIds(state);
  var baseCards=_remoteBaseline.cards;
  var baseColIds=_remoteBaseline.colIds;
  var baseGroups=_remoteBaseline.groups;
  // block: complete group wipe when board had groups
  if(baseGroups>0&&(state.groups||[]).length===0)return false;
  // block: complete column wipe when board had columns
  if(baseColIds.length>0&&colIds.length===0)return false;
  // block: card count drops to 0 from a board with meaningful data
  if(baseCards>3&&cards===0)return false;
  // block: >75% card loss in one write AND more than 5 cards would vanish
  var dropped=baseCards-cards;
  if(baseCards>0&&dropped/baseCards>0.75&&dropped>5)return false;
  // block: column IDs are completely foreign (< 20% match) — almost certainly wrong board's data
  if(baseColIds.length>2&&colIds.length>0){
    var matches=colIds.filter(function(id){return baseColIds.indexOf(id)!==-1;}).length;
    if(matches/baseColIds.length<0.2)return false;
  }
  return true;
}

function _setRemoteBaseline(state){
  _remoteBaseline={cards:_syncCardCount(state),colIds:_syncColIds(state),groups:(state.groups||[]).length};
}

// ── AUTO-RECONNECT ──
function _scheduleRetry(){
  if(!FIREBASE_ENABLED||!_activeKey||_userDisconnected)return;
  if(_retryTimer)return; // already pending — don't stack
  var delay=_RETRY_DELAYS[Math.min(_retryStep,_RETRY_DELAYS.length-1)];
  _retryStep=Math.min(_retryStep+1,_RETRY_DELAYS.length-1);
  console.log('[Sync] Auto-reconnect in',delay,'ms (step '+_retryStep+')');
  _retryTimer=setTimeout(function(){
    _retryTimer=null;
    if(!_activeKey||_userDisconnected||_syncStatus==='synced')return;
    _reconnecting=true;
    connectToKey(_activeKey);
  },delay);
}

// ── UI SCALE (per-device: auto-seeded from screen size, manual override) ──
// Stored in localStorage (NOT S.prefs) deliberately: the right scale differs
// per machine (home vs work monitor), so it must never sync across devices.
var _uiScale=null;
function _autoUiScale(){
  var w=window.screen.width;
  if(w>=2400)return 1.1;
  if(w>=1700)return 1;
  if(w>=1300)return 0.9;
  return 0.85;
}
function _applyUiScale(){document.body.style.zoom=_uiScale;}
function initUiScale(){
  var stored=parseFloat(localStorage.getItem('fb4_uiscale'));
  _uiScale=(stored&&stored>=0.6&&stored<=1.5)?stored:_autoUiScale();
  _applyUiScale();
}
function setUiScale(v){
  _uiScale=Math.round(Math.max(0.6,Math.min(1.5,v))*100)/100;
  localStorage.setItem('fb4_uiscale',_uiScale);
  _applyUiScale();renderUiScaleRow();
}
function resetUiScale(){
  localStorage.removeItem('fb4_uiscale');
  _uiScale=_autoUiScale();
  _applyUiScale();renderUiScaleRow();
}
function renderUiScaleRow(){
  var row=document.getElementById('uiscale-row');if(!row)return;
  var isAuto=!localStorage.getItem('fb4_uiscale');
  row.innerHTML=
    '<div style="display:flex;align-items:center;gap:7px">'+
      '<button class="btn btn-ghost" style="padding:3px 10px;font-size:13px" onclick="setUiScale(_uiScale-0.05)">−</button>'+
      '<span style="min-width:44px;text-align:center;font-size:12px;font-weight:700;color:var(--txt)">'+Math.round(_uiScale*100)+'%</span>'+
      '<button class="btn btn-ghost" style="padding:3px 10px;font-size:13px" onclick="setUiScale(_uiScale+0.05)">+</button>'+
      '<button class="btn btn-ghost" style="padding:3px 10px;font-size:11px;margin-left:auto'+(isAuto?';color:#10b981;border-color:rgba(16,185,129,.4)':'')+'" title="Match this screen automatically" onclick="resetUiScale()">'+(isAuto?'✓ Auto':'Auto')+'</button>'+
    '</div>';
}

function dueClass(due){
  if(!due)return null;
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(due+'T00:00:00');
  var diff=Math.round((d-today)/(1000*60*60*24));
  if(diff<0)return'over';if(diff<=2)return'soon';return'ok';
}
function dueLabel(due){
  if(!due)return'';
  var today=new Date();today.setHours(0,0,0,0);
  var d=new Date(due+'T00:00:00');
  var diff=Math.round((d-today)/(1000*60*60*24));
  if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';
  if(diff<0)return Math.abs(diff)+'d overdue';
  return _fmtDate(d);
}
function _fmtDate(d){
  var fmt=(S.prefs&&S.prefs.dateFormat)||'short';
  var showYear=d.getFullYear()!==new Date().getFullYear();
  if(fmt==='numeric'){
    var mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
    return mm+'/'+dd+(showYear?'/'+d.getFullYear():'');
  }
  if(fmt==='long')return d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:showYear?'numeric':undefined});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:showYear?'numeric':undefined});
}
function _ensureItemMeta(k){
  if(!Array.isArray(k.itemMeta))k.itemMeta=[];
  while(k.itemMeta.length<k.items.length)k.itemMeta.push({due:'',createdAt:k.createdAt||Date.now(),pri:null,completedAt:null});
  if(k.itemMeta.length>k.items.length)k.itemMeta.length=k.items.length;
  k.itemMeta.forEach(function(m){
    if(m.pri===undefined)m.pri=null;
    if(m.completedAt===undefined)m.completedAt=null;
  });
}
// Keeps card.due in sync with the earliest due date among incomplete subtasks,
// for as long as at least one checklist item has a due date set (card.dueAuto
// is recomputed fresh on every call, so it can't get "stuck"). When every
// item with a due date is checked off, card.due is cleared but dueAuto stays
// true so the UI can show "Due dates complete" and resume instantly if an
// item is unchecked. Returns true if card.due changed.
function _syncCardDueFromItems(card){
  _ensureItemMeta(card);
  var earliest=null,anyDue=false;
  card.items.forEach(function(it,i){
    var due=card.itemMeta[i]&&card.itemMeta[i].due;
    if(due){
      anyDue=true;
      if(!card.done.includes(it)&&(earliest===null||due<earliest))earliest=due;
    }
  });
  var before=card.due;
  card.dueAuto=anyDue;
  if(anyDue)card.due=earliest||'';
  return card.due!==before;
}

function generateKey(){var a=new Uint8Array(10);crypto.getRandomValues(a);return Array.from(a).map(function(b){return b.toString(16).padStart(2,'0');}).join('').match(/.{4}/g).join('-');}

function updateSyncStatus(state){
  _syncStatus=state;
  var el=document.getElementById('sync-status');if(!el)return;
  if(state==='synced'){clearTimeout(_connectTimeout);_connectTimeout=null;}
  var map={
    local:  {t:'💾 Local',   c:'var(--txt-dd)', bg:'var(--surf2)',       bd:'var(--bd)'},

    offline:{t:'📴 Offline', c:'#94a3b8',       bg:'rgba(148,163,184,.1)',bd:'rgba(148,163,184,.3)'},

  el.textContent=s.t;el.style.color=s.c;el.style.background=s.bg;el.style.borderColor=s.bd;

function migrateRemote(remote){
  if(!remote.prefs)remote.prefs={theme:'midnight',modalW:510,modalH:null};
  if(remote.prefs.theme===undefined)remote.prefs.theme='midnight';
  if(remote.prefs.modalW===undefined)remote.prefs.modalW=510;
  if(remote.prefs.modalH===undefined)remote.prefs.modalH=null;
  if(!remote.prefs.boardName)remote.prefs.boardName='My Board';
  if(!remote.lastModified)remote.lastModified=0;
  if(!remote.groups)remote.groups=[];
  if(!remote.cols)remote.cols=[];
  remote.groups.forEach(function(g){if(g.limit===undefined)g.limit=0;});
  remote.cols.forEach(function(c){
    if(c.wip===undefined)c.wip=0;if(c.collapsed===undefined)c.collapsed=false;if(c.sort===undefined)c.sort=false;
    if(!c.cards)c.cards=[];
    c.cards.forEach(function(k){if(k.color===undefined)k.color=null;if(k.desc===undefined)k.desc='';if(k.due===undefined)k.due='';if(!k.done)k.done=[];if(!k.items)k.items=[];if(!k.tags)k.tags=[];if(k.completed===undefined)k.completed=false;if(k.createdAt===undefined)k.createdAt=0;if(k.updatedAt===undefined)k.updatedAt=0;if(k.completedAt===undefined)k.completedAt=null;_ensureItemMeta(k);_syncCardDueFromItems(k);});
  });
  return remote;
}

function connectToKey(key){
  // During USB mode cloud sync is paused — don't attach Firebase listeners.
  // Board switching in USB mode is handled via switchKey's USB-aware path.
  if(_usbMode){updateUSBStatus(_usbConnected?'synced':'connecting');return;}
  // ── reset auto-reconnect state for this new attempt ──
  clearTimeout(_retryTimer);_retryTimer=null;
  _userDisconnected=false;
  _reconnecting=true;
  // flush any debounced board-state write before switching so local changes aren't lost
  if(_syncTimer&&_syncRef&&_activeKey){
    clearTimeout(_syncTimer);_syncTimer=null;
    if(_isSafeWrite(S)){
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);});
    }else{
      console.warn('Flush blocked by safety gate — local S looks like wrong board data.');
    }
  }
  // tear down any in-flight auto-snap write timer before switching boards
  clearTimeout(_autoSnapsWriteTimer);_autoSnapsWriteTimer=null;
  _remoteBaseline=null; // clear baseline when switching — new board has different structure
  if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncRef=null;_syncListener=null;}
  if(_autoSnapsRef&&_autoSnapsListener){_autoSnapsRef.off('value',_autoSnapsListener);_autoSnapsRef=null;_autoSnapsListener=null;}
  // Fix A: reset pending-write counter after detaching the old board's listener.
  // The flush above increments _pendingWrites using the OLD _syncRef (board A's path).
  // That write's echo goes to A's now-detached listener — it can never reach B's listener.
  // Leaving the counter > 0 would cause B's first listener fire to be silently skipped,
  // leaving S stuck with board A's data while _activeKey is already pointing at B.
  _pendingWrites=0;
  if(!FIREBASE_ENABLED||!key){updateSyncStatus('local');return;}
  _activeKey=key;_openKey=key;localStorage.setItem('fb4_active_key',key);
  var _lk=getKeys();var _lke=_lk.find(function(k){return k.key===key;});if(_lke){_lke.lastUsed=Date.now();setKeys(_lk);}
  updateSyncStatus('syncing');
  clearTimeout(_connectTimeout);
  _connectTimeout=setTimeout(function(){
    if(_activeKey){updateSyncStatus('error');_reconnecting=false;_scheduleRetry();}
  },10000);
  // Fix A: capture the key at attach time so stale callbacks from a superseded
  // connectToKey call can be identified and discarded immediately.
  var capturedKey=key;
  // Fix B: gate the local-newer push behind this flag so the FIRST listener fire
  // for a newly connected board ALWAYS applies the remote state — it never pushes
  // the previous board's S back to Firebase.  Only after the initial sync is
  // established (first apply committed) does last-write-wins logic re-engage.
  var _isInitialSync=true;
  _syncRef=_db.ref('boards/'+key+'/state');
  _syncListener=_syncRef.on('value',function(snap){
    if(_activeKey!==capturedKey)return; // Fix A: stale callback — another board switch already happened
    if(_pendingWrites>0)return; // our own write in-flight — ignore echo
    var remote=snap.val();
    if(remote===null){
      // new board — push local up and establish baseline
      _isInitialSync=false;
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);_reconnecting=false;_retryStep=0;updateSyncStatus('synced');}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_reconnecting=false;updateSyncStatus('error');_scheduleRetry();});
      return;
    }
    migrateRemote(remote);
    // ── Board identity guard: only fires during ACTIVE sync (baseline already set) ──
    // On initial connect or board switch _remoteBaseline is null, so S still holds the
    // previous board's data. Pushing local here would overwrite the target board with the
    // wrong board's content — which is exactly the bug we must prevent.
    // During active sync (baseline set) a sudden boardId change on the remote is suspicious
    // (cross-contamination from another tab/device) — in that case push local to correct it.
    if(_remoteBaseline&&remote.boardId&&S.boardId&&remote.boardId!==S.boardId&&_isSafeWrite(S)){
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);_reconnecting=false;_retryStep=0;updateSyncStatus('synced');}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_reconnecting=false;updateSyncStatus('error');_scheduleRetry();});
      return;
    }
    // ── Conflict resolution: last-write-wins via lastModified timestamp ──
    // Set remote as the safety-gate baseline first so _isSafeWrite can compare
    // local S against the known cloud structure before any push.
    _setRemoteBaseline(remote);
    var localTs=S.lastModified||0;
    var remoteTs=remote.lastModified||0;
    // On initial connect / board switch the remote boardId differs from the stale local S.
    // Always trust the remote — it IS the board we just switched to.
    if(remote.boardId&&S.boardId&&remote.boardId!==S.boardId){
      _isInitialSync=false;
      _applyRemote(remote);_reconnecting=false;_retryStep=0;updateSyncStatus('synced');
      return;
    }
    // Fix B: never push on the first listener fire — S still holds the previous board's
    // data at this point.  Copied boards (same boardId) would otherwise pass the identity
    // check above and overwrite the target with the source board's content.
    if(!_isInitialSync&&localTs>remoteTs&&_isSafeWrite(S)){
      // Local is newer AND structurally consistent with cloud — push local up.
      _pendingWrites++;
      _syncRef.set(S).then(function(){
        _pendingWrites=Math.max(0,_pendingWrites-1);
        _setRemoteBaseline(S);
        _reconnecting=false;_retryStep=0;
        updateSyncStatus('synced');
        notify('☁ Local changes were newer — synced to cloud.');
      }).catch(function(err){
        // Push failed — safe fallback: adopt cloud state so nothing is left inconsistent.
        _pendingWrites=Math.max(0,_pendingWrites-1);
        console.warn('[Sync] Push-local failed, reverting to cloud state:',err);
        _isInitialSync=false;
        _applyRemote(remote);
        _reconnecting=false;_retryStep=0;
        updateSyncStatus('synced');
      });
      return;
    }
    // Remote is newer, tied, initial connect, or safety gate blocked — apply cloud state.
    _isInitialSync=false;
    _applyRemote(remote);
    _reconnecting=false;_retryStep=0;
    updateSyncStatus('synced');
  },function(err){console.warn('[Sync] Firebase listener error:',err);_reconnecting=false;updateSyncStatus('error');_scheduleRetry();});

  // ── Auto-snapshots cloud sync ──
  // Separate Firebase path — independent of the main board-state listener.
  // Bidirectional merge: remote-only snaps come down, local-only snaps (created offline) go up.
  // CRITICAL (IDB migration): the merge reads the local auto mirror and, if it
  // ran before the mirror was hydrated for THIS board, would see an empty local
  // set and overwrite un-pushed local-only snaps. So attach the listener only
  // AFTER _hydrateAutoMirror() resolves, and guard against a board switch that
  // superseded us in the meantime (capturedKey pattern, same as the main listener).
  var _autoCapKey=key;
  _hydrateAutoMirror().then(function(){
    if(_activeKey!==_autoCapKey)return; // a newer connectToKey already took over
    _autoSnapsRef=_db.ref('boards/'+key+'/autoSnaps');
    _autoSnapsListener=_autoSnapsRef.on('value',function(snap){
      if(_autoSnapsPending>0)return; // our own write in-flight — ignore echo
      var remote=snap.val();
      // Firebase may return a sparse-key object instead of an array for edge cases — normalise.
      if(remote&&!Array.isArray(remote))remote=Object.values(remote).filter(Boolean);
      var local=getAutoBaks();
      if(!remote||remote.length===0){
        // No cloud snaps yet — push local ones up (e.g. first time connecting from this device)
        if(local.length>0)_pushAutoSnapsToCloud(local);
        return;
      }
      // Compute what's in remote but not local, and vice-versa
      var localIds=local.map(function(x){return x.id;});
      var remoteIds=remote.map(function(x){return x.id;});
      var remoteOnly=remote.filter(function(x){return localIds.indexOf(x.id)===-1;});
      var localOnly=local.filter(function(x){return remoteIds.indexOf(x.id)===-1;});
      if(remoteOnly.length===0&&localOnly.length===0)return; // fully in sync — nothing to do
      // Merge: take everything from both sides, sort newest-first, cap at 15
      var merged=remote.concat(localOnly);
      merged.sort(function(a,b){return b.ts-a.ts;});
      if(merged.length>15)merged.splice(15);
      setAutoBaks(merged);
      if(localOnly.length>0){
        // Push merged set back so local-only snaps (created offline) reach the cloud
        _pushAutoSnapsToCloud(merged);
      }
    },function(err){
      console.warn('[AutoSnap] Cloud read failed — using local cache:',err);
    });
  });
}

function forcePushToCloud(){
  if(!_activeKey||!_syncRef){notify('⚠️ Not connected to a cloud board.');return;}
  if(!confirm('Push your local board to the cloud?\n\nThis will overwrite the cloud version with your current local board.'))return;
  _autoSnapBefore('Before: Manual force-push to cloud – '+new Date().toLocaleTimeString());
  updateSyncStatus('syncing');
  _pendingWrites++;
  S.lastModified=Date.now();
  save();
  _syncRef.set(S).then(function(){
    _pendingWrites=Math.max(0,_pendingWrites-1);
    _setRemoteBaseline(S);
    updateSyncStatus('synced');
    notify('☁ Board pushed to cloud.');
    if(document.querySelector('#modal-root .overlay'))showBackupModal();
  }).catch(function(err){
    _pendingWrites=Math.max(0,_pendingWrites-1);
    updateSyncStatus('error');
    notify('❌ Push failed: '+err.message);
  });
}

function forcePullFromCloud(){
  if(!_activeKey||!_syncRef){notify('⚠️ Not connected to a cloud board.');return;}
  if(!confirm('Pull the cloud board to your local device?\n\nThis will replace your current local board with the cloud version.'))return;
  _autoSnapBefore('Before: Manual force-pull from cloud – '+new Date().toLocaleTimeString());
  updateSyncStatus('syncing');
  _syncRef.once('value').then(function(snap){
    var remote=snap.val();
    if(!remote){notify('⚠️ No cloud data found for this board.');updateSyncStatus('synced');return;}
    migrateRemote(remote);
    _applyRemote(remote);
    updateSyncStatus('synced');
    notify('☁ Cloud board loaded locally.');
    if(document.querySelector('#modal-root .overlay'))showBackupModal();
  }).catch(function(err){
    updateSyncStatus('error');
    notify('❌ Pull failed: '+err.message);
  });
}

function disconnectSync(){
  if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncRef=null;_syncListener=null;}
  if(_autoSnapsRef&&_autoSnapsListener){_autoSnapsRef.off('value',_autoSnapsListener);_autoSnapsRef=null;_autoSnapsListener=null;}
  clearTimeout(_syncTimer);clearTimeout(_connectTimeout);_connectTimeout=null;
  clearTimeout(_retryTimer);_retryTimer=null;
  clearTimeout(_autoSnapsWriteTimer);_autoSnapsWriteTimer=null;
  _pendingWrites=0;_autoSnapsPending=0;_skipFbWrite=false;_remoteBaseline=null;
  _userDisconnected=true;_reconnecting=false;_retryStep=0;
  if(_activeKey)_lastActiveKey=_activeKey;
  _activeKey=null;localStorage.removeItem('fb4_active_key');updateSyncStatus('local');
}

// Apply a validated remote snapshot to local state and re-render.
// Always call _setRemoteBaseline before this so the safety gate has the right context.
function _applyRemote(remote){
  _setRemoteBaseline(remote);
  S=remote;
  // Board identity may have changed (switch/join) — re-hydrate the manual
  // backup mirror for the new board so the Backup modal shows its snapshots,
  // not the previous board's. (getBaks also self-heals on stale reads, but
  // doing it here avoids a one-render empty flash.)
  if(_backupsUseIdb)_hydrateManualMirror();
  // Remote state replaces local — the existing undo stack belongs to the old S and
  // would produce incorrect results if applied to the new remote state. Clear it.
  _undoStack=[];_redoStack=[];
  try{sessionStorage.removeItem('fb4_undo');}catch(e){}
  _updateUndoUI();
  curTheme=S.prefs.theme;
  document.documentElement.setAttribute('data-theme',S.prefs.theme);
  if(S.prefs.modalW>=320)_modalW=S.prefs.modalW;
  _modalH=(S.prefs.modalH>=200?S.prefs.modalH:null);
  if(S.prefs.boardName&&_activeKey&&(!remote.boardId||remote.boardId===S.boardId)){
    var lk=getKeys();var lke=lk.find(function(k){return k.key===_activeKey;});
    if(lke&&lke.label!==S.prefs.boardName){lke.label=S.prefs.boardName;setKeys(lk);window._keysModalRender&&window._keysModalRender();}
  }
  _skipFbWrite=true;save();render();_skipFbWrite=false;
}

function initSync(){
  if(!FIREBASE_ENABLED)return;
  // Only wrap the SDK init — a throw here means Firebase is unavailable and we should bail.
  // Everything after (listeners, connectToKey, event hooks) runs outside the catch so that
  // a future error there never silently kills the startup sequence.
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    _db=firebase.database();
    // NOTE: setPersistenceEnabled is a Firestore-only API. Firebase RTDB web SDK does NOT
    // support disk persistence (mobile SDKs only). In-memory caching + auto-reconnect are
    // handled automatically by the RTDB SDK — no explicit call needed.
  }catch(e){console.warn('[Sync] Firebase init failed:',e);return;}

  _db.ref('.info/connected').on('value',function(snap){
    if(!_activeKey)return;
    if(!snap.val()){
      // Gone offline — clear stuck pending writes so remote updates aren't blocked on reconnect
      clearTimeout(_syncTimer);_pendingWrites=0;
      updateSyncStatus('offline');
      // restart watchdog — if we don't come back within 10s, show error and schedule retry
      clearTimeout(_connectTimeout);
      _connectTimeout=setTimeout(function(){
        if(_activeKey){updateSyncStatus('error');_reconnecting=false;_scheduleRetry();}
      },10000);
    }else{
      // Back online — verify the Firebase listener is still wired up
      if(!_syncRef||!_syncListener){
        // Listener was lost (e.g. long suspension, SDK re-init) — re-establish cleanly
        _reconnecting=false;
        _retryStep=0;
        connectToKey(_activeKey);
      }else if(_pendingWrites===0){
        updateSyncStatus('synced');
      }
    }
  });
  var savedKey=localStorage.getItem('fb4_active_key');
  if(savedKey){
    _openKey=savedKey;
    var _savedEntry=getKeys().find(function(k){return k.key===savedKey;});
    if(_savedEntry&&_savedEntry.syncOff){_lastActiveKey=savedKey;_userDisconnected=true;localStorage.removeItem('fb4_active_key');}
    else{connectToKey(savedKey);}
  }

  // Background-refresh labels for every inactive board so the keys modal
  // always shows current names without requiring a board switch.
  // Fetches only the prefs/boardName field — minimal bandwidth.
  getKeys().forEach(function(ke){
    if(ke.key===savedKey)return;
    _db.ref('boards/'+ke.key+'/state/prefs/boardName').once('value').then(function(snap){
      var remoteName=snap.val();
      if(!remoteName)return;
      var lk=getKeys();
      var lke=lk.find(function(k){return k.key===ke.key;});
      if(lke&&lke.label!==remoteName){lke.label=remoteName;setKeys(lk);window._keysModalRender&&window._keysModalRender();}
    }).catch(function(){});
  });

  // ── Background reconnect triggers ──
  // Fires when device regains network (e.g. wifi reconnected, browser reopen after sleep)
  window.addEventListener('online',function(){
    if(!FIREBASE_ENABLED||!_activeKey||_userDisconnected||_reconnecting)return;
    clearTimeout(_retryTimer);_retryTimer=null;_retryStep=0;
    connectToKey(_activeKey);
  });
  // Fires when the user returns to a backgrounded/hidden tab
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(!FIREBASE_ENABLED||!_activeKey||_userDisconnected||_reconnecting)return;
    if(_syncStatus==='error'||_syncStatus==='offline'){
      clearTimeout(_retryTimer);_retryTimer=null;_retryStep=0;
      connectToKey(_activeKey);
    }
  });
}

function _isQuotaErr(e){return e&&(e.name==='QuotaExceededError'||e.code===22||e.code===1014||e.name==='NS_ERROR_DOM_QUOTA_REACHED');}
// TRUE origin-wide localStorage usage (every key). The old gauge summed only
// the current board's 3 keys, so it stayed green while OTHER boards' backups
// silently filled the shared ~5MB quota — which is why the hard failure came
// as a surprise instead of a warning.
function _lsBytes(){
  var total=0;
  for(var i=0;i<localStorage.length;i++){
    var kk=localStorage.key(i);
    total+=new Blob([kk]).size+new Blob([localStorage.getItem(kk)||'']).size;
  }
  return total;
}
// ── STORAGE CAPACITY PROBE ──
// localStorage exposes no standard "how much can I have" API, and the real
// ceiling differs by browser/version (commonly ~5-10MB, never guaranteed).
// Rather than hardcode a per-browser guess that drifts out of date, measure
// it empirically on THIS browser/profile: binary-search-write a throwaway
// key until it fails, cache the result. Cheap (well under a second even at
// multi-MB scale) and self-corrects if a browser changes its limit later.
var _PROBE_KEY='__fb4_cap_probe_tmp__';
var _PROBE_CACHE_KEY='fb4_cap_probe';
var _PROBE_MAX=64*1024*1024; // don't bother probing past 64MB — well beyond any real localStorage ceiling
function _probeStorageCapacity(){
  function tryWrite(n){
    try{localStorage.setItem(_PROBE_KEY,'x'.repeat(n));return true;}
    catch(e){return false;}
  }
  var lastOk=0,size=65536,hitCap=false;
  try{
    while(size<_PROBE_MAX){
      if(!tryWrite(size))break;
      lastOk=size;size*=2;
    }
    if(size>=_PROBE_MAX){
      // never failed even at the cap — don't binary-search against an
      // unverified upper bound, just report "at least" the cap.
      hitCap=tryWrite(_PROBE_MAX);
      if(hitCap)lastOk=_PROBE_MAX;
    }else{
      var lo=lastOk,hi=size;
      for(var iter=0;iter<20&&hi-lo>4096;iter++){
        var mid=Math.floor((lo+hi)/2);
        if(tryWrite(mid))lo=mid;else hi=mid;
      }
      lastOk=lo;
    }
  }finally{
    try{localStorage.removeItem(_PROBE_KEY);}catch(e){}
  }
  // ceiling = everything else currently stored + the extra room just found.
  // _lsBytes() here excludes the probe key since it was just removed.
  var result={ceiling:_lsBytes()+lastOk,measuredAt:Date.now(),atLeast:hitCap};
  try{localStorage.setItem(_PROBE_CACHE_KEY,JSON.stringify(result));}catch(e){}
  return result;
}
function _invalidateCapacityProbe(){try{localStorage.removeItem(_PROBE_CACHE_KEY);}catch(e){}}
function _cachedCeiling(){
  try{
    var c=JSON.parse(localStorage.getItem(_PROBE_CACHE_KEY)||'null');
    if(c&&c.ceiling>0)return c;
  }catch(e){}
  return null;
}
// Single source of truth for usage/ceiling/percentage — drives the save()
// warning threshold, the Backups button color, and the storage bar, so they
// can never disagree with each other.
// Origin-wide usage/quota from the Storage API — the real numbers now that
// backups live in IndexedDB (disk-backed). navigator.storage.estimate() is
// async, so it's cached; _storageStats() reads the cache synchronously (the
// gauge doesn't need byte-accuracy on every keystroke). Falls back to the
// localStorage probe before the first estimate resolves or where the Storage
// API is unavailable (e.g. some file:// contexts).
var _estimateCache=null; // {usage, quota}
function _refreshStorageEstimate(){
  if(!navigator.storage||!navigator.storage.estimate)return Promise.resolve(null);
  return navigator.storage.estimate().then(function(est){
    if(est&&est.quota>0){_estimateCache={usage:est.usage||0,quota:est.quota};_updateBackupsBtnState();}
    return _estimateCache;
  }).catch(function(){return null;});
}
function _storageStats(){
  if(_estimateCache&&_estimateCache.quota>0){
    var u=_estimateCache.usage,c=_estimateCache.quota;
    return{used:u,ceiling:c,pct:Math.min(100,Math.round(u/c*100)),isEstimate:false,source:'estimate'};
  }
  // Fallback: localStorage-only figure (pre-estimate, or Storage API absent).
  var used=_lsBytes();
  var cached=_cachedCeiling();
  var ceiling=cached?cached.ceiling:5*1024*1024;
  var pct=ceiling>0?Math.min(100,Math.round(used/ceiling*100)):0;
  return{used:used,ceiling:ceiling,pct:pct,isEstimate:true,source:'ls'};
}

// ── CULL LOG (auto-cull visibility) ──
var _CULL_LOG_KEY='fb4_cull_log',_CULL_ACK_KEY='fb4_cull_ack';
function _getCullLog(){try{return JSON.parse(localStorage.getItem(_CULL_LOG_KEY)||'[]');}catch(e){return[];}}
function _logCullEvent(removed){
  var log=_getCullLog();
  log.unshift({ts:Date.now(),removed:removed});
  if(log.length>10)log.splice(10);
  try{localStorage.setItem(_CULL_LOG_KEY,JSON.stringify(log));}catch(e){}
  _updateBackupsBtnState();
}
function _hasUnackedCull(){
  var log=_getCullLog();if(!log.length)return false;
  var ack=parseInt(localStorage.getItem(_CULL_ACK_KEY)||'0');
  return log[0].ts>ack;
}
function _ackCullLog(){
  try{localStorage.setItem(_CULL_ACK_KEY,String(Date.now()));}catch(e){}
  _updateBackupsBtnState();
}

// ── BACKUPS BUTTON STATE (item 2) ──
function _updateBackupsBtnState(){
  var btn=document.getElementById('backups-btn');if(!btn)return;
  var stats=_storageStats();
  var dot=document.getElementById('backups-btn-dot');
  var unacked=_hasUnackedCull();
  var cls='btn-green',state='ok';
  if(unacked||stats.pct>=90){cls='btn-red-warn';state='red';}
  else if(stats.pct>=70){cls='btn-amber-warn';state='amber';}
  btn.className='btn '+cls;
  if(dot)dot.style.display=unacked?'block':'none';
  var mb=function(b){return Math.round(b/1024/1024*10)/10;};
  btn.title='Storage: '+mb(stats.used)+'MB of '+(stats.isEstimate?'~':'')+mb(stats.ceiling)+'MB used ('+stats.pct+'%)'+(unacked?' — auto-cleanup ran recently, click to review':'');
}

// ── PERSISTENT SAVE-ERROR BANNER (item 1) ──
function _showSaveErrorBanner(html){
  var el=document.getElementById('save-err-banner');if(!el)return;
  el.innerHTML=html;el.classList.add('show');
}
function _hideSaveErrorBanner(){
  var el=document.getElementById('save-err-banner');if(!el)return;
  el.classList.remove('show');el.innerHTML='';
}
function _reportLocalSaveError(e,data){
  console.error('[Save] Local (localStorage) write failed:',e);
  var boardKB=data?Math.round(new Blob([data]).size/1024):'?';
  var totalKB=Math.round(_lsBytes()/1024);
  var isSecurity=e&&e.name==='SecurityError';
  var msg,bannerMsg,actions;
  if(_isQuotaErr(e)){
    // The cached ceiling turned out to be wrong (or auto-cull couldn't free
    // enough) — invalidate it so the next Backup-modal open re-measures.
    _invalidateCapacityProbe();
    msg='❌ Local save FAILED — browser storage full ('+totalKB+'KB across all boards; this board ~'+boardKB+'KB). Export a backup and delete old snapshots NOW — this edit is in memory only, will be LOST on reload, and is deliberately NOT syncing to cloud so it can’t desync your other devices.';
    bannerMsg='❌ <strong>Storage is full — this change is only in memory and will be lost on reload.</strong> Free up space now.';
    actions='<button class="seb-action" onclick="exportBak(null)">⬇ Export Backup Now</button><button class="seb-action" onclick="showBackupModal()">💾 Open Backups</button>';
  }else if(isSecurity){
    msg='❌ Local save FAILED — this browser is blocking local storage (private/incognito mode, or site data disabled). This edit is NOT saved on this device.';
    bannerMsg='❌ <strong>This browser is blocking local storage</strong> (private/incognito mode, or site data disabled) — nothing will save here until that changes.';
    actions='';
  }else{
    msg='❌ Local save FAILED — '+(e&&e.name?e.name:'unknown error')+(e&&e.message?': '+e.message:'')+'. This edit may NOT be saved — see console for details.';
    bannerMsg='❌ <strong>Unexpected save error</strong> ('+(e&&e.name?e.name:'unknown')+') — this edit may not be saved.';
    actions='<button class="seb-action" onclick="exportBak(null)">⬇ Export Backup Now</button>';
  }
  notify(msg);
  _showSaveErrorBanner('<span class="seb-msg">'+bannerMsg+'</span>'+actions+'<button class="seb-dismiss" onclick="_hideSaveErrorBanner()">✕</button>');
  _updateBackupsBtnState();
}
function save(){
  var _prevLM=S.lastModified;
  if(!_skipFbWrite)S.lastModified=Date.now(); // only stamp real local changes, not remote renders
  var data;
  try{data=JSON.stringify(S);}catch(e){console.error('[Save] serialize failed:',e);return;}
  var localOk=false;
  try{
    localStorage.setItem('fb4',data);localOk=true;
  }catch(e){
    // Quota hit: try to reclaim space (drop disposable auto-snapshots) and
    // retry ONCE before giving up. This is the auto-cull safety valve.
    if(_isQuotaErr(e)){
      var freed=_reclaimSpace();
      if(freed>0){
        try{localStorage.setItem('fb4',data);localOk=true;
          notify('♻ Storage was full — auto-removed '+freed+' old auto-snapshot'+(freed!==1?'s':'')+' so your work could save.');
          _logCullEvent(freed);
        }catch(e2){}
      }
    }
    if(!localOk)_reportLocalSaveError(e,data);
  }
  if(!localOk){
    // Unrecoverable local persistence failure. CRITICAL fix: on a real edit,
    // do NOT advance lastModified or push to the cloud. The old code fell
    // through and pushed anyway, leaving this device's disk behind the cloud
    // and silently desyncing it on the next reload — the "sync stopped working
    // after switching devices" bug. Keep the edit in memory only, loudly
    // flagged, until the user frees space.
    if(!_skipFbWrite){S.lastModified=_prevLM;updateSyncStatus('error');}
    return;
  }
  // Local write succeeded — clear any stale failure banner, keep the key
  // entry's boardId in sync, and warn using the SAME percentage-based
  // ceiling that drives the Backups button and storage bar (no more
  // separately-hardcoded thresholds that can disagree with each other).
  _hideSaveErrorBanner();
  var _ck=_activeKey||(localStorage.getItem('fb4_active_key'));
  if(S.boardId&&_ck){var _klk=getKeys();var _kle=_klk.find(function(k){return k.key===_ck;});if(_kle&&_kle.boardId!==S.boardId){_kle.boardId=S.boardId;setKeys(_klk);}}
  var stats=_storageStats();
  if(stats.pct>=80&&!save._warned){
    save._warned=true;
    notify('⚠️ Storage at '+stats.pct+'% ('+Math.round(stats.used/1024/1024*10)/10+'MB of '+(stats.isEstimate?'~':'')+Math.round(stats.ceiling/1024/1024*10)/10+'MB, all boards) — export a backup or clear old snapshots soon.');
  }else if(stats.pct<80){save._warned=false;}
  _updateBackupsBtnState();
  // ── Idle auto-snapshot: fires 20min after the last real user action ──
  if(!_skipFbWrite&&!_undoInProgress){
    _savesSinceAutoSnap++;
    clearTimeout(_idleSnapTimer);
    _idleSnapTimer=setTimeout(function(){
      if(_savesSinceAutoSnap>0){
        _createAutoSnap('Idle checkpoint \u2013 '+new Date().toLocaleTimeString(),'idle');
      }
    },20*60*1000);
  }
  if(!_skipFbWrite)usbSave();
  if(FIREBASE_ENABLED&&_syncRef&&_activeKey&&!_skipFbWrite&&!_usbMode){
    clearTimeout(_syncTimer);
    _syncTimer=setTimeout(function(){
      if(!_isSafeWrite(S)){
        updateSyncStatus('error');
        notify('🛑 Sync blocked — this write would delete most of your board data. Switch boards or reload to resync.');
        console.error('Firebase write blocked by safety gate. Baseline:',_remoteBaseline,'Attempted:',{cards:_syncCardCount(S),cols:S.cols&&S.cols.length,groups:S.groups&&S.groups.length});
        return;
      }
      _pendingWrites++;
      updateSyncStatus('syncing');
      _syncRef.set(S).then(function(){
        _pendingWrites=Math.max(0,_pendingWrites-1);
        _setRemoteBaseline(S); // update baseline to confirmed state
        if(_pendingWrites===0)updateSyncStatus('synced');
      }).catch(function(err){
        _pendingWrites=Math.max(0,_pendingWrites-1);
        updateSyncStatus('error');
        console.error('[Sync] Firebase write failed:',err);
        // This is the main "why isn't it syncing" signal — previously only the
        // badge changed color and the failure was logged silently to console.
        var code=err&&err.code,msg;
        if(code==='PERMISSION_DENIED'){
          msg='⚠ Cloud sync FAILED — permission denied by Firebase rules (or you were signed out). Local copy is safe; cloud is now out of date.';
        }else if(typeof navigator!=='undefined'&&navigator.onLine===false){
          msg='⚠ Cloud sync FAILED — this device is offline. Local copy is safe; will retry automatically once reconnected.';
        }else if(code==='UNAVAILABLE'||code==='NETWORK_ERROR'){
          msg='⚠ Cloud sync FAILED — could not reach Firebase (network/server issue). Local copy is safe; will retry.';
        }else{
          msg='⚠ Cloud sync FAILED — '+(code||(err&&err.name)||'unknown error')+(err&&err.message?': '+err.message:'')+'. Local copy is safe — see console.';
        }
        notify(msg);
      });
    },600);
  }
}

// On page load: check IndexedDB for a stored USB handle. If found, show a one-click reconnect
// banner — the browser will prompt for permission, then USB sync resumes automatically.
function _usbCheckStoredHandle(){
  if(!window.showDirectoryPicker)return; // not supported or blocked — skip silently; user will get guidance when they try to enable
  _usbLoadStoredHandle(function(handle){
    if(!handle)return;
    // Check if permission is already granted (drive still plugged in) or needs re-prompt
    handle.queryPermission({mode:'readwrite'}).then(function(perm){
      if(perm==='granted'){
        // Drive is still accessible — reconnect silently
        _usbWasCloudActive=!!_activeKey;
        if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncListener=null;}
        _usbMode=true;_usbHandle=handle;

        _usbShowReconnectBanner(handle);
      }
      // perm==='denied': stored handle is no longer accessible, leave it
    }).catch(function(){
      // queryPermission not supported or handle stale — show the banner anyway
      _usbShowReconnectBanner(handle);
    });
  });
}

// Returns true if running in Brave (navigator.brave is injected by Brave itself)
function _isBrave(){return !!(window.navigator&&window.navigator.brave);}

// Human-readable browser hint for File System API errors
function _fsBrowserHint(){
  if(_isBrave())
    return 'You are using Brave. Go to Shields (lion icon) → turn off "Block fingerprinting" or set it to Standard, then try again.';
  return 'USB sync requires Chrome, Edge, or Brave (Chrome/Edge with File System Access API support).';

function enableUSBMode(){
  if(!window.showDirectoryPicker){
    notify('⚠️ '+_fsBrowserHint());return;
  }
  var hasCloud=!!_activeKey;
  var msg='Enable USB Drive mode?\n\n';
  msg+='• Your board will save to the USB drive on every change.\n';
  msg+='• Cloud sync will be paused while USB mode is active.\n';
  if(hasCloud)msg+='• Cloud connection will be suspended (data stays in Firebase).\n';
  msg+='\nUSB mode applies to the current board. Reconnect the drive after any page reload.';
  if(!confirm(msg))return;
  _usbWasCloudActive=hasCloud;
  // Pause the Firebase listener so remote updates cannot overwrite local state while on USB
  if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncListener=null;}
  _usbMode=true;
  updateUSBStatus('connecting');
  selectDriveFolder();
}

function disableUSBMode(){
  // Always snapshot before teardown — this is the last safe recovery point
  _autoSnapBefore('Before: USB mode disabled – '+new Date().toLocaleTimeString());
  _stopUSBHeartbeat();
  clearTimeout(_usbSaveTimer);
  _usbHandle=null;_usbConnected=false;_usbMode=false;_usbIndex=null;
  _usbClearHandle();
  updateUSBStatus('off');
  if(_usbWasCloudActive&&_activeKey){
    // Restore the Firebase listener that was paused when USB mode started
    updateSyncStatus('syncing');
    if(_syncRef&&!_syncListener){
      _syncListener=_syncRef.on('value',function(snap){
        if(_pendingWrites>0)return;
        var remote=snap.val();if(!remote)return;
        migrateRemote(remote);
        var localTs=S.lastModified||0,remoteTs=remote.lastModified||0;
        if(localTs>=remoteTs){
          _pendingWrites++;
          _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);updateSyncStatus('synced');}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);updateSyncStatus('error');});
        }else{
          _setRemoteBaseline(remote);_applyRemote(remote);updateSyncStatus('synced');
        }
      },function(){updateSyncStatus('error');});
    }else if(_syncRef){
      _pendingWrites++;
      _syncRef.set(S).then(function(){_pendingWrites=Math.max(0,_pendingWrites-1);_setRemoteBaseline(S);updateSyncStatus('synced');}).catch(function(){_pendingWrites=Math.max(0,_pendingWrites-1);updateSyncStatus('error');});
    }
  }else{
    updateSyncStatus('local');
  }
  showBackupModal();
  notify('☁️ USB mode disabled.');
}

function _usbBoardFilename(boardId){return 'board-'+boardId+'.json';}

function _usbReadIndex(){

  }).then(function(txt){

  });

function _usbWriteIndex(index){
  if(!_usbHandle)return Promise.resolve();
  return _usbHandle.getFileHandle(USB_INDEX_FILENAME,{create:true}).then(function(fh){
    return fh.createWritable();
  }).then(function(w){
    return w.write(JSON.stringify(index)).then(function(){return w.close();});
  });
}

function _usbUpdateIndex(state){
  var idx=_usbIndex||[];
  var entry={boardId:state.boardId,name:(state.prefs&&state.prefs.boardName)||'Board',
    lastModified:state.lastModified||0,
    cards:(state.cols||[]).reduce(function(n,c){return n+(c.cards||[]).filter(function(k){return !k.archived;}).length;},0)};
  var found=false;
  for(var i=0;i<idx.length;i++){if(idx[i].boardId===state.boardId){idx[i]=entry;found=true;break;}}
  if(!found){idx.push(entry);updateUSBStatus('synced');}
  _usbIndex=idx;
  return _usbWriteIndex(idx);
}

function _usbWriteBoard(state){
  if(!_usbHandle)return Promise.resolve();
  return _usbHandle.getFileHandle(_usbBoardFilename(state.boardId),{create:true}).then(function(fh){
    return fh.createWritable();
  }).then(function(w){
    return w.write(JSON.stringify(state)).then(function(){return w.close();});
  }).catch(function(e){
    console.warn('[USB] Write failed:',e);
    handleUSBLost();
  });
}

function _usbWriteState(state){
  if(!_usbHandle)return Promise.resolve();
  return _usbWriteBoard(state).then(function(){return _usbUpdateIndex(state);}).catch(function(e){
    console.warn('[USB] Write failed:',e);handleUSBLost();

}

function _usbImportBoard(boardId){

    return fh.getFile().then(function(f){return f.text();});
  }).then(function(txt){
    var remote=JSON.parse(txt);
    document.getElementById('modal-root').innerHTML='';
    _usbConfirmLoad(remote,'USB drive',function(){
      // After loading, enable USB mode on this drive for ongoing sync

      if(confirm(msg)){
        if(_syncRef&&_syncListener){_syncRef.off('value',_syncListener);_syncListener=null;}
        _usbWasCloudActive=!!_activeKey;

function _usbImportEnableMode(){

function connectUSB(handle){
  _usbHandle=handle;
  updateUSBStatus('connecting');
  _usbReadIndex().then(function(index){
    _usbIndex=index;
    var entry=null;
    for(var i=0;i<index.length;i++){if(index[i].boardId===S.boardId){entry=index[i];break;}}
    if(entry){
      return handle.getFileHandle(_usbBoardFilename(S.boardId)).then(function(fh){
        return fh.getFile().then(function(f){return f.text();});
      }).then(function(txt){
        var remote=JSON.parse(txt);
        var localTs=S.lastModified||0,remoteTs=remote.lastModified||0;
        if(remoteTs>localTs){
          _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();if(_usbHandle)_usbSaveHandle(_usbHandle);
          _usbConfirmLoad(remote,'drive',function(){
            if(document.querySelector('#modal-root .overlay'))showBackupModal();
          });
        }else{
          _usbWriteState(S);
          notify('💾 Drive updated — your local board was newer.');
          _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();if(_usbHandle)_usbSaveHandle(_usbHandle);
          if(document.querySelector('#modal-root .overlay'))showBackupModal();
        }
      });
    }else{
      showUSBBoardPickerModal(index);
    }
  }).catch(function(e){
    if(e.name==='NotFoundError'){
      handle.getFileHandle('flowboard-data.json').then(function(fh){
        return fh.getFile().then(function(f){return f.text();});
      }).then(function(txt){
        var legacy=JSON.parse(txt);
        if(!legacy.boardId)legacy.boardId=uid();
        var idx=[{boardId:legacy.boardId,name:(legacy.prefs&&legacy.prefs.boardName)||'Board',
          lastModified:legacy.lastModified||0,
          cards:(legacy.cols||[]).reduce(function(n,c){return n+(c.cards||[]).filter(function(k){return !k.archived;}).length;},0)}];
        _usbIndex=idx;
        return _usbWriteIndex(idx).then(function(){return _usbWriteBoard(legacy);}).then(function(){return legacy;});
      }).then(function(legacy){
        if(legacy.boardId===S.boardId){
          var localTs=S.lastModified||0,remoteTs=legacy.lastModified||0;
          if(remoteTs>localTs){
            _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();if(_usbHandle)_usbSaveHandle(_usbHandle);
            _usbConfirmLoad(legacy,'drive (legacy)',function(){
              if(document.querySelector('#modal-root .overlay'))showBackupModal();
            });
          }else{
            _usbWriteState(S);
            notify('💾 Drive migrated to new format — your local board was newer.');
            _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();if(_usbHandle)_usbSaveHandle(_usbHandle);
            if(document.querySelector('#modal-root .overlay'))showBackupModal();
          }
        }else{
          showUSBBoardPickerModal(_usbIndex);
        }
      }).catch(function(le){
        if(le.name==='NotFoundError'){
          _usbWriteState(S).then(function(){
            _usbConnected=true;updateUSBStatus('synced');_startUSBHeartbeat();if(_usbHandle)_usbSaveHandle(_usbHandle);
            notify('💾 Board saved to USB drive!');
            if(document.querySelector('#modal-root .overlay'))showBackupModal();
          });
        }else{
          _usbMode=false;_usbHandle=null;
          updateSyncStatus(_activeKey?'synced':'local');
          notify('❌ Drive error: '+le.message);
        }
      });
    }else{
      _usbMode=false;_usbHandle=null;
      updateSyncStatus(_activeKey?'synced':'local');
      notify('❌ Drive error: '+e.message);
    }
  });
}

// ── BACKUP STORAGE BACKEND (IndexedDB, with localStorage fallback) ──────────
// Backups (manual + auto snapshots) are full board copies — dozens of them —
// and are what fills the ~5MB localStorage quota. They belong in IndexedDB
// (disk-backed, far larger) instead. The LIVE board (fb4) intentionally stays
// in localStorage so it loads synchronously at boot; a total IDB failure can
// therefore never block the app, only cost backup history. This layer is
// async; a synchronous in-memory mirror (added in the next commit) sits in
// front of it so the existing call sites stay unchanged.
//
// Every operation degrades safely: if IndexedDB is unavailable or the
// file:// origin doesn't persist it, _idbAvailable() reports false and the
// caller falls back to the original localStorage path. Nothing throws.
var _idb=null,_idbReady=null,_idbUsable=null;
var IDB_NAME='flowboard_backups',IDB_VER=1,IDB_STORES=['manual','auto'];
function _openIdb(){
  if(_idbReady)return _idbReady;
  _idbReady=new Promise(function(resolve){
    if(typeof indexedDB==='undefined'||!indexedDB){resolve(null);return;}
    var req;
    try{req=indexedDB.open(IDB_NAME,IDB_VER);}catch(e){resolve(null);return;}
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      IDB_STORES.forEach(function(s){if(!db.objectStoreNames.contains(s))db.createObjectStore(s);});
    };
    req.onsuccess=function(e){_idb=e.target.result;resolve(_idb);};
    req.onerror=function(){resolve(null);};
    req.onblocked=function(){resolve(null);};
  });
  return _idbReady;
}
function _idbTx(store,mode){
  return _openIdb().then(function(db){
    if(!db)return null;
    try{return db.transaction(store,mode).objectStore(store);}catch(e){return null;}
  });
}
function _idbGet(store,key){
  return _idbTx(store,'readonly').then(function(os){
    if(!os)return null;
    return new Promise(function(resolve){
      try{var r=os.get(key);r.onsuccess=function(){resolve(r.result==null?null:r.result);};r.onerror=function(){resolve(null);};}
      catch(e){resolve(null);}
    });
  });
}
function _idbPut(store,key,val){
  return _idbTx(store,'readwrite').then(function(os){
    if(!os)return false;
    return new Promise(function(resolve){
      try{
        var tx=os.transaction;os.put(val,key);
        tx.oncomplete=function(){resolve(true);};
        tx.onerror=function(){resolve(false);};
        tx.onabort=function(){resolve(false);};
      }catch(e){resolve(false);}
    });
  });
}
function _idbDelete(store,key){
  return _idbTx(store,'readwrite').then(function(os){
    if(!os)return false;
    return new Promise(function(resolve){
      try{
        var tx=os.transaction;os.delete(key);
        tx.oncomplete=function(){resolve(true);};
        tx.onerror=function(){resolve(false);};
      }catch(e){resolve(false);}
    });
  });
}
function _idbKeys(store){
  return _idbTx(store,'readonly').then(function(os){
    if(!os)return[];
    return new Promise(function(resolve){
      try{var r=os.getAllKeys();r.onsuccess=function(){resolve(r.result||[]);};r.onerror=function(){resolve([]);};}
      catch(e){resolve([]);}
    });
  });
}
// One-time usability probe: IndexedDB can exist but silently fail to persist
// (private mode, or opaque file:// origins that reset per load). We verify with
// a real round-trip write/read/delete before trusting it. Cached for the session.
function _idbCheckUsable(){
  if(_idbUsable)return _idbUsable;
  var probeKey='__idb_probe__',probeVal={t:1};
  _idbUsable=_idbPut('manual',probeKey,probeVal).then(function(ok){
    if(!ok)return false;
    return _idbGet('manual',probeKey).then(function(got){
      var good=!!(got&&got.t===1);
      return _idbDelete('manual',probeKey).then(function(){return good;});
    });
  }).catch(function(){return false;});
  return _idbUsable;
}
// ── SYNCHRONOUS MIRROR over the async IDB backend ──────────────────────────
// getBaks/getAutoBaks stay synchronous (call sites unchanged) by returning an
// in-memory array that mirrors the current board's IDB record. Writes update
// the mirror and persist to IDB immediately (puts are cheap; no debounce, so
// there's no "lost on tab close" window). If IDB is unusable, _backupsUseIdb
// stays false and every function falls back to the original localStorage path.
var _backupsUseIdb=false;
var _baksMirror=null,_baksMirrorKey=null,_hydratingManual=null;
var _autoMirror=null,_autoMirrorKey=null,_hydratingAuto=null;
function _hydrateManualMirror(){
  var k=_bakKey();
  if(_baksMirrorKey===k)return Promise.resolve();
  if(_hydratingManual&&_hydratingManual._k===k)return _hydratingManual;
  var p=_idbGet('manual',k).then(function(arr){_baksMirror=arr||[];_baksMirrorKey=k;})
    .catch(function(){_baksMirror=[];_baksMirrorKey=k;})
    .then(function(){if(_hydratingManual===p)_hydratingManual=null;});
  p._k=k;_hydratingManual=p;return p;
}
function _hydrateAutoMirror(){
  var k=_autoKey();
  if(_autoMirrorKey===k)return Promise.resolve();
  if(_hydratingAuto&&_hydratingAuto._k===k)return _hydratingAuto;
  var p=_idbGet('auto',k).then(function(arr){_autoMirror=arr||[];_autoMirrorKey=k;})
    .catch(function(){_autoMirror=[];_autoMirrorKey=k;})
    .then(function(){if(_hydratingAuto===p)_hydratingAuto=null;});
  p._k=k;_hydratingAuto=p;return p;
}
// One-time move of EVERY board's backups from localStorage into IDB. Sequential
// (bounded memory, no txn storm), verified round-trip before each original is
// deleted, corrupt entries left untouched. Gated by a flag so it runs once.
function _migrateAllBackupsToIdb(){
  if(localStorage.getItem('fb4_idb_migrated')==='1')return Promise.resolve();
  var jobs=[];
  for(var i=0;i<localStorage.length;i++){
    var lk=localStorage.key(i);if(!lk)continue;
    if(lk.indexOf('fb4_baks_')===0)jobs.push({store:'manual',key:lk});
    else if(lk.indexOf('fb4_auto_')===0)jobs.push({store:'auto',key:lk});
  }
  return jobs.reduce(function(chain,job){
    return chain.then(function(){
      var raw=localStorage.getItem(job.key);if(raw==null)return;
      var parsed;try{parsed=JSON.parse(raw);}catch(e){return;} // corrupt — leave in place
      return _idbPut(job.store,job.key,parsed).then(function(ok){
        if(!ok)return; // put failed — keep the localStorage original, retry next boot
        return _idbGet(job.store,job.key).then(function(verify){
          if(verify!=null){try{localStorage.removeItem(job.key);}catch(e){}} // verified copy → reclaim space
        });
      });
    });
  },Promise.resolve()).then(function(){
    try{localStorage.setItem('fb4_idb_migrated','1');}catch(e){}
  });
}
// Ask the browser to mark this origin's storage "persistent" so IndexedDB
// isn't silently evicted under disk pressure. Best-effort: some browsers
// auto-grant, some prompt, some ignore it — we never block on the result.
// (Does not defend against Safari/iOS's 7-day inactivity purge; the cloud
// sync + export paths remain the real backstop there.)
function _requestPersistentStorage(){
  try{
    if(navigator.storage&&navigator.storage.persist&&navigator.storage.persisted){
      navigator.storage.persisted().then(function(already){
        if(!already)navigator.storage.persist().then(function(g){console.log('[Backups] persistent storage '+(g?'granted':'not granted'));}).catch(function(){});
      }).catch(function(){});
    }
  }catch(e){}
}
// Boot entry point: decide backend, migrate, hydrate current board's mirrors.
function _initBackupStore(){
  return _idbCheckUsable().then(function(usable){
    _backupsUseIdb=!!usable;
    if(!usable)return; // stay on localStorage — original behavior, nothing to migrate
    _requestPersistentStorage();
    return _migrateAllBackupsToIdb().then(function(){
      return Promise.all([_hydrateManualMirror(),_hydrateAutoMirror()]);
    });
  }).catch(function(){_backupsUseIdb=false;});
}
function _bakKey(){return 'fb4_baks_'+(S.boardId||'default');}
function _lsGetBaks(){try{return JSON.parse(localStorage.getItem(_bakKey())||'[]');}catch(e){return[];}}
function _lsSetBaks(a){try{localStorage.setItem(_bakKey(),JSON.stringify(a));}catch(e){}}
function getBaks(){
  if(!_backupsUseIdb)return _lsGetBaks();
  if(_baksMirrorKey!==_bakKey()){_hydrateManualMirror();return[];} // stale/unhydrated → safe empty until hydrated
  return _baksMirror||[];
}
function setBaks(a){
  if(!_backupsUseIdb)return _lsSetBaks(a);
  var k=_bakKey();
  if(_baksMirrorKey!==k){ // mirror not hydrated for this board — never persist, would risk clobbering unloaded data
    console.warn('[Backups] setBaks skipped — mirror not hydrated for '+k);_hydrateManualMirror();return;
  }
  _baksMirror=a;_idbPut('manual',k,a);
}
